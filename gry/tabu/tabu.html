<script>
/* most do hosta (index.html): pokoje online przez Firebase + nick + kolor + statystyki */
(function(){
var P=window.parent;
function G(){try{return P&&P!==window&&P.tabuBridge?P.tabuBridge():null}catch(e){return null}}
window.__tbNick=function(){try{var b=G();return b&&b.nick()||''}catch(e){return''}};
window.__tbCol=function(){try{var b=G();return b&&b.col()||''}catch(e){return''}};
window.__tbStats=function(code,gid,players,r){try{var b=G();if(b)b.stats(code,gid,players,r)}catch(e){}};
window.__tbNet=function(){try{var b=G();return !!(b&&b.net())}catch(e){return false}};
window.__tbJoin=async function(name){
  var B=G();
  if(!B||!B.net())throw new Error('Brak połączenia z Firebase');
  var uid=await B.auth();
  var path='tttRooms/'+String(name).toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,40);
  var ref=B.db.ref(path),pr=ref.child('peers'),ms=ref.child('msgs');
  var cache={},pc=[],rc=[],h={},gone=false,first=true,firstC=true;
  var startKey=ms.push().key;
  await pr.child(uid).set({t:B.ts});
  try{pr.child(uid).onDisconnect().remove()}catch(e){}
  function fire(c){pc.forEach(function(f){try{f(c)}catch(e){console.error(e)}})}
  var onVal=pr.on('value',function(s){
    var v=s.val()||{},joined=[],left=[],changed=[];
    Object.keys(v).forEach(function(k){var p=v[k]&&v[k].p||{};
      if(!cache[k]&&!first&&k!==uid)joined.push({peer:k});
      else if(cache[k]&&k!==uid&&JSON.stringify(cache[k])!==JSON.stringify(p))changed.push({peer:k});
      cache[k]=p});
    Object.keys(cache).forEach(function(k){if(!v[k]){delete cache[k];if(k!==uid)left.push({peer:k})}});
    first=false;fire({joined:joined,left:left,changed:changed});
  });
  var cref=B.db.ref('.info/connected');
  var onConn=cref.on('value',function(s){
    if(s.val()!==true)return;
    if(firstC){firstC=false;return}
    if(gone)return;
    try{pr.child(uid).set({t:B.ts,p:cache[uid]||{}});pr.child(uid).onDisconnect().remove()}catch(e){}
    rc.forEach(function(f){try{f()}catch(e){console.error(e)}});
  });
  await pr.once('value').then(function(s){var v=s.val()||{};Object.keys(v).forEach(function(k){cache[k]=v[k]&&v[k].p||{}})});
  var q=ms.orderByKey().startAt(startKey);
  var onMsg=q.on('child_added',function(s){var v=s.val();if(!v||!v.t)return;var fs=h[v.t];if(!fs)return;
    var m={peer:v.peer,isMe:v.peer===uid,ts:+v.ts||Date.now(),data:v.data===undefined?null:v.data};
    fs.slice().forEach(function(f){try{f(m)}catch(e){console.error(e)}})});
  return{
    uid:uid,
    peers:function(){return Object.keys(cache).map(function(k){return{peer:k,isMe:k===uid,presence:cache[k]||{}}})},
    presence:function(o){cache[uid]=o;return pr.child(uid).set({t:B.ts,p:o})},
    on:function(t,f){(h[t]=h[t]||[]).push(f);return function(){h[t]=(h[t]||[]).filter(function(x){return x!==f})}},
    onPeers:function(f){pc.push(f);return function(){pc=pc.filter(function(x){return x!==f})}},
    onReconnect:function(f){rc.push(f)},
    emit:function(t,d){if(gone)return Promise.resolve();var r=ms.push();var p=r.set({t:t,peer:uid,data:d===undefined?null:d,ts:B.ts});setTimeout(function(){r.remove().catch(function(){})},20000);return p},
    leave:function(){if(gone)return Promise.resolve();gone=true;try{pr.off('value',onVal);q.off('child_added',onMsg);cref.off('value',onConn)}catch(e){}
      try{pr.child(uid).onDisconnect().cancel()}catch(e){}
      return pr.child(uid).remove().then(function(){return pr.once('value')}).then(function(s){if(!s.val())return ref.remove()}).catch(function(){})}
  };
};
})();

</script>

 else if(HS.ph==="turn"){const d=m.peer===HS.d;if(d&&t==="ok"){HS.sc[HS.t]++;HS.m="✅ Punkt!";pickCard();push()}else if(d&&t==="sk"){HS.m="⏭ Pominięto";pickCard();push()}else if(t==="bz"&&(L||p&&p.presence.team!=null&&p.presence.team!==HS.t)){HS.sc[HS.t]--;HS.m="🚫 TABU! −1 punkt";pickCard();push();navigator.vibrate&&navigator.vibrate(200)}}}

 if(L||!S||S.ph!=="end"||!S.gid||recd===S.gid||me.team==null||!window.__tbStats)return;

 if(S.ph==="lobby"){const col=t=>members(t).map(p=>`<div class="pl">${pname(p)}${p.presence.host?" 👑":""}</div>`).join("")||`<div class="mu">pusto</div>`;

  $.innerHTML=head+warn+(L?"":`<div class="box"><div class="mu" style="text-align:center">Kod pokoju – podaj go znajomym</div><div class="code">${esc(code)}</div></div><div class="box"><div class="row">${tbtn(0)}${tbtn(1)}</div><div class="row" style="margin-top:10px"><div><b class="A">${TN[0]}</b>${col(0)}</div><div><b class="B">${TN[1]}</b>${col(1)}</div></div>${un?`<p class="mu">Bez zespołu: ${un}</p>`:""}</div>`)+
  (me.host?`<div class="box"><div class="row">${[45,60,90].map(v=>`<button class="${opt.time==v?"on":""}" onclick="opt.time=${v};draw()">${v}s</button>`).join("")}</div><div class="row" style="margin:10px 0">${[2,3,4].map(v=>`<button class="${opt.rounds==v?"on":""}" onclick="opt.rounds=${v};draw()">${v} rund</button>`).join("")}</div><button class="${opt.adult?"on":""}" onclick="opt.adult=!opt.adult;draw()">Karty +18: ${opt.adult?"TAK":"NIE"}</button><br><br><button class="p" onclick="start()">Start gry</button><p class="mu">Potrzeba min. 1 gracza w każdym zespole.</p></div>`:`<p class="sub">Czekam aż host wystartuje grę…</p>`)+leaveBtn();return}
 if(S.ph==="end"){const w=S.sc[0]==S.sc[1]?"Remis!":S.sc[0]>S.sc[1]?TN[0]+" wygrywa!":TN[1]+" wygrywa!";
  const ros=t=>members(t).map(p=>`<div class="pl">${pname(p)}</div>`).join("");
  $.innerHTML=head+warn+`<div class="box big">🏆 ${w}</div>`+scores()+(L?"":`<div class="box"><div class="row"><div><b class="A">${TN[0]}</b>${ros(0)}</div><div><b class="B">${TN[1]}</b>${ros(1)}</div></div></div>`)+(me.host?`<button class="p" onclick="HS={ph:'lobby'};push()">Wróć do lobby</button>`:"")+leaveBtn();
  recStats();return}
 const iD=S.d===mp,opp=me.team!=null&&me.team!==S.t,col=S.t?"B":"A";
 const dn=`<span style="color:${esc(colOf(S.dc))}">${S.dc?dot(S.dc):""}${esc(S.dn)}</span>`;
 if(S.ph==="ready"){$.innerHTML=head+warn+scores()+`<div class="box big">Kolej: <span class="${col}">${TN[S.t]}</span><br>Opisuje: ${dn}</div>`+(iD?`<button class="p" onclick="act('go')">Zaczynam turę!</button>`:`<p class="sub">${opp?"Będziesz pilnować zakazanych słów 🚫":"Zgadujecie na głos, nie podglądaj!"}</p>`)+(me.host?`<button onclick="clearInterval(tm);HS.ti++;nextTurn()">Pomiń kolejkę (host)</button>`:"")+leaveBtn();return}
 const c=CARDS[S.c];let mid;
 if(iD)mid=`<div class="card"><h2>${esc(c.w)}</h2>${c.t.map(x=>`<div class="t">${esc(x)}</div>`).join("")}</div><div class="row"><button class="ok" onclick="act('ok')">✓ Odgadnięte</button><button onclick="act('sk')">⏭ Pomiń</button></div>${L?`<button class="bad" onclick="act('bz')">🚫 TABU! (−1)</button>`:""}`;
 else if(opp)mid=`<div class="card"><h2>${esc(c.w)}</h2>${c.t.map(x=>`<div class="t">${esc(x)}</div>`).join("")}</div><button class="bad" onclick="act('bz')">🚫 TABU!</button><p class="mu" style="text-align:center">Naciśnij, gdy opisujący powie zakazane słowo.</p>`;
 else mid=`<div class="box big">🤔 Zgadujcie na głos!<br><span class="mu">${dn} opisuje hasło</span></div>`;
 $.innerHTML=head+warn+scores()+`<div class="tm ${col}"><span id="tm">${S.left}</span>s</div><div class="msg">${esc(S.m||"")}</div>`+mid+(me.host&&!L?"":leaveBtn())}
/* hooki huba */
window.__tabuLeave=()=>{try{if(R)leaveRoom()}catch(e){}};
window.__tabuRefresh=()=>{try{if(!R)join()}catch(e){}};
join();

</script></body></html>
