/* most do Firebase hosta (index.html): pokoje online + nick + kolor + statystyki */
(function(){
var P=window.parent,B=null;
try{B=P&&P!==window&&P.pnmBridge&&P.pnmBridge()}catch(e){B=null}
window.__pnNick=function(){try{return B&&B.nick()||''}catch(e){return''}};
window.__pnCol=function(){try{return B&&B.col()||''}catch(e){return''}};
window.__pnStats=function(code,gid,players,r){try{if(B)B.stats(code,gid,players,r)}catch(e){}};
window.__pnAuth=function(){return B.auth()};
window.__pnNet=!!(B&&B.net());
if(!B||!B.net())return;
window.__pnJoin=async function(name){
  var uid=await B.auth();
  var path='tttRooms/'+String(name).toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,40);
  var ref=B.db.ref(path),pr=ref.child('peers'),ms=ref.child('msgs');
  var cache={},pc=[],rc=[],h={},gone=false,first=true,firstC=true;
  var startKey=ms.push().key;
  await pr.child(uid).set({t:B.ts});
  try{pr.child(uid).onDisconnect().remove()}catch(e){}
  function fire(c){pc.forEach(function(f){try{f(c)}catch(e){console.error(e)}})}
  var onVal=pr.on('value',function(s){
    var v=s.val()||{},joined=[],left=[],changed=[];
    Object.keys(v).forEach(function(k){var p=v[k]&&v[k].p||{};
      if(!cache[k]&&!first&&k!==uid)joined.push({peer:k});
      else if(cache[k]&&k!==uid&&JSON.stringify(cache[k])!==JSON.stringify(p))changed.push({peer:k});
      cache[k]=p});
    Object.keys(cache).forEach(function(k){if(!v[k]){delete cache[k];if(k!==uid)left.push({peer:k})}});
    first=false;fire({joined:joined,left:left,changed:changed});
  });
  /* po zerwaniu i wznowieniu połączenia odnawiamy obecność i prosimy o stan */
  var cref=B.db.ref('.info/connected');
  var onConn=cref.on('value',function(s){
    if(s.val()!==true)return;
    if(firstC){firstC=false;return}
    if(gone)return;
    try{pr.child(uid).set({t:B.ts});pr.child(uid).onDisconnect().remove()}catch(e){}
    rc.forEach(function(f){try{f()}catch(e){console.error(e)}});
  });
  await pr.once('value').then(function(s){var v=s.val()||{};Object.keys(v).forEach(function(k){cache[k]=v[k]&&v[k].p||{}})});
  var q=ms.orderByKey().startAt(startKey);
  var onMsg=q.on('child_added',function(s){var v=s.val();if(!v||!v.t)return;var fs=h[v.t];if(!fs)return;
    var m={peer:v.peer,isMe:v.peer===uid,ts:+v.ts||Date.now(),data:v.data===undefined?null:v.data};
    fs.slice().forEach(function(f){try{f(m)}catch(e){console.error(e)}})});
  return{
    uid:uid,
    peers:function(){return Object.keys(cache).map(function(k){return{peer:k,isMe:k===uid,presence:cache[k]||{}}})},
    presence:function(o){cache[uid]=o;return pr.child(uid).set({t:B.ts,p:o})},
    on:function(t,f){(h[t]=h[t]||[]).push(f);return function(){h[t]=(h[t]||[]).filter(function(x){return x!==f})}},
    onPeers:function(f){pc.push(f);return function(){pc=pc.filter(function(x){return x!==f})}},
    onReconnect:function(f){rc.push(f)},
    emit:function(t,d){if(gone)return Promise.resolve();var r=ms.push();var p=r.set({t:t,peer:uid,data:d===undefined?null:d,ts:B.ts});setTimeout(function(){r.remove().catch(function(){})},20000);return p},
    leave:function(){if(gone)return Promise.resolve();gone=true;try{pr.off('value',onVal);q.off('child_added',onMsg);cref.off('value',onConn)}catch(e){}
      try{pr.child(uid).onDisconnect().cancel()}catch(e){}
      return pr.child(uid).remove().then(function(){return pr.once('value')}).then(function(s){if(!s.val())return ref.remove()}).catch(function(){})}
  };
};
})();
</script>

function mkStore(write){
 const st={},ls={};
 const par=p=>p.split("/").slice(0,-1).join("/");
 const fire=p=>[p,par(p)].forEach(k=>(ls[k]||[]).slice().forEach(f=>f()));
 const on=(k,f)=>{(ls[k]=ls[k]||[]).push(f);f();return()=>{ls[k]=ls[k].filter(x=>x!==f)}};
 const cp=o=>o===undefined?undefined:JSON.parse(JSON.stringify(o));
 const ds=p=>({id:p.split("/").pop(),exists:p in st,data:()=>p in st?cp(st[p]):undefined});
 const qs=c=>{const d=Object.keys(st).filter(k=>k.startsWith(c+"/")&&k.indexOf("/",c.length+1)<0).map(ds);return{docs:d,size:d.length,empty:!d.length}};
 const put=(p,d)=>{if(d===null||d===undefined)delete st[p];else st[p]=d;fire(p)};
 const merge=(k,p,d)=>k==="del"?null:k==="set"?cp(d):{...(st[p]||{}),...cp(d)};
 return{st,put,merge,
  db:{doc:p=>({id:p.split("/").pop(),path:p,get:async()=>ds(p),set:d=>write("set",p,d),update:d=>write("update",p,d),delete:()=>write("del",p),onSnapshot:f=>on(p,()=>f(ds(p)))}),
   collection:c=>({get:async()=>qs(c),onSnapshot:f=>on(c,()=>f(qs(c)))})}};
}
function localDb(){const s=mkStore(async(k,p,d)=>{s.put(p,s.merge(k,p,d))});return s.db}

 app.innerHTML=logo+`<div class="card center"><div class="win">${title}</div>
 <div class="pod">${order.map(i=>ps[i]?`<div><div style="font-size:15px;margin-bottom:6px"><b>${esc(ps[i].name)}</b><br><span style="color:var(--gold)">${fm(ps[i].money)}</span></div><div class="blk" style="height:${h[i]}px;background:${pcol(ps[i])};color:${ink(pcol(ps[i]))}">${i+1}</div></div>`:"").join("")}</div>
 <button class="go" id="ag">Zagraj jeszcze raz</button></div>`;
 $("#ag").onclick=()=>toHome();
 if(!S.local&&NETC&&!S.statDone){
  S.statDone=1;
  const me=ps.find(p=>p.id===ME),gid=S.game&&S.game.gid;
  if(me&&gid&&ps.length>=2)window.__pnStats(S.code,gid,ps.map(p=>({uid:p.id,name:p.name})),me.money===ps[0].money?(top.length>1?"d":"w"):"l");
 }
 if(!S.conf){S.conf=1;for(let i=0;i<70;i++){const c=document.createElement("i");c.className="conf";c.style.cssText=`left:${Math.random()*100}vw;background:${PC[i%3]};animation-duration:${2+Math.random()*3}s;animation-delay:${Math.random()*1.5}s`;document.body.appendChild(c);setTimeout(()=>c.remove(),7000)}}
}
setInterval(()=>{
 const g=S.game;if(!g||g.phase!=="question")return;
 const tb=$("#tb");if(tb)tb.style.width=Math.max(0,Math.min(100,(g.deadline-Date.now())/TIME*100))+"%";
 tick();
},400);
window.__pnmLeave=()=>{try{if(S.view!=="home"||NETC)toHome()}catch(e){}};
window.__pnmRefresh=()=>{try{if(S.view==="home"&&!NETC)render()}catch(e){}};
try{const v=cleanN(localStorage.getItem("pnm_nick"));if(v)S.nm=v}catch(e){}
render();
</script>
