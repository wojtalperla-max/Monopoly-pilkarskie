<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Imperia – gra online</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap"><link rel="stylesheet" href="imperia.css?v=7"><script>/* ekran startowy/pokój: używamy przycisku „Menu główne” z portalu (jak w innych grach) – własny jest ukryty */
(function(){
  function shown(e){
    if(!e)return false;
    var r=e.getBoundingClientRect(),cs=getComputedStyle(e);
    return r.width>40&&r.height>40&&cs.display!=='none'&&cs.visibility!=='hidden';
  }
  function tick(){
    var on=false;
    try{on=shown(document.getElementById('lobby'))||shown(document.getElementById('room'))}catch(x){}
    var b=document.getElementById('ilMenu');if(b)b.style.display='none';
    if(window.parent!==window){
      try{window.parent.postMessage({type:'gmenu-lobby',lobby:on},'*')}catch(x){}
    }
  }
  setInterval(tick,250);document.addEventListener('DOMContentLoaded',tick);
})();
</script>
</head><body>
<button type="button" id="ilMenu" class="il-menu">← Menu główne</button>
<div id="lobby" class="il">
  <div class="il-bg" id="ilBg" aria-hidden="true"></div>
  <div class="il-wrap">
    <div class="logo-lobby il-logo" role="img" aria-label="Imperia"></div>
    <p class="il-sub">Zbuduj królestwo. Odkryj ziemie. Zdominuj świat.</p>
    <div class="il-main">
      <button type="button" id="ilCreate" class="il-btn il-gold"><span class="il-ic">👑</span><span>Utwórz pokój</span></button>
      <button type="button" id="ilJoin" class="il-btn il-white"><span class="il-ic">🚪</span><span>Dołącz do znajomego</span></button>
    </div>
    <div id="ilRoomPane" class="il-pane">
      <h3 id="ilRoomTitle">Utwórz pokój</h3>
      <input id="kingdom" placeholder="Nazwa królestwa (np. Złota Korona)" maxlength="24" autocomplete="off">
      <input id="cd" placeholder="Kod pokoju od znajomego" maxlength="8" autocomplete="off" style="text-transform:uppercase">
      <button type="button" id="ilGo" class="il-btn il-gold il-go"><span class="il-ic">⚔️</span><span id="ilGoTxt">Utwórz pokój</span></button>
    </div>
    <div class="err il-err" id="er" role="alert"></div>
    <div id="ilLocalPane" class="il-pane il-local">
      <div class="rm-badge">🎲 Gra lokalna</div>
      <p class="rm-info">Tryb na jednym urządzeniu. Ustaw <b>Ludzi: 0</b> i min. 2 AI, żeby włączyć <b>tryb obserwatora</b> (bez mgły wojny, możesz pomijać tury i oglądać statystyki).</p>
      <div class="il-opts">
        <label>Ludzi<select id="ln" onchange="localCivUI()"><option value="0">0 (obserwator)</option><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label>
        <label>AI<select id="la"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label>
        <label>Mapa<select id="ls"><option value="s">Mała</option><option value="m" selected>Średnia</option><option value="l">Duża</option><option value="xl">Bardzo duża</option><option value="xxl">Ogromna</option></select></label>
      </div>
      <div id="local-civs"></div>
      <button type="button" class="il-btn il-gold il-go" onclick="localGame()"><span class="il-ic">🎲</span><span>Graj lokalnie</span></button>
    </div>
    <button type="button" id="ilLocal" class="il-local-link">🎲 Gra lokalnie na jednym urządzeniu</button>
  </div>
</div>
<div id="room" class="il ilr" style="display:none"><div class="il-bg" id="rmBg" aria-hidden="true"></div><div class="il-wrap"><div class="logo-lobby il-logo" role="img" aria-label="Imperia"></div><div id="rmBody" class="rm-body"></div></div></div>
<div id="st" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:5;padding:16px;overflow:auto"><div class="card" id="stc" style="margin:auto"></div></div>
<div id="game" style="display:none"><div id="hd"></div><div id="main"><div id="wrap"><div id="pan"><canvas id="cv" title="Kółko myszy: zoom. Dwuklik na pole: szczegóły pola"></canvas></div></div><div id="side"></div></div></div>
<script src="imperia-lib1.js?v=12"></script><script src="imperia-skills.js?v=1"></script><script>
/* ===== ekran startowy (styl Monopoly) ===== */
(function(){
  var rb=document.getElementById('rmBg');
  ['👑','🏰','⚔️','🛡️','🗺️','🏹','💰','🐎'].forEach(function(e,i){if(!rb)return;var s=document.createElement('span');s.textContent=e;s.style.left=((i*12.5+4)%96)+'%';s.style.animationDuration=(15+(i*5)%11)+'s';s.style.animationDelay='-'+((i*3.3)%14)+'s';rb.appendChild(s)});
  var bg=document.getElementById('ilBg');if(!bg)return;
  ['👑','🏰','⚔️','🛡️','🗺️','🏹','💰','🐎','👑','⚔️','🏰','💰'].forEach(function(e,i){var s=document.createElement('span');s.textContent=e;s.style.left=((i*8.7+3)%96)+'%';s.style.animationDuration=(14+(i*5)%11)+'s';s.style.animationDelay='-'+((i*3.3)%14)+'s';bg.appendChild(s)});
  var rp=document.getElementById('ilRoomPane'),lp=document.getElementById('ilLocalPane'),go=document.getElementById('ilGo'),mode='';
  function show(el,on){el.style.display=on?'block':'none'}
  function setMode(m){
    var er=document.getElementById('er');if(er)er.textContent='';
    if(mode===m){mode='';show(rp,false);return}
    mode=m;show(lp,false);show(rp,true);
    document.getElementById('ilRoomTitle').textContent=m==='create'?'Utwórz pokój':'Dołącz do pokoju';
    document.getElementById('ilGoTxt').textContent=m==='create'?'Utwórz pokój':'Dołącz';
    var cd=document.getElementById('cd'),kg=document.getElementById('kingdom');
    if(cd)cd.style.display=m==='create'?'none':'';
    setTimeout(function(){var t=m==='create'?kg:cd;if(t)t.focus()},60);
  }
  document.getElementById('ilCreate').onclick=function(){setMode('create')};
  document.getElementById('ilJoin').onclick=function(){setMode('join')};
  go.onclick=function(){enter(mode==='create')};
  ['cd','kingdom'].forEach(function(id){var el=document.getElementById(id);if(el)el.addEventListener('keydown',function(e){if(e.key==='Enter')go.click()})});
  document.getElementById('ilLocal').onclick=function(){mode='';show(rp,false);show(lp,lp.style.display!=='block')};
})();
</script>
</body></html>
