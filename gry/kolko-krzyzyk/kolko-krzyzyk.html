<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kółko i krzyżyk – Neon</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kolko-krzyzyk.css">
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<canvas id="fx"></canvas>
<main>
<div class="logo"><svg class="lx" viewBox="0 0 100 100"><path pathLength="1" d="M24 24L76 76"/><path pathLength="1" d="M76 24L24 76"/></svg><svg class="lo" viewBox="0 0 100 100"><circle pathLength="1" cx="50" cy="50" r="30"/></svg></div>
<h1>Kółko i krzyżyk</h1>
<section id="menu" class="card">
  <p class="sub">Trzy w rzędzie. Mała lub ogromna plansza.</p>
  <div><label for="nm">Twój nick</label><input id="nm" maxlength="16" placeholder="np. Kuba" autocomplete="off" style="margin-top:6px"></div>
  <div><label>Plansza</label><div class="chips" id="sz" style="margin-top:6px"><button class="chip on" data-s="3">Normalna<small>3 × 3</small></button><button class="chip" data-s="8">Większa<small>8 × 8</small></button><button class="chip" data-s="12">Ogromna<small>12 × 12</small></button></div></div>
  <button class="btn" id="mk" disabled>Utwórz pokój online</button>
  <div class="or">albo dołącz do znajomego</div>
  <div class="r2"><input id="jc" maxlength="5" placeholder="KOD" style="text-transform:uppercase;letter-spacing:.2em;text-align:center"><button class="btn g" id="jn" disabled>Dołącz</button></div>
  <div class="r2"><button class="btn g" id="bot">🤖 Z komputerem</button><button class="btn g" id="loc">👥 Lokalnie</button></div>
  <p class="err" id="err"></p><p class="note" id="mpn">Łączę z trybem online…</p>
</section>
<section id="lobby" class="card hidden">
  <label style="text-align:center">Kod pokoju – podaj go znajomemu</label><div class="code" id="cb"></div><p class="note" id="cp">Kliknij kod, aby skopiować</p>
  <p class="status">Czekam na przeciwnika…</p><button class="btn g" id="lv">Anuluj</button>
</section>
<section id="game" class="hidden" style="flex-direction:column;gap:16px">
  <div class="top"><span class="tag" id="tag"></span><button class="btn g" id="gl" style="padding:8px 16px;font-size:14px">Wyjdź</button></div>
  <div class="bar"><div class="pl X" id="pX"><span class="g">✕</span><b id="nX"></b><em id="sX">0</em></div><div class="pl O" id="pO"><span class="g">○</span><b id="nO"></b><em id="sO">0</em></div></div>
  <div class="status" id="st"></div>
  <div class="stage" id="stage"><div class="board" id="bd"></div></div>
  <button class="btn hidden" id="again">Zagraj ponownie</button>
</section>
</main>
<script>
/* most do Firebase hosta (index.html): pokoje online dla kółka i krzyżyka */
(function(){
var P=window.parent,B=null;
try{B=P&&P.tttBridge&&P.tttBridge()}catch(e){B=null}
window.__tttNick=function(){try{return B&&B.nick()||''}catch(e){return''}};
window.__tttStats=function(code,S,ms){try{if(B)B.stats(code,S,ms)}catch(e){}};
if(!B||!B.net())return;
window.claude={use:async function(){
 if(!B.net())throw new Error('offline');
 return{join:async function(name){
  var uid=await B.auth();
  var path='tttRooms/'+String(name).toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,40);
  var ref=B.db.ref(path),pr=ref.child('peers'),ms=ref.child('msgs');
  var peers={},h={},pc=[],gone=false,offs=[];
  var snap=await pr.once('value'),cur=snap.val()||{};
  Object.keys(cur).forEach(function(k){peers[k]=1});
  peers[uid]=1;
  var startKey=ms.push().key;
  await pr.child(uid).set({t:B.ts});
  try{pr.child(uid).onDisconnect().remove()}catch(e){}
  function fire(c){pc.forEach(function(f){try{f(c)}catch(e){console.error(e)}})}
  var onAdd=pr.on('child_added',function(s){var k=s.key;if(peers[k]&&k!==uid)return;if(k===uid)return;peers[k]=1;fire({joined:[{peer:k,isMe:false}],left:[]})});
  var onRem=pr.on('child_removed',function(s){var k=s.key;if(k===uid||!peers[k])return;delete peers[k];fire({joined:[],left:[{peer:k,isMe:false}]})});
  var q=ms.orderByKey().startAt(startKey);
  var onMsg=q.on('child_added',function(s){var v=s.val();if(!v||!v.t)return;var fs=h[v.t];if(!fs)return;var m={peer:v.peer,isMe:v.peer===uid,data:v.data===undefined?null:v.data};fs.slice().forEach(function(f){try{f(m)}catch(e){console.error(e)}})});
  return{
   peers:function(){return Object.keys(peers).map(function(k){return{peer:k,isMe:k===uid,sameTab:k===uid}})},
   on:function(t,f){(h[t]=h[t]||[]).push(f);return function(){h[t]=(h[t]||[]).filter(function(x){return x!==f})}},
   onPeers:function(f){pc.push(f);return function(){pc=pc.filter(function(x){return x!==f})}},
   emit:function(t,d){if(gone)return Promise.resolve();var r=ms.push();var p=r.set({t:t,peer:uid,data:d===undefined?null:d,ts:B.ts});setTimeout(function(){r.remove().catch(function(){})},20000);return p},
   leave:function(){if(gone)return;gone=true;try{pr.off('child_added',onAdd);pr.off('child_removed',onRem);q.off('child_added',onMsg)}catch(e){}
    try{pr.child(uid).onDisconnect().cancel()}catch(e){}
    pr.child(uid).remove().then(function(){return pr.once('value')}).then(function(s){if(!s.val())return ref.remove()}).catch(function(){})}
  }}}}};
})();
</script>
<script>
(function(){
const $=s=>document.querySelector(s);
let R=null,room=null,S=null,isHost=false,mode='',size=3,code='',name='',gone=false,unsubs=[],timer=null,winKey='',lastSt='';
/* ---------- logika ---------- */
function newState(n,st){return{size:n,b:'.'.repeat(n*n),turn:st||'X',win:null,line:[],X:null,O:null,nX:'',nO:'',sc:{X:0,O:0},starter:st||'X',rd:0}}
function check(b,n,i){const c=b[i],r=Math.floor(i/n),k=i%n;for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){const L=[i];for(const s of[1,-1]){let y=r+dr*s,x=k+dc*s;while(y>=0&&y<n&&x>=0&&x<n&&b[y*n+x]===c){L.push(y*n+x);y+=dr*s;x+=dc*s}}if(L.length>=3)return L}return null}
function applyMove(st,i,sym){if(st.win||st.turn!==sym||i<0||i>=st.b.length||st.b[i]!=='.')return false;st.b=st.b.slice(0,i)+sym+st.b.slice(i+1);const L=check(st.b,st.size,i);if(L){st.win=sym;st.line=L;st.sc[sym]++}else if(!st.b.includes('.'))st.win='D';else st.turn=sym==='X'?'O':'X';return true}
function reset(st){st.rd=(st.rd||0)+1;st.starter=st.starter==='X'?'O':'X';st.b='.'.repeat(st.size*st.size);st.turn=st.starter;st.win=null;st.line=[]}
function wins(b,n,i,c){return!!check(b.slice(0,i)+c+b.slice(i+1),n,i)}
function botMove(){if(!S||S.win||S.turn!=='O'||mode!=='bot')return;const n=S.size,b=S.b;let best=-1,bs=-1e9;
 for(let i=0;i<b.length;i++){if(b[i]!=='.')continue;let s=Math.random();
  if(wins(b,n,i,'O'))s+=1000;else if(wins(b,n,i,'X'))s+=500;else{const r=(i/n)|0,c=i%n;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const y=r+dr,x=c+dc;if((dr||dc)&&y>=0&&y<n&&x>=0&&x<n&&b[y*n+x]!=='.')s+=3}s-=(Math.abs(r-(n-1)/2)+Math.abs(c-(n-1)/2))*.3}
  if(s>bs){bs=s;best=i}}
 if(best>=0&&applyMove(S,best,'O'))render()}
/* ---------- pomocnicze ---------- */
const clean=s=>String(s||'').replace(/[\u0000-\u001f\u200b-\u200f\u2028-\u202f]/g,'').trim().slice(0,16);
function me(){try{const p=room.peers().find(p=>p.sameTab);return p&&p.peer}catch(e){return null}}
function mySym(){if(mode==='bot')return'X';if(mode==='local')return S.turn;const m=me();return S&&m?(S.X===m?'X':S.O===m?'O':null):null}
function show(id){['menu','lobby','game'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id));$('#game').style.display=id==='game'?'flex':''}
function err(t){$('#err').textContent=t||''}
function cleanup(){unsubs.forEach(f=>{try{f()}catch(e){}});unsubs=[];clearInterval(timer);if(room){try{room.leave()}catch(e){}}room=null;S=null;isHost=false;mode='';gone=false;winKey='';$('#bd').innerHTML=''}
function genCode(){const a='abcdefghjkmnpqrstuvwxyz23456789';let s='';for(let i=0;i<5;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
function getName(){name=clean($('#nm').value)||'Gracz'+Math.floor(Math.random()*90+10);return name}
function emitState(){if(room&&isHost){if(!S.X)S.X=me();room.emit('state',S).catch(()=>{})}render()}
/* ---------- widok ---------- */
const MX='<svg class="m X" viewBox="0 0 100 100"><path pathLength="1" d="M24 24L76 76"/><path pathLength="1" d="M76 24L24 76"/></svg>',MO='<svg class="m O" viewBox="0 0 100 100"><circle pathLength="1" cx="50" cy="50" r="30"/></svg>';
function render(){
 if(!S)return;const n=S.size,bd=$('#bd');
 if(bd.children.length!==n*n){bd.innerHTML='';for(let i=0;i<n*n;i++){const b=document.createElement('button');b.className='c';b.dataset.i=i;b.dataset.v='.';b.style.setProperty('--i',i);b.setAttribute('aria-label','Pole '+(i+1));bd.appendChild(b)}}
 bd.style.setProperty('--n',n);bd.style.setProperty('--sw',n<=3?12:14);
 const ms=mySym(),waiting=mode==='online'&&!S.O,myTurn=mode==='local'||ms===S.turn;
 [...bd.children].forEach((el,i)=>{const v=S.b[i];if(el.dataset.v!==v){el.dataset.v=v;el.innerHTML=v==='X'?MX:v==='O'?MO:'';el.classList.toggle('f',v!=='.')}
  const w=S.line.includes(i);el.classList.toggle('w',w);el.classList.toggle('wX',w&&S.win==='X');el.classList.toggle('wO',w&&S.win==='O')});
 bd.classList.toggle('tO',S.turn==='O');bd.classList.toggle('off',!!S.win||waiting||!myTurn||gone);
 $('#nX').textContent=S.nX||'—';$('#nO').textContent=S.nO||'czeka…';$('#sX').textContent=S.sc.X;$('#sO').textContent=S.sc.O;
 $('#pX').classList.toggle('act',!S.win&&S.turn==='X'&&!waiting);$('#pO').classList.toggle('act',!S.win&&S.turn==='O'&&!waiting);
 const nm=s=>s==='X'?S.nX:S.nO;let t;
 if(gone)t='Gospodarz opuścił pokój';else if(waiting)t='Czekam na przeciwnika…';else if(S.win==='D')t='Remis! 🤝';
 else if(S.win)t=mode==='online'?(S.win===ms?'Wygrałeś! 🎉':ms?'Przegrałeś…':'Wygrywa '+nm(S.win)):'Wygrywa '+nm(S.win)+'! 🎉';
 else t=mode==='local'?'Ruch: '+nm(S.turn):mode==='bot'?(S.turn==='X'?'Twój ruch':'Komputer myśli…'):(ms?(myTurn?'Twój ruch':'Ruch: '+nm(S.turn)):'Oglądasz · ruch: '+nm(S.turn));
 if(t!==lastSt){const e=$('#st');e.textContent=t;e.style.animation='none';void e.offsetWidth;e.style.animation='';lastSt=t}
 $('#again').classList.toggle('hidden',!S.win||gone||(mode==='online'&&!ms));
 if(mode==='online'&&S.win&&ms&&S.X&&S.O){try{window.__tttStats(code,S,ms)}catch(e){}}
 $('#tag').innerHTML=(mode==='online'?'Pokój <b></b> · ':'')+n+'×'+n;if(mode==='online')$('#tag b').textContent=code.toUpperCase();
 const k=S.win&&S.win!=='D'?S.line.join():'';
 if(k!==winKey){winKey=k;if(k){drawLine();burst(S.win)}else{const w=$('#wl');if(w)w.remove()}}
}
function drawLine(){const bd=$('#bd');let w=$('#wl');if(w)w.remove();const L=S.line,a=bd.children[Math.min(...L)],z=bd.children[Math.max(...L)];if(!a||!z)return;
 const c=e=>[e.offsetLeft+e.offsetWidth/2,e.offsetTop+e.offsetHeight/2],[x1,y1]=c(a),[x2,y2]=c(z);
 const d=Math.hypot(x2-x1,y2-y1)||1,e=a.offsetWidth*.3,ux=(x2-x1)/d,uy=(y2-y1)/d;
 const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.id='wl';s.setAttribute('viewBox','0 0 '+bd.clientWidth+' '+bd.clientHeight);
 s.innerHTML='<line class="wline '+S.win+'" pathLength="1" x1="'+(x1-ux*e)+'" y1="'+(y1-uy*e)+'" x2="'+(x2+ux*e)+'" y2="'+(y2+uy*e)+'"/>';bd.appendChild(s)}
addEventListener('resize',()=>{if(S&&winKey)drawLine()});
/* tilt 3D + spotlight */
const stage=$('#stage');
stage.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const r=stage.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;$('#bd').style.transform='rotateY('+x*9+'deg) rotateX('+-y*9+'deg)';
 const c=e.target.closest('.c');if(c){const cr=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-cr.left)+'px');c.style.setProperty('--my',(e.clientY-cr.top)+'px')}});
stage.addEventListener('pointerleave',()=>{$('#bd').style.transform=''});
/* ---------- efekty: pierścienie i konfetti ---------- */
const cv=$('#fx'),cx=cv.getContext('2d');let W=0,H=0,col={x:'#22d3ee',o:'#ff4d9d',g:'#ffd24a'},fr=0,P=[],Rg=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
for(let i=0;i<26;i++)Rg.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:10+Math.random()*34,vx:(Math.random()-.5)*.3,vy:-.15-Math.random()*.3,k:Math.random()<.6?'o':'x',ph:Math.random()*6});
function cols(){const s=getComputedStyle(document.documentElement);col={x:s.getPropertyValue('--x').trim(),o:s.getPropertyValue('--o').trim(),g:s.getPropertyValue('--gold').trim()}}
function burst(w){cols();const r=$('#bd').getBoundingClientRect(),cx0=r.left+r.width/2,cy0=r.top+r.height/2,m=w==='X'?col.x:col.o,cc=[m,m,col.g,'#fff'];
 for(let i=0;i<150;i++){const a=Math.random()*6.28,v=4+Math.random()*10;P.push({x:cx0,y:cy0,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,s:4+Math.random()*7,rot:Math.random()*6,vr:(Math.random()-.5)*.4,c:cc[i%4],l:1,rd:Math.random()<.35})}}
function loop(){fr++;if(fr%90===1)cols();cx.clearRect(0,0,W,H);
 for(const g of Rg){g.x+=g.vx;g.y+=g.vy;g.ph+=.01;if(g.y<-60){g.y=H+60;g.x=Math.random()*W}cx.globalAlpha=.16+.08*Math.sin(g.ph);cx.strokeStyle=col[g.k];cx.lineWidth=2.5;cx.beginPath();
  if(g.k==='o')cx.arc(g.x,g.y,g.r,0,6.28);else{const q=g.r*.7;cx.moveTo(g.x-q,g.y-q);cx.lineTo(g.x+q,g.y+q);cx.moveTo(g.x+q,g.y-q);cx.lineTo(g.x-q,g.y+q)}cx.stroke()}
 for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.vx*=.99;p.rot+=p.vr;p.l-=.011;if(p.l<=0){P.splice(i,1);continue}
  cx.globalAlpha=Math.min(1,p.l*1.5);cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);if(p.rd){cx.beginPath();cx.arc(0,0,p.s/2,0,6.28);cx.fill()}else cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()}
 cx.globalAlpha=1;requestAnimationFrame(loop)}
if(!matchMedia('(prefers-reduced-motion:reduce)').matches){cols();loop()}
/* ---------- tryby ---------- */
function startLocal(m){cleanup();getName();mode=m;S=newState(size);S.nX=name;S.nO=m==='bot'?'Komputer 🤖':'Gracz 2';lastSt='';show('game');render()}
async function create(){if(!R)return;err('');cleanup();getName();code=genCode();
 try{room=await R.join('kk-'+code)}catch(e){err('Nie udało się utworzyć pokoju.');return}
 mode='online';isHost=true;S=newState(size);S.X=me();S.nX=name;
 unsubs.push(room.on('hello',m=>{if(m.isMe)return;const nm=clean(m.data&&m.data.name)||'Gracz';if(!S.O&&m.peer!==S.X){S.O=m.peer;S.nO=nm;S.sc={X:0,O:0};if(!$('#lobby').classList.contains('hidden'))show('game')}emitState()}));
 unsubs.push(room.on('move',m=>{if(m.isMe||!S.O)return;const i=m.data&&m.data.i;if(Number.isInteger(i)&&m.peer===S[S.turn]&&applyMove(S,i,S.turn))emitState()}));
 unsubs.push(room.on('rematch',m=>{if(m.isMe||!S.win)return;if(m.peer===S.X||m.peer===S.O){reset(S);emitState()}}));
 unsubs.push(room.onPeers(c=>{if(S.O&&c.left.some(p=>p.peer===S.O)){S.O=null;S.nO='';reset(S);S.sc={X:0,O:0};emitState()}else if(S.O&&c.joined.some(p=>!p.isMe))emitState()}));
 $('#cb').textContent=code.toUpperCase();$('#cp').textContent='Kliknij kod, aby skopiować';show('lobby')}
async function join(){if(!R)return;err('');const c=($('#jc').value||'').trim().toLowerCase();if(!/^[a-z0-9]{5}$/.test(c)){err('Kod ma 5 znaków.');return}
 cleanup();getName();code=c;$('#jn').disabled=true;
 try{room=await R.join('kk-'+c)}catch(e){err('Nie udało się dołączyć.');$('#jn').disabled=false;return}
 mode='online';let got=0,tries=0;
 unsubs.push(room.on('state',m=>{if(m.isMe)return;const d=m.data;if(!d||typeof d.b!=='string'||!d.size||d.b.length!==d.size*d.size||d.X!==m.peer)return;if(S&&S.X!==m.peer)return;if(!got){got=1;clearInterval(timer);show('game')}S=d;S.line=Array.isArray(d.line)?d.line:[];render()}));
 unsubs.push(room.onPeers(c=>{if(got&&S&&c.left.some(p=>p.peer===S.X)){gone=true;render()}}));
 const hi=()=>room&&room.emit('hello',{name}).catch(()=>{});hi();
 timer=setInterval(()=>{if(got)return;if(++tries>=5){clearInterval(timer);cleanup();err('Nie znaleziono pokoju o tym kodzie.');$('#jn').disabled=false;return}hi()},1800)}
function leave(){cleanup();show('menu');$('#jn').disabled=!R;err('')}
$('#sz').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;size=+b.dataset.s;[...$('#sz').children].forEach(x=>x.classList.toggle('on',x===b))};
$('#mk').onclick=create;$('#jn').onclick=join;$('#bot').onclick=()=>startLocal('bot');$('#loc').onclick=()=>startLocal('local');$('#lv').onclick=leave;$('#gl').onclick=leave;
$('#jc').addEventListener('keydown',e=>{if(e.key==='Enter')join()});
$('#cb').onclick=()=>{try{navigator.clipboard.writeText(code.toUpperCase()).then(()=>{$('#cp').textContent='Skopiowano! ✓'},()=>{})}catch(e){}};
$('#again').onclick=()=>{if(mode!=='online'||isHost){reset(S);if(mode==='online')emitState();else{render();if(mode==='bot'&&S.turn==='O')setTimeout(botMove,600)}}else room.emit('rematch',{}).catch(()=>{})};
$('#bd').addEventListener('click',e=>{const el=e.target.closest('.c');if(!el||!S||S.win||gone)return;const i=+el.dataset.i;if(S.b[i]!=='.')return;
 if(mode==='local'){if(applyMove(S,i,S.turn))render();return}
 if(mode==='bot'){if(S.turn==='X'&&applyMove(S,i,'X')){render();if(!S.win)setTimeout(botMove,650)}return}
 if(!S.O)return;const ms=mySym();if(!ms||ms!==S.turn)return;
 if(isHost){if(applyMove(S,i,ms))emitState()}else room.emit('move',{i}).catch(()=>{})});
(async()=>{try{R=window.claude&&claude.use?await claude.use('room'):null}catch(e){R=null}
 if(R){$('#mk').disabled=false;$('#jn').disabled=false;$('#mpn').textContent='Gra online: utwórz pokój i podaj kod znajomemu. Wyniki zapisują się w statystykach zalogowanego konta.'}else $('#mpn').textContent='Tryb online niedostępny (brak połączenia z Firebase). Tryby z komputerem i lokalny działają.';
 try{const n=window.__tttNick&&window.__tttNick();if(n&&!$('#nm').value){$('#nm').value=n.slice(0,16);$('#nm').dispatchEvent(new Event('input'))}}catch(e){}})();
window.__tttLeave=leave;
})();
</script>
</body>
</html>
