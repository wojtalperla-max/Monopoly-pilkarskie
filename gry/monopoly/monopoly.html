<script>/* lobby → strona główna (chowanie przycisku „Menu główne” poza lobby) */
(function(){
  var sel='#onlineGate';
  if(window.parent===window)return;
  function shown(e){
    if(!e)return false;
    var r=e.getBoundingClientRect(),cs=getComputedStyle(e);
    return r.width>40&&r.height>40&&cs.display!=='none'&&cs.visibility!=='hidden';
  }
  function send(){
    var l=false;try{l=shown(document.querySelector(sel))}catch(x){}
    try{window.parent.postMessage({type:'gmenu-lobby',lobby:l},'*')}catch(x){}
  }
  setInterval(send,250);send();
})();
</script>

  gate.querySelector('#onlineLobby').style.display='block';gate.querySelector('#roomCodeLabel').textContent=onlineRoomCode;
  gate.classList.add('inlobby');gate.querySelector('#ogBadge').textContent=onlineMode==='classic'?'🎩 Zwykłe Monopoly':'⚽ Monopoly piłkarskie';
  if(onlineRoomListener&&onlineRoom)onlineRoom.off('value',onlineRoomListener);
  onlineRoomListener=onlineRoom.on('value',snap=>{
    const room=snap.val(); if(!room){onlineShowError('Pokój został usunięty.');return;}
    onlineHostId=room.host;window.onlineTest=!!room.test;onlineMode=room.mode==='classic'?'classic':'football';
    onlineLobbyPlayers=Object.values(room.players||{}).sort((a,b)=>(a.order||0)-(b.order||0));
    const list=gate.querySelector('#onlinePlayers');
    if(list)list.innerHTML=onlineLobbyPlayers.map((p,i)=>`<div style="padding:6px 0;border-bottom:1px solid #254433"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${/^#[0-9a-f]{6}$/i.test(p.color)?p.color:'#888'};margin-right:8px"></span>${i+1}. ${String(p.name||'Gracz').replace(/[<>&]/g,'')}${p.id===room.host?' <b style="color:#f2c230">(host)</b>':''}${p.id===onlinePlayerId?' <b>(Ty)</b>':''}</div>`).join('');
    const mb=gate.querySelector('#onlineMoney');
    if(mb){const sm=Number(room.startMoney)||1500;
      if(room.host===onlinePlayerId&&room.status==='waiting'){if(!mb.querySelector('input')){mb.innerHTML='Pieniądze na start (€): <input id="startMoneyIn" type="number" min="100" max="100000" step="100" value="'+sm+'" class="og-money">';mb.querySelector('input').onchange=e=>{const v=Math.max(100,Math.min(100000,Math.round(+e.target.value)||1500));e.target.value=v;onlineRoom.child('startMoney').set(v)}}}
      else mb.textContent='Pieniądze na start: '+sm+' €'}
    if(room.status==='waiting'&&onlineMode!=='classic'){
      let tb=gate.querySelector('#onlineTest');
      if(!tb){const anchor=gate.querySelector('#onlineMoney');if(anchor&&anchor.parentNode){tb=document.createElement('div');tb.id='onlineTest';anchor.parentNode.insertBefore(tb,anchor.nextSibling)}}
      if(tb){const h=tgBox('onlineRoom',!!room.test);if(tb.dataset.h!==h){tb.dataset.h=h;tb.innerHTML=h}}
    }
    const start=gate.querySelector('#startOnline');
    if(start)start.style.display=room.host===onlinePlayerId&&room.status==='waiting'?'block':'none';
    const status=gate.querySelector('#onlineStatus');
    if(status)status.textContent=room.status==='started'?'Gra już trwa. Łączenie z rozgrywką…':`Gracze: ${onlineLobbyPlayers.length}/4. ${room.host===onlinePlayerId?'Możesz rozpocząć grę, gdy dołączy co najmniej 2 osoby.':'Czekaj, aż host rozpocznie grę.'}`;
    if(room.status==='started'&&room.mode==='classic'&&room.cm){const g2=document.getElementById('onlineGate');if(g2)g2.remove();CM.remote(room.cm)}
    else if(room.status==='started'&&room.state){
      const gateNow=document.getElementById('onlineGate');if(gateNow)gateNow.remove();
      const st=room.state,rv=Number(st.rev)||0;
      if(!onlineGameStarted||(st.by!==onlinePlayerId&&rv>onlineRev)){onlineRev=Math.max(onlineRev,rv);onlineApplyState(st)}
      else if(st.by===onlinePlayerId)onlineRev=Math.max(onlineRev,rv);
    }
  },err=>onlineShowError('Błąd połączenia z pokojem: '+err.message));
}
async function onlineStartGame(){
  try{
    if(!onlineRoom||onlinePlayerId!==onlineHostId)throw new Error('Tylko host może rozpocząć grę.');
    const snap=await onlineRoom.once('value'),room=snap.val();
    const players=Object.values(room?.players||{}).sort((a,b)=>(a.order||0)-(b.order||0));
    if(players.length<2)throw new Error('Do gry potrzebne są co najmniej 2 osoby.');
    if(players.length>4)throw new Error('Może grać maksymalnie 4 osoby.');
    if(onlineMode==='classic'){const mo=Math.max(100,Math.min(100000,Math.round(Number(document.getElementById('startMoneyIn')?.value||room?.startMoney))||1500));await CM.hostStart(players,mo,onlineRoom);return}
    P=players.map(p=>({uid:p.id,n:String(p.name||'Gracz').replace(/[<>&]/g,'').slice(0,14),c:/^#[0-9a-f]{6}$/i.test(p.color)?p.color:'#e63946',m:Math.max(100,Math.min(100000,Math.round(Number(document.getElementById('startMoneyIn')?.value||room?.startMoney))||1500)),pos:0,jail:0,out:false}));
    cur=0;rolled=false;dbl=0;last=0;pot=0;moving=false;pulled=null;
    B.forEach(s=>{s.o=null;s.sq=[null,null,null,null,null];s.fm='1-1-1-2'});
    PL.forEach(x=>{x.o=null;x.at=null;x.paid=false;x.sl=null});
    onlineGameStarted=true;
    const setup=document.getElementById('setup');if(setup)setup.remove();const gate=document.getElementById('onlineGate');if(gate)gate.remove();
    ui();
    const state=onlineState();onlineLastJson=JSON.stringify(state);state.rev=++onlineRev;state.by=onlinePlayerId;
    await onlineRoom.child('state').set(state);
    await onlineRoom.child('status').set('started');
  }catch(e){onlineShowError('Nie udało się rozpocząć gry: '+e.message);}
}
window.addEventListener('load',()=>{onlinePanel()});

function statsMono(){
  if(typeof onlineRoom==='undefined'||!onlineRoom||!onlineGameStarted||P.length<2||typeof ACC==='undefined'||!ACC.user)return;
  if(P.filter(p=>!p.out).length!==1)return;
  const me=P.find(p=>p.uid===ACC.user.uid);if(!me)return;
  statsRecord('monopoly_'+onlineRoomCode,'monopoly',me.out?'l':'w',P.map(p=>({uid:p.uid,name:p.n})),window.onlineTest);
}

function askHub(){document.querySelector('#menu .box').innerHTML='<h2>Wyjść do menu głównego?</h2><div class=row>Obecna gra zostanie przerwana.</div><button onclick="monoLeaveToHub()">Tak, wyjdź</button><button class=skip onclick="closeMenu()">Anuluj</button>'}
/* wyjście do menu głównego platformy: klik w pasek „← Menu główne” rodzica (zatrzymuje też licznik czasu gry) */
function monoLeaveToHub(){try{window.parent.document.querySelector('#mono .gmenu').click()}catch(e){location.reload()}}

window.__leave=function(){};

window.__setCol=function(c){var e=document.getElementById('onlineColor');if(e)e.value=c};
window.__inRoom=function(){return !!onlineRoom};
window.__joinFromHub=function(c){return new Promise(function(r){setTimeout(function(){var i=document.getElementById('roomCode');if(i){i.value=c;onlineJoinRoom()}r()},250)})};
