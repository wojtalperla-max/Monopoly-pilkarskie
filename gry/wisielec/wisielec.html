<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wisielec Online</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0a0e22;--bg2:#1a1140;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--tx:#f2f4ff;--mut:#a3a9d0;--a:#8b5cf6;--b:#22d3ee;--ok:#34d399;--bad:#fb7185;--key:rgba(255,255,255,.1);--glow:rgba(139,92,246,.45);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg1:#eef2ff;--bg2:#e0e7ff;--card:rgba(255,255,255,.75);--line:rgba(60,50,140,.18);--tx:#1b1740;--mut:#5b5f8f;--key:rgba(255,255,255,.9);--glow:rgba(139,92,246,.3)}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--tx);background:radial-gradient(900px 500px at 15% -10%,var(--glow),transparent 60%),radial-gradient(800px 500px at 100% 100%,rgba(34,211,238,.18),transparent 60%),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;min-height:100vh}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 40px}
h1{margin:0;font-size:clamp(34px,7vw,56px);font-weight:700;letter-spacing:1px;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 50px -20px rgba(0,0,0,.5)}
.hidden{display:none!important}
button,input{font:inherit;color:inherit}
.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:600;font-size:17px;cursor:pointer;background:linear-gradient(90deg,var(--a),#6366f1);color:#fff;box-shadow:0 8px 24px -8px var(--a);transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
.btn.alt{background:linear-gradient(90deg,#0ea5e9,var(--b));box-shadow:0 8px 24px -8px var(--b);color:#04202b}
.btn.ghost{background:var(--key);box-shadow:none;color:var(--tx);border:1px solid var(--line)}
input{width:100%;background:var(--key);border:1px solid var(--line);border-radius:14px;padding:13px 16px;font-size:18px;outline:none}
input:focus{border-color:var(--a);box-shadow:0 0 0 3px var(--glow)}
label{display:block;color:var(--mut);font-size:14px;margin:0 0 6px 4px}
/* home */
#home{max-width:520px;margin:6vh auto 0;text-align:center}
#home .sub{color:var(--mut);margin:6px 0 22px}
.stack{display:grid;gap:14px;text-align:left}
.row{display:flex;gap:10px}
.row>*{flex:1}
.or{color:var(--mut);text-align:center;font-size:14px}
#code{text-transform:uppercase;letter-spacing:6px;text-align:center;font-weight:600}
.mini{width:150px;height:170px;margin:0 auto 6px;display:block}
/* game */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.chip{display:inline-flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 8px 8px 18px}
.chip b{font-size:24px;letter-spacing:5px;color:var(--b)}
.chip button{border:0;border-radius:999px;padding:7px 14px;cursor:pointer;background:var(--key);font-size:14px}
.grid{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:18px}
@media (max-width:780px){.grid{grid-template-columns:1fr}}
.scene{display:flex;flex-direction:column;align-items:center;gap:10px}
svg.gal{width:100%;max-width:340px;height:auto;overflow:visible}
.gal path,.gal circle{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:9}
.gal .st{stroke:#9aa3d6}
.gal .p{stroke:#f8fafc;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .6s ease;filter:drop-shadow(0 0 6px var(--glow))}
.gal .p.on{stroke-dashoffset:0}
.gal.lost .p{stroke:var(--bad);filter:drop-shadow(0 0 8px var(--bad))}
.gal.won .p{stroke:var(--ok);filter:drop-shadow(0 0 8px var(--ok))}
.gal.lost #fig{animation:sway 2s ease-in-out infinite;transform-origin:200px 80px}
@keyframes sway{50%{transform:rotate(4deg)}}
.bar{width:100%;max-width:340px;height:10px;border-radius:9px;background:var(--key);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),#fbbf24,var(--bad));background-size:340px 100%;transition:width .5s}
.small{color:var(--mut);font-size:14px}
.cat{display:inline-block;background:var(--key);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:14px;color:var(--mut)}
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 22px;min-height:64px}
.slot{width:clamp(30px,8vw,48px);height:clamp(42px,10vw,60px);border-radius:12px;background:var(--key);border:1px solid var(--line);display:grid;place-items:center;font-size:clamp(22px,6vw,34px);font-weight:700;position:relative}
.slot::after{content:'';position:absolute;left:20%;right:20%;bottom:7px;height:3px;border-radius:3px;background:var(--mut);opacity:.5}
.slot.f{background:linear-gradient(160deg,var(--a),#6366f1);color:#fff;border-color:transparent;animation:pop .4s}
.slot.f::after{display:none}
.slot.gap{background:none;border:0;width:16px}.slot.gap::after{display:none}
.slot.miss{background:rgba(251,113,133,.2);border-color:var(--bad);color:var(--bad)}
@keyframes pop{0%{transform:scale(.4) rotate(-10deg)}70%{transform:scale(1.15)}100%{transform:none}}
.kb{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.k{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--key);font-weight:600;font-size:20px;cursor:pointer;transition:transform .1s,background .2s}
.k:hover:not(:disabled){transform:translateY(-2px);background:var(--glow)}
.k:disabled{cursor:default}
.k.ok{background:var(--ok);color:#052e1d;border-color:transparent}
.k.no{background:var(--bad);color:#3b0613;border-color:transparent;opacity:.55}
.players{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;align-items:center}
.pl{display:flex;align-items:center;gap:7px;background:var(--key);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 8px;font-size:14px}
.pl i{width:12px;height:12px;border-radius:50%}
.msg{text-align:center;font-size:20px;font-weight:600;margin:0 0 4px;min-height:30px}
.msg.w{color:var(--ok)}.msg.l{color:var(--bad)}
.hostp{margin-top:18px;padding-top:18px;border-top:1px solid var(--line);display:grid;gap:12px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--card);border:1px solid var(--line);backdrop-filter:blur(14px);padding:12px 20px;border-radius:14px;opacity:0;pointer-events:none;transition:.3s;z-index:9;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">

<section id="home" class="card">
  <svg class="mini" viewBox="0 0 300 340"><g class="gal"><path class="st" d="M30 310H190M70 310V40H200M70 90L120 40M200 40V80"/><g id="m"><circle cx="200" cy="105" r="25" stroke="#f8fafc" style="stroke-width:9"/><path d="M200 130V210M200 150L165 185M200 150L235 185M200 210L170 265M200 210L230 265" stroke="#f8fafc" style="stroke-width:9"/></g></g></svg>
  <h1>WISIELEC</h1>
  <p class="sub">Zgadujcie hasło razem, przez kod pokoju.</p>
  <p class="small" id="net" style="margin:-12px 0 18px"></p>
  <div class="stack">
    <div><label for="nick">Twój pseudonim</label><input id="nick" maxlength="14" placeholder="np. Kuba" autocomplete="off"></div>
    <button class="btn" id="bCreate">Utwórz pokój</button>
    <div class="or">albo dołącz do znajomych</div>
    <div class="row"><input id="code" maxlength="5" placeholder="KOD" autocomplete="off"><button class="btn alt" id="bJoin">Dołącz</button></div>
    <button class="btn ghost" id="bSolo">Zagraj solo</button>
  </div>
</section>

<section id="game" class="hidden">
  <div class="top">
    <div class="chip" id="chip"><span class="small">Kod pokoju</span><b id="rc">-----</b><button id="bCopy">Kopiuj</button></div>
    <button class="btn ghost" id="bLeave" style="padding:9px 18px;font-size:15px">Wyjdź</button>
  </div>
  <div class="grid">
    <div class="card scene">
      <svg class="gal" id="gal" viewBox="0 0 300 340">
        <g>
          <path class="p" data-s="0" pathLength="1" d="M30 310H190"/>
          <path class="p" data-s="1" pathLength="1" d="M70 310V40"/>
          <path class="p" data-s="2" pathLength="1" d="M70 40H200"/>
          <path class="p" data-s="2" pathLength="1" d="M70 90L120 40"/>
          <g id="fig">
            <path class="p" data-s="3" pathLength="1" d="M200 40V80"/>
            <circle class="p" data-s="4" pathLength="1" cx="200" cy="105" r="25"/>
            <path class="p" data-s="5" pathLength="1" d="M200 130V210"/>
            <path class="p" data-s="6" pathLength="1" d="M200 150L165 185"/>
            <path class="p" data-s="7" pathLength="1" d="M200 150L235 185"/>
            <path class="p" data-s="8" pathLength="1" d="M200 210L170 265"/>
            <path class="p" data-s="9" pathLength="1" d="M200 210L230 265"/>
          </g>
        </g>
      </svg>
      <div class="bar"><i id="bar"></i></div>
      <div class="small" id="lives">Błędy: 0 / 10</div>
    </div>
    <div class="card">
      <div style="text-align:center"><span class="cat" id="cat">Kategoria</span></div>
      <div class="slots" id="slots"></div>
      <p class="msg" id="msg"></p>
      <div class="kb" id="kb"></div>
      <div class="players" id="players"></div>
      <div class="hostp hidden" id="hostp">
        <button class="btn" id="bRand">Losuj hasło</button>
        <div class="or">albo wymyśl własne dla znajomych</div>
        <div class="row"><input id="own" maxlength="24" placeholder="Wpisz własne hasło" autocomplete="off"><button class="btn alt" id="bOwn" style="flex:0 0 auto">Start</button></div>
      </div>
    </div>
  </div>
</section>
</div>
<div id="toast"></div>

<script>
/* most do Firebase hosta (index.html): pokoje online + nick/kolor z konta + statystyki */
(function(){
var P=window.parent,B=null;
try{B=P&&P!==window&&P.wisBridge&&P.wisBridge()}catch(e){B=null}
window.__wisNick=function(){try{return B&&B.nick()||''}catch(e){return''}};
window.__wisCol=function(){try{return B&&B.col()||''}catch(e){return''}};
window.__wisStats=function(code,gid,players,r){try{if(B)B.stats(code,gid,players,r)}catch(e){}};
window.__wisNet=function(){try{return !!(B&&B.net())}catch(e){return false}};
window.__wisJoin=async function(name){
  if(!B||!B.net())throw new Error('Pokoje online są niedostępne (brak połączenia z Firebase).');
  var uid=await B.auth();
  var path='tttRooms/'+String(name).toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,40);
  var ref=B.db.ref(path),pr=ref.child('peers'),ms=ref.child('msgs');
  var cache={},pc=[],h={},gone=false,first=true;
  var startKey=ms.push().key;
  await pr.child(uid).set({t:B.ts});
  try{pr.child(uid).onDisconnect().remove()}catch(e){}
  function plist(){return Object.keys(cache).map(function(k){return{peer:k,isMe:k===uid,presence:cache[k]||{}}})}
  function fire(c){c.peers=plist();pc.forEach(function(f){try{f(c)}catch(e){console.error(e)}})}
  var onVal=pr.on('value',function(s){
    var v=s.val()||{},joined=[],left=[];
    Object.keys(v).forEach(function(k){if(!cache[k]&&!first&&k!==uid)joined.push({peer:k});cache[k]=v[k]&&v[k].p||{}});
    Object.keys(cache).forEach(function(k){if(!v[k]){delete cache[k];if(k!==uid)left.push({peer:k})}});
    first=false;fire({joined:joined,left:left});
  });
  await pr.once('value').then(function(s){var v=s.val()||{};Object.keys(v).forEach(function(k){cache[k]=v[k]&&v[k].p||{}})});
  var q=ms.orderByKey().startAt(startKey);
  var onMsg=q.on('child_added',function(s){var v=s.val();if(!v||!v.t)return;var fs=h[v.t];if(!fs)return;
    var m={peer:v.peer,isMe:v.peer===uid,ts:+v.ts||Date.now(),data:v.data===undefined?null:v.data};
    fs.slice().forEach(function(f){try{f(m)}catch(e){console.error(e)}})});
  return{
    uid:uid,
    peers:plist,
    presence:function(o){cache[uid]=o;return pr.child(uid).set({t:B.ts,p:o})},
    on:function(t,f){(h[t]=h[t]||[]).push(f);return function(){h[t]=(h[t]||[]).filter(function(x){return x!==f})}},
    onPeers:function(f){pc.push(f);return function(){pc=pc.filter(function(x){return x!==f})}},
    emit:function(t,d){if(gone)return Promise.resolve();var r=ms.push();var p=r.set({t:t,peer:uid,data:d===undefined?null:d,ts:B.ts});setTimeout(function(){r.remove().catch(function(){})},20000);return p},
    leave:function(){if(gone)return Promise.resolve();gone=true;try{pr.off('value',onVal);q.off('child_added',onMsg)}catch(e){}
      try{pr.child(uid).onDisconnect().cancel()}catch(e){}
      return pr.child(uid).remove().then(function(){return pr.once('value')}).then(function(s){if(!s.val())return ref.remove()}).catch(function(){})}
  };
};
})();
</script>
<script>
const ALPHA='AĄBCĆDEĘFGHIJKLŁMNŃOÓPQRSŚTUVWXYZŹŻ'.split('');
const MAX=10;
const WORDS=[['Zwierzęta','KROKODYL'],['Zwierzęta','WIEWIÓRKA'],['Zwierzęta','PINGWIN'],['Zwierzęta','NOSOROŻEC'],['Zwierzęta','ŻYRAFA'],['Zwierzęta','DELFIN'],['Zwierzęta','KANGUR'],['Zwierzęta','CHOMIK'],['Jedzenie','PIEROGI'],['Jedzenie','NALEŚNIKI'],['Jedzenie','CZEKOLADA'],['Jedzenie','BIGOS'],['Jedzenie','TRUSKAWKA'],['Jedzenie','ZAPIEKANKA'],['Miejsca','KARPACZ'],['Miejsca','ŚNIEŻKA'],['Miejsca','WARSZAWA'],['Miejsca','KRAKÓW'],['Miejsca','BAŁTYK'],['Miejsca','ZAKOPANE'],['Rzeczy','PARASOL'],['Rzeczy','KOMPUTER'],['Rzeczy','LATARKA'],['Rzeczy','ŁYŻWY'],['Rzeczy','ROWER'],['Rzeczy','SŁUCHAWKI'],['Sport','PIŁKA NOŻNA'],['Sport','SNOWBOARD'],['Sport','SZACHY'],['Sport','KOSZYKÓWKA'],['Zawody','STRAŻAK'],['Zawody','ASTRONAUTA'],['Zawody','PIEKARZ'],['Zawody','NAUCZYCIELKA']];
const $=s=>document.querySelector(s);
let R=null,role=null,secret='',S=null,code='',offs=[],sawHost=false,timer=null,doneRec='';
const HEX=/^#[0-9a-f]{6}$/i;
const rndCol='hsl('+Math.floor(Math.random()*360)+' 80% 62%)';
const me={name:'',color:rndCol};
const netOk=()=>!!(window.__wisNet&&window.__wisNet());
const cleanN=v=>String(v||'').replace(/[\u0000-\u001f\u200b-\u200f\u2028-\u202f<>&]/g,'').trim().slice(0,14);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2800)}
function nick(){
  const an=window.__wisNick&&window.__wisNick(),ac=window.__wisCol&&window.__wisCol();
  me.name=cleanN(an||$('#nick').value)||'Gracz'+Math.floor(Math.random()*90+10);
  me.color=HEX.test(ac||'')?ac.toLowerCase():rndCol;
  if(!an){try{localStorage.setItem('wis-nick',me.name)}catch(e){}}
}
function initPrefs(){
  const an=window.__wisNick&&window.__wisNick(),el=$('#nick');
  if(an){el.value=cleanN(an);el.readOnly=true;el.title='Nick z Twojego konta'}
  else{el.readOnly=false;el.title='';if(!el.value){try{const n=localStorage.getItem('wis-nick');if(n)el.value=cleanN(n)}catch(e){}}}
  $('#net').textContent=!netOk()?'Pokoje online są niedostępne (brak połączenia z Firebase). Możesz zagrać solo.':an?'Grasz jako '+cleanN(an)+' – wyniki trafią do Twoich statystyk.':'Zaloguj się na konto, aby nick i kolor pochodziły z konta, a wyniki liczyły się do statystyk.';
}
// klawiatura
const kb=$('#kb');ALPHA.forEach(l=>{const b=document.createElement('button');b.className='k';b.textContent=l;b.dataset.l=l;b.onclick=()=>guess(l);kb.appendChild(b)});
// stan
function mask(){return secret.split('').map(c=>c===' '?' ':(S.tried.some(t=>t.l===c)?c:null))}
function startRound(cat,w){secret=w;S={cat,tried:[],wrong:0,status:'playing',word:null,round:(S?S.round:0)+1,gid:Date.now().toString(36)+Math.random().toString(36).slice(2,7)};S.m=mask();publish()}
function randomRound(){const[c,w]=WORDS[Math.floor(Math.random()*WORDS.length)];startRound(c,w)}
function doGuess(l,n,c){
  if(!S||S.status!=='playing'||!ALPHA.includes(l)||S.tried.some(t=>t.l===l))return;
  const ok=secret.includes(l);S.tried.push({l,n,c,ok});if(!ok)S.wrong++;S.m=mask();
  if(!S.m.includes(null)){S.status='won';S.word=secret}else if(S.wrong>=MAX){S.status='lost';S.word=secret}
  publish();
}
function guess(l){
  if(role==='guest'){if(R)R.emit('guess',{l}).catch(()=>toast('Nie udało się wysłać litery'))}
  else doGuess(l,me.name,me.color);
}
function enc(s){return{cat:s.cat||'',wrong:s.wrong|0,status:s.status,word:s.word||'',round:s.round|0,gid:s.gid||'',m:(s.m||[]).map(c=>c===null?'_':c).join(''),t:JSON.stringify(s.tried||[])}}
function dec(e){
  if(!e||typeof e!=='object')return null;
  let t=[];try{t=JSON.parse(e.t||'[]');if(!Array.isArray(t))t=[]}catch(x){t=[]}
  return{cat:String(e.cat||''),wrong:+e.wrong||0,status:e.status||'setup',word:e.word?String(e.word):null,round:+e.round||0,gid:String(e.gid||''),m:String(e.m||'').split('').map(c=>c==='_'?null:c),tried:t.filter(x=>x&&x.l)}
}
function publish(){render();if(R&&role==='host')R.presence({role:'host',name:me.name,color:me.color,st:enc(S)}).catch(()=>{})}
// statystyki: gra kooperacyjna, wszyscy w pokoju wygrywają albo przegrywają razem
function recStats(){
  if(!R||role==='solo'||!S||!S.gid||doneRec===S.gid||(S.status!=='won'&&S.status!=='lost'))return;
  const pl=R.peers().filter(p=>p.presence&&p.presence.name);
  if(pl.length<2||!pl.some(p=>p.isMe))return;
  doneRec=S.gid;
  if(window.__wisStats)window.__wisStats(code,S.gid,pl.map(p=>({uid:p.peer,name:String(p.presence.name).slice(0,14)})),S.status==='won'?'w':'l');
}
// render
function render(){
  const peers=R?R.peers().filter(p=>p.presence&&p.presence.name):[];
  $('#chip').classList.toggle('hidden',role==='solo');
  $('#rc').textContent=code;
  const st=S&&S.status;
  $('#gal').className='gal '+(st==='won'?'won':st==='lost'?'lost':'');
  const w=S?S.wrong:0;
  document.querySelectorAll('#gal .p').forEach(p=>p.classList.toggle('on',w>+p.dataset.s));
  $('#bar').style.width=(w/MAX*100)+'%';
  $('#lives').textContent='Błędy: '+w+' / '+MAX;
  $('#cat').textContent=S?'Kategoria: '+S.cat:'Oczekiwanie…';
  const sl=$('#slots');sl.innerHTML='';
  if(S&&S.m){const full=S.word?S.word.split(''):null;S.m.forEach((c,i)=>{const d=document.createElement('div');d.className='slot';
    if(c===' ')d.classList.add('gap');else if(c){d.classList.add('f');d.textContent=c}else if(full){d.classList.add('miss');d.textContent=full[i]}
    sl.appendChild(d)})}
  const m=$('#msg');m.className='msg';
  m.textContent=!S?(role==='guest'?'Łączenie z pokojem…':''):st==='setup'?(role==='host'?'Wybierz hasło dla graczy':'Gospodarz wybiera hasło…'):st==='won'?'Brawo! Hasło odgadnięte 🎉':st==='lost'?'Przegrana! Hasło to: '+S.word:'';
  if(st==='won')m.classList.add('w');if(st==='lost')m.classList.add('l');
  kb.querySelectorAll('.k').forEach(b=>{const t=S&&S.tried.find(x=>x.l===b.dataset.l);b.className='k'+(t?(t.ok?' ok':' no'):'');b.disabled=!S||st!=='playing'||!!t});
  $('#hostp').classList.toggle('hidden',!(role==='host'&&st&&st!=='playing'));
  $('#bRand').textContent=st==='setup'?'Losuj hasło':'Nowa runda – losowe hasło';
  const pl=$('#players');pl.innerHTML='';
  peers.forEach(p=>{const d=document.createElement('div');d.className='pl';const i=document.createElement('i');i.style.background=String(p.presence.color||'#999').replace(/[^a-z0-9 %(),#.]/gi,'');
    const s=document.createElement('span');s.textContent=(p.presence.role==='host'?'👑 ':'')+String(p.presence.name).slice(0,14)+(p.isMe?' (Ty)':'');d.append(i,s);pl.appendChild(d)});
  recStats();
  if(S&&S.tried.length){const last=S.tried[S.tried.length-1];const d=document.createElement('div');d.className='small';d.style.marginLeft='auto';d.textContent='Ostatnio: '+last.l+' ('+last.n+')';pl.appendChild(d)}
}
function show(g){$('#home').classList.toggle('hidden',g);$('#game').classList.toggle('hidden',!g)}
function reset(){offs.forEach(f=>{try{f()}catch(e){}});offs=[];clearTimeout(timer);if(R){R.leave().catch(()=>{});R=null}role=null;S=null;secret='';sawHost=false;doneRec='';show(false)}
function newCode(){const a='ABCDEFGHJKLMNPRSTUWXYZ23456789';let c='';for(let i=0;i<5;i++)c+=a[Math.floor(Math.random()*a.length)];return c}
async function online(r,c){
  nick();
  if(!netOk()){toast('Pokoje online są niedostępne (brak połączenia z Firebase). Zagraj solo!');return false}
  try{
    let tries=0;
    for(;;){
      R=await window.__wisJoin('wis-'+c.toLowerCase());
      // nowy pokój nie może wejść w cudzy: jeśli kod zajęty, losujemy inny
      if(r==='host'&&R.peers().some(p=>!p.isMe&&p.presence&&p.presence.role==='host')&&tries++<8){await R.leave();R=null;c=newCode();continue}
      break;
    }
  }catch(e){R=null;toast(e&&e.message?e.message:'Nie udało się połączyć z pokojem');return false}
  role=r;code=c;doneRec='';show(true);
  const onP=ch=>{
    if(role==='guest'){const h=(ch.peers||R.peers()).find(p=>!p.isMe&&p.presence&&p.presence.role==='host');
      if(h){sawHost=true;S=dec(h.presence.st)}
      else if(sawHost){toast('Gospodarz opuścił pokój');reset();return}}
    render()};
  offs.push(R.onPeers(onP));
  if(r==='host'){offs.push(R.on('guess',m=>{const d=m.data||{};const p=R.peers().find(x=>x.peer===m.peer);
    doGuess(String(d.l||''),p&&p.presence&&p.presence.name?String(p.presence.name).slice(0,14):'Gracz',p&&p.presence&&p.presence.color||'#999')}))}
  R.presence({name:me.name,color:me.color,role:r}).catch(()=>{});
  if(r==='guest'){onP({peers:R.peers()});timer=setTimeout(()=>{if(!sawHost){toast('Nie znaleziono pokoju '+c);reset()}},4500)}
  return true;
}
$('#bCreate').onclick=async()=>{const c=newCode();if(await online('host',c)){S={cat:'',tried:[],wrong:0,status:'setup',word:null,round:0,m:[]};publish()}};
$('#bJoin').onclick=()=>{const c=$('#code').value.trim().toUpperCase();if(c.length<3){toast('Wpisz kod pokoju');return}online('guest',c)};
$('#bSolo').onclick=()=>{nick();role='solo';code='';show(true);randomRound()};
$('#bLeave').onclick=reset;
$('#bCopy').onclick=()=>{try{navigator.clipboard.writeText(code).then(()=>toast('Skopiowano kod '+code))}catch(e){toast('Kod: '+code)}};
$('#bRand').onclick=randomRound;
$('#bOwn').onclick=()=>{const w=$('#own').value.toUpperCase().replace(/\s+/g,' ').trim();
  if(w.length<3||[...w].some(c=>c!==' '&&!ALPHA.includes(c))){toast('Użyj samych liter (min. 3)');return}
  $('#own').value='';startRound('Hasło gospodarza',w)};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.ctrlKey||e.metaKey||e.altKey&&false)return;const l=e.key.toUpperCase();if(S&&!$('#game').classList.contains('hidden')&&ALPHA.includes(l)&&e.key.length===1)guess(l)});
$('#code').addEventListener('keydown',e=>{if(e.key==='Enter')$('#bJoin').click()});
window.__wisRefresh=()=>{if(!R&&role!=='solo')initPrefs()};
window.__wisLeave=()=>{try{reset()}catch(e){}};
initPrefs();
</script>
</body>
</html>
