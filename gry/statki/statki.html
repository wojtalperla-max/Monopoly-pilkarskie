<head>
<meta charset="utf-8">

<script>
/* Wspólne klocki ekranów lobby (patrz lobby.css). */
(function(){
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let last='';
  const FL={stk:['⚓','🚢','💥','🌊','🐟','🧭','🏝️','⛵','🐙','🛟']};
  window.obEsc=esc;
  /* tło (pływające emotki) żyje w kontenerze gry i nie jest odtwarzane przy każdym odświeżeniu */
  function ensureBg(host,floats){
    setTimeout(()=>{
      const h=document.querySelector(host)||document.body;
      let bg=document.getElementById('obBg');
      if(!bg||bg.parentElement!==h){
        if(bg)bg.remove();
        bg=document.createElement('div');bg.id='obBg';bg.setAttribute('aria-hidden','true');h.insertBefore(bg,h.firstChild);
      }
      const key=(floats||[]).join('');
      if(bg.dataset.k!==key){
        bg.dataset.k=key;bg.innerHTML='';
        (floats||[]).forEach((e,i)=>{const s=document.createElement('span');s.textContent=e;
          s.style.left=((i*8.7+3)%96)+'%';s.style.animationDuration=(14+(i*5)%11)+'s';s.style.animationDelay='-'+((i*3.3)%14)+'s';bg.appendChild(s)});
      }
    },0);
  }
  /* o: {key,host,theme,words:[..],small:[..],tiles:[..],floats:[..],sub,body,msg,back:{label,onclick},compact} */
  window.obShell=function(o){
    const still=last===o.key;last=o.key;
    const lines=(o.words||[]).map(w=>{const ch=[...w];let i=0;return `<div class="ob-line" style="--n:${ch.length}">${ch.map(c=>c===' '?'<b style="width:.3em"></b>':`<b style="--i:${i++};--n:${ch.length}">${esc(c)}</b>`).join('')}</div>`}).join('');
    ensureBg(o.host||'body',o.floats||FL[o.theme]);
    return `<div class="ob${o.compact?' ob-compact':''}${still?' ob-still':''}" data-t="${esc(o.theme)}">
      ${o.back?`<button class="ob-back" onclick="${o.back.onclick}">${esc(o.back.label||'← Wstecz')}</button>`:''}
      <div class="ob-wrap">
        <div class="ob-logo" role="img" aria-label="${esc((o.words||[]).join(' '))}">${lines}</div>
        ${o.tiles&&o.tiles.length?`<div class="ob-tiles" aria-hidden="true">${o.tiles.map(t=>`<i>${esc(t)}</i>`).join('')}</div>`:''}
        ${o.sub?`<p class="ob-sub">${o.sub}</p>`:''}
        ${o.msg||''}
        ${o.body||''}
      </div></div>`;
  };
  window.obBtn=function(label,icon,onclick,kind,disabled,extra){
    return `<button class="ob-btn ob-${kind||'gold'}${extra?' '+extra:''}" ${disabled?'disabled':''} onclick="${onclick}">${icon?`<span class="ob-ic">${icon}</span>`:''}<span>${label}</span></button>`;
  };
  window.obRules=function(html){return `<details class="ob-rules"><summary>📖 Zasady gry</summary>${html}</details>`};
  window.obChip=function(label,on,onclick,disabled){return `<button class="ob-chip${on?' on':''}" ${disabled?'disabled':''} onclick="${onclick}">${label}</button>`};
  /* poczekalnia pokoju: o:{code,copy,players:[{name,color,host,me}],max,extra,test,note,start:{label,onclick,disabled}|null,leave:{label,onclick}} */
  window.obRoom=function(o){
    const pl=(o.players||[]).map((p,i)=>`<div class="ob-pl${p.me?' me':''}"><i style="background:${/^#[0-9a-f]{6}$/i.test(p.color||'')?p.color:'#888'}"></i><span>${i+1}. ${esc(p.name)}</span>${p.host?'<small>HOST</small>':(p.me?'<small>(Ty)</small>':'')}</div>`).join('');
    return `<div class="ob-pane ob-center"><label>Kod pokoju – podaj go znajomym</label><div class="ob-code">${esc(o.code)}</div>
        ${obBtn('Kopiuj kod','📋',`navigator.clipboard&amp;&amp;navigator.clipboard.writeText(${o.copy})`,'white',false,'ob-sm')}</div>
      <div class="ob-pane"><label>Gracze${o.max?` (${(o.players||[]).length}/${o.max})`:''}</label><div style="margin-top:8px">${pl}</div></div>
      ${o.extra||''}${o.test||''}
      ${o.note?`<p class="ob-note">${o.note}</p>`:''}
      ${o.start?obBtn(o.start.label||'Rozpocznij grę','🚀',o.start.onclick,'gold',o.start.disabled):''}
      ${o.leave?obBtn(o.leave.label||'Wyjdź z pokoju','🚪',o.leave.onclick,'white'):''}`;
  };
})();
</script>
<script>/* lobby → strona główna (chowanie przycisku „Menu główne” poza lobby) */
(function(){
  var sel='.ob:not(.ob-compact)';
  if(window.parent===window)return;
  function shown(e){
    if(!e)return false;
    var r=e.getBoundingClientRect(),cs=getComputedStyle(e);
    return r.width>40&&r.height>40&&cs.display!=='none'&&cs.visibility!=='hidden';
  }
  function send(){
    var l=false;try{l=shown(document.querySelector(sel))}catch(x){}
    try{window.parent.postMessage({type:'gmenu-lobby',lobby:l},'*')}catch(x){}
  }
  setInterval(send,250);send();
})();
</script>

<script>
/* ===== most do platformy (index.html): konto, Firebase, statystyki ===== */
(function(){
  var PB=null;try{PB=window.parent&&window.parent!==window?window.parent.PLATFORM_BRIDGE:null}catch(e){PB=null}
  function def(n,g){Object.defineProperty(window,n,{get:g,configurable:true})}
  def('ACC',function(){return PB?PB.ACC:{user:null,nick:'',col:'',admin:false}});
  def('fbDB',function(){return PB?PB.fbDB:null});
  def('firebase',function(){return PB?PB.firebase:undefined});
  def('onlinePlayerId',function(){return PB?PB.onlinePlayerId:null});
  window.onlineEnsureAuth=function(){return PB?PB.onlineEnsureAuth():Promise.reject(new Error('Brak połączenia z platformą — otwórz grę przez index.html.'))};
  window.onlineCode=function(){return Math.random().toString(36).slice(2,7).toUpperCase()};
  window.statsRecord=function(){if(PB)return PB.statsRecord.apply(null,arguments)};
  window.podNet=function(){return typeof fbDB!=='undefined'&&!!fbDB&&typeof onlineEnsureAuth==='function'};
})();
const lgEsc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
</script>
<script>
/* ================= STATKI ONLINE ================= */
const STK_FLEET=[4,3,3,2,2,2,1,1,1],STK_N=STK_FLEET.length,STK_CELLS=STK_FLEET.reduce((a,b)=>a+b,0);
let STK={ref:null,code:'',host:'',uid:'',listener:null,reqListener:null,resListener:null,room:null,players:[],status:'start',msg:'',joinCode:'',pane:'',nick:'Gracz',color:'#2a9df4',ships:[],orientation:'H',ready:false,privateRef:null,pending:false,processed:new Set(),requestsRef:null,responsesRef:null,shots:{},turn:'',winner:null};
function stkMe(){return STK.uid||onlinePlayerId}
function stkProfile(){const u=(typeof ACC!=='undefined'&&ACC.user)?ACC.user:null;
 /* nick i kolor zawsze pobierane automatycznie z konta gracza */
 STK.nick=String((typeof ACC!=='undefined'&&ACC.nick)||u?.displayName||(u?.email?u.email.split('@')[0]:'Gracz'));
 STK.color=(typeof ACC!=='undefined'&&/^#[0-9a-f]{6}$/i.test(ACC.col||''))?ACC.col:'#2a9df4';
 STK.nick=STK.nick.replace(/[<>&]/g,'').replace(/\s+/g,' ').trim().slice(0,18)||'Gracz'}
function stkDetach(){try{if(STK.ref&&STK.listener)STK.ref.off('value',STK.listener);if(STK.requestsRef&&STK.reqListener)STK.requestsRef.off('child_added',STK.reqListener);if(STK.responsesRef&&STK.resListener)STK.responsesRef.off('child_added',STK.resListener)}catch(e){}STK.ref=null;STK.listener=null;STK.reqListener=null;STK.resListener=null;STK.requestsRef=null;STK.responsesRef=null;STK.privateRef=null;STK.processed=new Set();STK.pending=false}
async function stkLeave(){const ref=STK.ref,uid=stkMe(),host=STK.host,status=STK.status,privateRef=STK.privateRef;try{if(ref&&status==='lobby'&&uid){if(host===uid)await ref.remove();else{await ref.child('players/'+uid).remove();if(privateRef)await privateRef.remove()}}else if(ref&&status==='play'&&uid){const other=STK.players.find(p=>p.id!==uid);if(other)await ref.update({status:'end',winner:other.id})}}catch(e){console.warn('Statki leave:',e)}stkDetach();Object.assign(STK,{code:'',host:'',room:null,players:[],status:'start',msg:'',ships:[],ready:false,shots:{},turn:'',winner:null});stkRender()}
function stkPane(p){STK.pane=STK.pane===p?'':p;stkRender();if(STK.pane==='join')setTimeout(()=>{const e=document.getElementById('stkjoincode');if(e)e.focus()},60)}
/* jedyny przycisk „Menu główne” w lobby (jak w Monopoly) – klik w pasek rodzica, który jest wtedy ukryty */
function stkHub(){
  try{const g=parent.document.querySelector('#statki .gmenu')||parent.document.querySelector('.gmenu');if(g){g.click();return}}catch(e){}
  try{parent.postMessage({type:'gmenu-back'},'*')}catch(e){}
}
const STK_T0=performance.now();
/* Przerysowanie bez „migania": zachowuje przewinięcie i fazę animacji (morze, statki, ogień) */
function stkPaint(el,h){
 if(STK.drag){STK.dirty=true;return}
 const sc=document.getElementById('stk'),top=sc?sc.scrollTop:0;
 if(sc)sc.style.setProperty('--stkT',((performance.now()-STK_T0)/1000).toFixed(3)+'s');
 el.innerHTML=h;
 if(sc&&sc.scrollTop!==top)sc.scrollTop=top;
}
function stkRender(){const el=document.getElementById('stkcontent');if(!el)return;if(STK.bot)return stkBotRender(el);let h='';if(STK.msg)h+=`<div class="stktoast" role="status">${lgEsc(STK.msg)}</div>`;
 if(!STK.ref){const net=podNet(),pn=STK.pane||'';
  const lv=STK.botLvl==null?1:STK.botLvl;
  const bot=pn==='bot'?`<div class="ob-pane"><label>Poziom bota</label><div class="ob-chips">${['Łatwy','Normalny','Trudny'].map((t,i)=>obChip(t,lv===i,`STK.botLvl=${i};stkRender()`)).join('')}</div><p class="ob-note">${['Bot strzela losowo.','Bot dobija trafione statki.','Bot liczy prawdopodobieństwo – trudny przeciwnik.'][lv]}</p>${obBtn('Rozpocznij grę','⚓','stkBotStart()','gold')}</div>`:'';
  const create=pn==='create'?`<div class="ob-pane">${obBtn('Stwórz pokój','🎲','stkCreate()','gold',!net)}</div>`:'';
  const join=pn==='join'?`<div class="ob-pane"><label for="stkjoincode">Kod pokoju od znajomego</label><input id="stkjoincode" class="cd" maxlength="5" placeholder="A8K2Q" autocomplete="off" value="${lgEsc(STK.joinCode)}" oninput="STK.joinCode=this.value.toUpperCase()" onkeydown="if(event.key==='Enter')stkJoin()">${obBtn('Dołącz','🚪','stkJoin()','gold',!net)}</div>`:'';
  el.innerHTML=obShell({key:'stk-start',host:'#stk',theme:'stk',words:['STATKI'],tiles:['⚓','🚢','💥','🌊'],sub:'Bitwa morska dla dwóch graczy.',msg:STK.msg?`<div class="ob-err">${lgEsc(STK.msg)}</div>`:'',
  back:{label:'← Menu główne',onclick:'stkHub()'},
  body:`${obBtn('Graj z botem (offline)','🤖',"stkPane('bot')",'gold')}${bot}${obBtn('Utwórz pokój','🏠',"stkPane('create')",'white')}${obBtn('Dołącz do znajomego','🚪',"stkPane('join')",'white')}
  ${create}${join}
  ${net?'':'<p class="ob-net">Gra online wymaga połączenia z platformą (Firebase). Gra z botem działa w pełni offline.</p>'}
  ${obRules('<p>Gra online dla 2 osób lub offline z botem. Każdy ustawia flotę na swojej planszy 10×10. Statki nie mogą na siebie nachodzić ani stykać się bokami lub rogami.</p><p>Plansza 10×10 · flota: 1×4, 2×3, 3×2 i 3×1 (9 statków). Statki przeciągasz z portu na planszę.</p>')}`});return}
 const list=STK.players.map(p=>`<span class="stkmuted">${lgEsc(p.name)}${p.id===STK.host?' (host)':''}${p.id===stkMe()?' (Ty)':''} ${p.ready?'✓ gotowy':'· ustawia flotę'}</span>`).join(' · ');
 h+=`<div class="stkbox"><div>Pokój: <span class="stkcode">${lgEsc(STK.code)}</span></div><div class="stkrow">${list}</div><div class="stkrow"><span class="stkmuted">Gracze: ${STK.players.length}/2</span><button class="stkbtn" onclick="navigator.clipboard?.writeText(STK.code).then(()=>{STK.msg='Kod skopiowany';stkRender()}).catch(()=>{STK.msg='Kod pokoju: '+STK.code;stkRender()})">Kopiuj kod</button><button class="stkbtn" onclick="stkLeave()">Opuść pokój</button></div></div>`;
 if(STK.status==='lobby'){
   if(!STK.ready){h+=stkPlaceBox(`<button class="stkbtn" onclick="stkReady()" ${STK.ships.length===STK_N?'':'disabled'}>Zatwierdź flotę</button>`)}
   else h+=`<div class="stkbox"><h3>Twoja flota jest gotowa ✓</h3><p>Czekaj, aż drugi gracz również zatwierdzi ustawienie.</p>${stkGridHTML('own')}</div>`;
   if(STK.host===stkMe())h+=`<div class="stkbox"><button class="stkbtn" onclick="stkStart()" ${STK.players.length===2&&STK.players.every(p=>p.ready)?'':'disabled'}>Rozpocznij bitwę</button><div class="stkmuted">Rozpocząć można, gdy obaj gracze zatwierdzą flotę.</div></div>`;
 }else if(STK.status==='play'){
   const myTurn=STK.turn===stkMe();h+=`<div class="stkbox"><h2>${myTurn?'Twoja tura — wybierz pole do ostrzału':'Ruch przeciwnika'}</h2><p class="stkmuted">${myTurn?'Kliknij pole na planszy przeciwnika. Trafienie daje kolejny strzał.':'Przeciwnik wykonuje strzał. Poczekaj na wynik.'}</p><div class="stkboards"><div class="stkboardwrap"><h3>Twoja flota</h3>${stkGridHTML('own')}</div><div class="stkboardwrap"><h3>Plansza przeciwnika</h3>${stkGridHTML('enemy')}</div></div><div class="stklegend"><span><i class="stkdot" style="background:#607d9b"></i>Twój statek</span><span><i class="stkdot" style="background:#e45d57"></i>Trafienie</span><span><i class="stkdot" style="background:#eaf3fa"></i>Pudło</span></div></div>`;
 }else if(STK.status==='end'){
   const won=STK.winner===stkMe();h+=`<div class="stkbox"><h2>${won?'🏆 Zwycięstwo!':'Koniec gry'}</h2><p>${won?'Zatopiłeś całą flotę przeciwnika!':'Przeciwnik zatopił całą Twoją flotę.'}</p><button class="stkbtn" onclick="stkLeave()">Wróć</button></div>`;
 }
 stkPaint(el,h);
}
function stkSunkSVG(len,ori){
 const W=len*100,V=ori==='V',w=V?100:W,h=V?W:100,F=n=>Math.round(n*10)/10;
 let hull=`<path d="M10 44H${F(W-34)}Q${F(W-12)} 48 ${F(W-6)} 60L${F(W-22)} 76H22Q12 72 10 44Z" fill="#4a5a70" stroke="#18222e" stroke-width="3" stroke-linejoin="round"/><rect x="20" y="44" width="${F(W-56)}" height="7" fill="#8a9bb0"/>`;
 if(len>=2)hull+=`<rect x="${F(W*.3)}" y="26" width="${F(Math.min(64,W*.26))}" height="18" rx="3" fill="#62748b" stroke="#18222e" stroke-width="3"/><rect x="${F(W*.3+8)}" y="31" width="9" height="8" fill="#cfe3f5"/>`;
 if(len>=3)hull+=`<rect x="${F(W*.62)}" y="18" width="14" height="26" fill="#6c5f55" stroke="#18222e" stroke-width="3"/>`;
 hull+=`<path d="M${F(W*.18)} 44V16l14 6" fill="none" stroke="#2a3644" stroke-width="3" stroke-linecap="round"/><path d="M${F(W*.46)} 44l8 10-6 8 9 12" fill="none" stroke="#0b1119" stroke-width="3" stroke-linecap="round"/><circle cx="${F(W*.46+5)}" cy="58" r="5" fill="#ff8a1f"/>`;
 const hg=`<g transform="rotate(-6 ${F(W/2)} 60)">${hull}</g>`;
 const ship=V?`<g transform="translate(100 0) rotate(90)">${hg}</g>`:hg;
 let water;
 if(V){const y0=F(h*.74);water=`<path d="M0 ${y0}q12.5 -9 25 0t25 0t25 0t25 0V${h}H0Z" fill="rgba(25,105,190,.8)"/>`}
 else water=`<path d="M0 64q12.5 -9 25 0${'t25 0'.repeat(Math.max(1,len*4-1))}V100H0Z" fill="rgba(25,105,190,.8)"/>`;
 let fx='';
 for(let i=0;i<len;i++){
  const cx=V?50:i*100+50,cy=V?i*100+38:42,d=(i*.37).toFixed(2);
  fx+=`<g class="fl" style="animation-delay:-${d}s"><path d="M${cx} ${cy}q-17 -8 -7 -30q5 10 14 5q13 14 -7 25z" fill="#ff8a1f"/><path d="M${cx} ${cy}q-8 -4 -3 -15q3 5 7 3q6 7 -4 12z" fill="#ffe066"/></g>`;
  fx+=`<circle class="sm" style="animation-delay:-${(i*.9).toFixed(2)}s" cx="${cx+6}" cy="${cy-34}" r="9" fill="#9aa4af"/><circle class="sm" style="animation-delay:-${(i*.9+1.3).toFixed(2)}s" cx="${cx-6}" cy="${cy-30}" r="7" fill="#b4bcc6"/>`;
 }
 return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><rect width="${w}" height="${h}" rx="10" fill="#0c2340" opacity=".82"/>${ship}${water}${fx}</svg>`;
}
function stkSunkOverlay(shots,local){
 const seen=new Set(),out=[];
 const add=sk=>{
  if(!sk||seen.has(sk))return;seen.add(sk);
  const cs=String(sk).split(',').map(t=>{const a=t.split('_');return {x:+a[0],y:+a[1]}}).filter(c=>isFinite(c.x)&&isFinite(c.y)).sort((a,b)=>a.x-b.x||a.y-b.y);
  if(!cs.length)return;
  const n=cs.length,ori=n>1&&cs[0].x===cs[1].x?'V':'H',c0=cs[0];
  out.push(`<div class="stksunk" style="grid-area:${c0.y+1}/${c0.x+1}/${ori==='V'?c0.y+1+n:c0.y+2}/${ori==='H'?c0.x+1+n:c0.x+2}">${stkSunkSVG(n,ori)}</div>`);
 };
 Object.values(shots||{}).forEach(x=>x&&add(x.sk));(local||[]).forEach(add);
 return out.join('');
}
/* dir 'out': z mojej planszy w pole planszy przeciwnika; 'in': z planszy przeciwnika w pole mojej */
function stkFly(k,dir){
 try{
  const inc=dir==='in',tk=inc?'own':'enemy',sk=inc?'enemy':'own';
  const tgt=document.querySelector('.stkboard[data-kind="'+tk+'"] [data-k="'+k+'"]');if(!tgt||!tgt.animate)return;
  const r=tgt.getBoundingClientRect(),ex=r.left+r.width/2,ey=r.top+r.height/2;
  const own=document.querySelector('.stkboard[data-kind="'+sk+'"]');
  let sx,sy;
  if(own){const o=own.getBoundingClientRect();sx=o.left+o.width/2;sy=o.top+o.height/2}else{sx=window.innerWidth/2;sy=inc?-40:window.innerHeight+40}
  if(Math.hypot(ex-sx,ey-sy)<140){sx=ex;sy=inc?-40:window.innerHeight+40}
  const mx=(sx+ex)/2,my=Math.min(sy,ey)-Math.max(90,Math.abs(ex-sx)*.25);
  const m=document.createElement('div');m.className='stkmissile';
  m.innerHTML='<svg viewBox="0 0 26 46" width="26" height="46"><path d="M9 26H17L13 46Z" fill="#ffa21f"/><path d="M13 0Q20 10 19 26H7Q6 10 13 0Z" fill="#dfe6ee" stroke="#33475f" stroke-width="1.5"/><path d="M7 22L0 36L8 32ZM19 22L26 36L18 32Z" fill="#e45d57"/><circle cx="13" cy="14" r="3" fill="#2a9df4"/></svg>';
  document.body.appendChild(m);
  const N=18,kf=[];
  for(let i=0;i<=N;i++){
   const t=i/N,u=1-t,px=u*u*sx+2*u*t*mx+t*t*ex,py=u*u*sy+2*u*t*my+t*t*ey;
   const dx=2*u*(mx-sx)+2*t*(ex-mx),dy=2*u*(my-sy)+2*t*(ey-my);
   kf.push({transform:`translate(${px}px,${py}px) rotate(${Math.atan2(dy,dx)*180/Math.PI+90}deg) scale(${1-.4*t})`,offset:t});
  }
  const a=m.animate(kf,{duration:700,easing:'ease-in',fill:'forwards'});
  a.onfinish=()=>m.remove();a.oncancel=()=>m.remove();
  setTimeout(()=>{try{m.remove()}catch(e){}},1500);
 }catch(e){console.error('Pocisk:',e)}
}
/* ===== grafiki okrętów na planszy (SVG, animowane) ===== */
const STK_PAL=[{h:'#4a5a70',d:'#8a9bb0',s:'#62748b',f:'#6c5f55',a:'#e45d57'},{h:'#3f5f58',d:'#8fb5a6',s:'#5a8076',f:'#6c5f55',a:'#ffd23f'},{h:'#6a4a5e',d:'#c79ab5',s:'#8a6279',f:'#4a3a46',a:'#5ee6c8'},{h:'#a8452f',d:'#f0a37f',s:'#d9d2bf',f:'#fff6dd',a:'#18222e'},{h:'#1f6fb0',d:'#7cc4ff',s:'#fff6dd',f:'#e45d57',a:'#ffd23f'}];

function stkCount(sh){return Object.values(sh||{}).filter(x=>x&&x.result==='hit').length}
function stkGenFleet(){
 for(let r=0;r<300;r++){
  const placed=[],used=new Set();let ok=true;
  for(const len of STK_FLEET){
   let found=false;
   for(let t=0;t<500&&!found;t++){
    const x=Math.floor(Math.random()*10),y=Math.floor(Math.random()*10),o=Math.random()<.5?'H':'V';
    if((o==='H'&&x+len>10)||(o==='V'&&y+len>10))continue;
    const cells=Array.from({length:len},(_,i)=>({x:x+(o==='H'?i:0),y:y+(o==='V'?i:0)}));
    if(cells.some(c=>{for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)if(used.has((c.x+dx)+'_'+(c.y+dy)))return true;return false}))continue;
    cells.forEach(c=>used.add(c.x+'_'+c.y));placed.push({len,cells});found=true;
   }
   if(!found){ok=false;break}
  }
  if(ok)return placed;
 }
 return [];
}
function stkResolve(ships,prev,x,y){
 const ship=ships.find(s=>s.cells.some(c=>c.x===x&&c.y===y)),rec={x,y,result:ship?'hit':'miss'};
 if(ship&&ship.cells.every(c=>(c.x===x&&c.y===y)||(prev[c.x+'_'+c.y]&&prev[c.x+'_'+c.y].result==='hit')))rec.sk=ship.cells.map(c=>c.x+'_'+c.y).join(',');
 return rec;
}

 STK.players=[{id:'me',name:STK.nick,ready:false},{id:'bot',name:'Bot',ready:true}];

function stkBotShoot(x,y){
 const B=STK.bot;if(!B||STK.status!=='play'||STK.turn!=='me'||STK.pending)return;
 const k=x+'_'+y;if(STK.shots.me[k])return;
 STK.pending=true;STK.aim=k;STK.flyEnd=Date.now()+720;STK.msg='';stkRender();stkFly(k);

  if(STK.bot!==B)return;
  const rec=stkResolve(B.ships,STK.shots.me,x,y);
  STK.shots.me[k]=rec;if(rec.sk)STK.skLocal.push(rec.sk);

  STK.msg=rec.result==='hit'?(rec.sk?'Zatopiony! Strzelasz ponownie.':'Trafiony! Strzelasz ponownie.'):'Pudło. Teraz strzela bot.';
  stkRender();

 },720);
}
function stkBotPick(){
 const lvl=STK.bot.lvl,mine=STK.shots.bot,ships=STK.ships,K=(x,y)=>x+'_'+y;
 const ok=(x,y)=>x>=0&&x<10&&y>=0&&y<10;
 const sunk=ships.filter(s=>s.cells.every(c=>mine[K(c.x,c.y)]));
 const sunkCells=new Set(),blocked=new Set();
 sunk.forEach(s=>s.cells.forEach(c=>{sunkCells.add(K(c.x,c.y));for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)if(ok(c.x+dx,c.y+dy))blocked.add(K(c.x+dx,c.y+dy))}));
 const free=[];for(let y=0;y<10;y++)for(let x=0;x<10;x++){const k=K(x,y);if(!mine[k]&&!blocked.has(k))free.push({x,y})}
 const any=a=>a[Math.floor(Math.random()*a.length)];
 if(!free.length){const all=[];for(let y=0;y<10;y++)for(let x=0;x<10;x++)if(!mine[K(x,y)])all.push({x,y});return any(all)}
 if(lvl===0)return any(free);
 const hits=[];Object.values(mine).forEach(r=>{if(r.result==='hit'&&!sunkCells.has(K(r.x,r.y)))hits.push({x:r.x,y:r.y})});
 if(lvl===1){
  if(hits.length){
   let cand=[];
   const sameRow=hits.length>1&&hits.every(h=>h.y===hits[0].y),sameCol=hits.length>1&&hits.every(h=>h.x===hits[0].x);
   hits.forEach(h=>{
    const dirs=sameRow?[[1,0],[-1,0]]:sameCol?[[0,1],[0,-1]]:[[1,0],[-1,0],[0,1],[0,-1]];
    dirs.forEach(([dx,dy])=>{const x=h.x+dx,y=h.y+dy;if(ok(x,y)&&!mine[K(x,y)]&&!blocked.has(K(x,y)))cand.push({x,y})});
   });
   if(cand.length)return any(cand);
  }
  const par=free.filter(c=>(c.x+c.y)%2===0);return any(par.length?par:free);
 }
 /* trudny: gęstość prawdopodobieństwa */
 const lens=ships.filter(s=>!sunk.includes(s)).map(s=>s.len),score={};
 const hitSet=new Set(hits.map(h=>K(h.x,h.y)));
 lens.forEach(len=>['H','V'].forEach(o=>{
  for(let y=0;y<10;y++)for(let x=0;x<10;x++){
   const cells=[];let valid=true,cov=0;
   for(let i=0;i<len;i++){
    const cx=x+(o==='H'?i:0),cy=y+(o==='V'?i:0),k=K(cx,cy);
    if(!ok(cx,cy)||blocked.has(k)||(mine[k]&&mine[k].result==='miss')){valid=false;break}
    if(hitSet.has(k)){if(len===1){valid=false;break}cov++}
    cells.push(k);
   }
   if(!valid)continue;
   const w=cov?Math.pow(25,cov):1;
   cells.forEach(k=>{if(!mine[k])score[k]=(score[k]||0)+w});
  }
 }));
 let best=-1,pool=[];
 free.forEach(c=>{const v=score[K(c.x,c.y)]||0;if(v>best){best=v;pool=[c]}else if(v===best)pool.push(c)});
 return any(pool);
}
function stkBotMove(){
 const B=STK.bot;if(!B||STK.status!=='play'||STK.turn!=='bot')return;
 const p=stkBotPick();
 stkFly(p.x+'_'+p.y,'in');
 B.t=setTimeout(()=>{if(STK.bot===B&&STK.status==='play'&&STK.turn==='bot')stkBotApply(B,p)},720);
}
function stkBotApply(B,p){
 const k=p.x+'_'+p.y,rec=stkResolve(STK.ships,STK.shots.bot,p.x,p.y);
 STK.shots.bot[k]=rec;
 STK.fxOwn={k,result:rec.result,until:Date.now()+900};
 if(stkCount(STK.shots.bot)>=STK_CELLS){STK.status='end';STK.winner='bot';STK.msg='';stkRender();return}
 STK.turn=rec.result==='hit'?'bot':'me';
 const cell=String.fromCharCode(65+p.x)+(p.y+1);
 STK.msg=rec.result==='hit'?(rec.sk?`Bot zatopił Twój statek (${cell}) i strzela ponownie.`:`Bot trafił w ${cell} i strzela ponownie.`):`Bot pudłuje (${cell}). Twoja kolej!`;
 stkRender();
 if(STK.turn==='bot')B.t=setTimeout(stkBotMove,1000);
}
function stkBotRender(el){
 const lv=['Łatwy','Normalny','Trudny'][STK.bot.lvl];let h='';
 h+=`<div class="stkbox"><div class="stkrow"><b>🤖 Gra z botem · ${lv}</b><span class="stkmuted">offline</span><button class="stkbtn" onclick="stkBotLeave()">Wyjdź</button></div></div>`;
 const boards=`<div class="stkboards"><div class="stkboardwrap"><h3>Twoja flota</h3>${stkGridHTML('own')}</div><div class="stkboardwrap"><h3>Plansza bota</h3>${stkGridHTML('enemy')}</div></div><div class="stklegend"><span><i class="stkdot" style="background:#607d9b"></i>Twój statek</span><span><i class="stkdot" style="background:#e45d57"></i>Trafienie</span><span><i class="stkdot" style="background:#eaf3fa"></i>Pudło</span></div>`;
 if(STK.status==='lobby'){
  h+=stkPlaceBox(`<button class="stkbtn" onclick="stkBotBegin()" ${STK.ships.length===STK_N?'':'disabled'}>Rozpocznij bitwę</button>`);
 }else if(STK.status==='play'){
  const my=STK.turn==='me';
  h+=`<div class="stkbox"><h2>${my?'Twoja tura — wybierz pole do ostrzału':'Ruch bota…'}</h2><p class="stkmuted">${my?'Kliknij pole na planszy bota. Trafienie daje kolejny strzał.':'Bot celuje. Poczekaj na wynik.'}</p>${boards}</div>`;
 }else{
  const won=STK.winner==='me';
  h+=`<div class="stkbox"><h2>${won?'🏆 Zwycięstwo!':'Porażka'}</h2><p>${won?'Zatopiłeś całą flotę bota!':'Bot zatopił całą Twoją flotę.'}</p><div class="stkrow"><button class="stkbtn" onclick="stkBotStart()">Zagraj ponownie</button><button class="stkbtn" onclick="stkBotLeave()">Wyjdź</button></div>${boards}</div>`;
 }
 stkPaint(el,h);
}

/* ================= STATKI: PORT (MENU) I PRZECIĄGANIE OKRĘTÓW ================= */
const STK_PALBY={1:3,2:1,3:0,4:4};
function stkCanEdit(){return STK.status==='lobby'&&!STK.ready}
function stkRemaining(){const r={};STK_FLEET.forEach(l=>{r[l]=(r[l]||0)+1});STK.ships.forEach(s=>{if(r[s.len]>0)r[s.len]--});return r}
function stkSelLen(){const r=stkRemaining();if(STK.sel&&r[STK.sel]>0)return STK.sel;let b=0;for(const l in r)if(r[l]>0&&+l>b)b=+l;return b}
function stkOri(s){const c=s.cells;return c.length>1&&c[0].x===c[1].x?'V':'H'}
function stkSelect(l){STK.sel=l;stkRender()}
function stkTrayHTML(){
 const r=stkRemaining(),sel=stkSelLen(),lens=[...new Set(STK_FLEET)].sort((a,b)=>b-a);
 const items=lens.map(l=>{const n=r[l],on=n>0;
  return `<div class="stktitem${on?'':' done'}${on&&sel===l?' sel':''}" ${on?`tabindex="0" onpointerdown="stkTrayDown(event,${l})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();stkSelect(${l})}"`:''} role="button" aria-label="Statek ${l}-polowy, zostało ${n}"><div class="stktship stksh" style="--n:${l};--d:-${(l*.7).toFixed(1)}s">${stkShipSVG(l,'H',STK_PALBY[l])}</div><span class="stktcnt">${on?'×'+n:'✓'}</span></div>`}).join('');
 return `<div class="stktray" id="stktray"><h4>⚓ Port</h4><p class="stkmuted">${stkSelLen()?'Przeciągnij statek na planszę':'Wszystkie statki są na planszy'}</p><div class="stktitems">${items}</div></div>`;
}
function stkPlaceBox(btn){
 const n=STK.ships.length;
 return `<div class="stkbox"><h3>Ustaw swoją flotę</h3><p>${stkSelLen()?'Przeciągnij statki z portu na planszę (albo wybierz statek i kliknij pole). Kliknij ustawiony statek, aby go obrócić.':'Cała flota stoi na planszy — zatwierdź ją albo przestaw statki przeciągając je.'}</p><div class="stkplace"><div class="stkboardwrap">${stkGridHTML('place')}</div>${stkTrayHTML()}</div><div class="stkrow"><button class="stkbtn" onclick="stkRotate()">Obróć: ${STK.orientation==='H'?'poziomo':'pionowo'}</button><button class="stkbtn" onclick="stkUndo()" ${n?'':'disabled'}>Cofnij statek</button><button class="stkbtn" onclick="stkRandom()">Losuj flotę</button><span class="stkmuted">Postawione: ${n}/${STK_N}</span></div><div class="stkrow">${btn}</div></div>`;
}
function stkCellClick(x,y){
 if(Date.now()-(STK.noClick||0)<450)return;
 if(STK.ships.some(s=>s.cells.some(c=>c.x===x&&c.y===y)))return; /* klik w statek (obrót) obsługuje wskaźnik */
 stkPlace(x,y);
}
function stkGeom(){
 const b=document.querySelector('.stkboard[data-kind="place"]');if(!b)return null;
 const r=b.getBoundingClientRect(),cs=getComputedStyle(b),pl=parseFloat(cs.paddingLeft)||0,pt=parseFloat(cs.paddingTop)||0,pr=parseFloat(cs.paddingRight)||0;
 return {left:r.left+pl,top:r.top+pt,c:(r.width-pl-pr)/10};
}
function stkTrayDown(e,len){
 if(!stkCanEdit()||STK.drag||(e.button||0)>0)return;
 stkDragArm(e,{len,ship:null});
}
function stkBoardDown(e,x,y){
 if(!stkCanEdit()||STK.drag||(e.button||0)>0)return;
 const i=STK.ships.findIndex(s=>s.cells.some(c=>c.x===x&&c.y===y));if(i<0)return;
 stkDragArm(e,{len:STK.ships[i].len,ship:STK.ships[i],idx:i});
}
function stkDragArm(e,o){
 stkDragDetach();
 STK.drag={o,id:e.pointerId,x0:e.clientX,y0:e.clientY,px:e.clientX,py:e.clientY,touch:e.pointerType!=='mouse',started:false,el:null};
 window.addEventListener('pointermove',stkDragMove);
 window.addEventListener('pointerup',stkDragUp);
 window.addEventListener('pointercancel',stkDragUp);
 window.addEventListener('keydown',stkDragKey);
 window.addEventListener('contextmenu',stkDragCtx);
 window.addEventListener('pointerdown',stkDragExtra);
}
function stkDragDetach(){
 window.removeEventListener('pointermove',stkDragMove);
 window.removeEventListener('pointerup',stkDragUp);
 window.removeEventListener('pointercancel',stkDragUp);
 window.removeEventListener('keydown',stkDragKey);
 window.removeEventListener('contextmenu',stkDragCtx);
 window.removeEventListener('pointerdown',stkDragExtra);
}
function stkDragBegin(D){
 const g=stkGeom();if(!g)return false;
 const o=D.o,sh=o.ship;
 D.len=o.len;D.ori=sh?stkOri(sh):STK.orientation;D.c=g.c;
 const w=D.ori==='H'?D.len*g.c:g.c,h=D.ori==='H'?g.c:D.len*g.c;
 if(sh){
  const c0=sh.cells[0];
  D.ox=Math.min(w,Math.max(0,D.x0-(g.left+c0.x*g.c)));D.oy=Math.min(h,Math.max(0,D.y0-(g.top+c0.y*g.c)));
  const ov=document.querySelector('.stkboard[data-kind="place"] .stksh[data-i="'+o.idx+'"]');if(ov)ov.style.visibility='hidden';
 }else{D.ox=w/2;D.oy=h/2}
 D.lift=D.touch?Math.round(g.c*1.4):0; /* na dotyku statek unosi się nad palcem */
 stkGhost(D);D.started=true;document.body.classList.add('stkdragging');
 return true;
}
function stkGhost(D){
 if(D.el)D.el.remove();
 const c=D.c,w=D.ori==='H'?D.len*c:c,h=D.ori==='H'?c:D.len*c,el=document.createElement('div');
 el.className='stkghost';el.style.width=w+'px';el.style.height=h+'px';
 el.innerHTML=stkShipSVG(D.len,D.ori,STK_PALBY[D.len]);
 document.body.appendChild(el);D.el=el;D.w=w;D.h=h;
}
function stkDragPos(D){
 const g=stkGeom();if(!g||!D.el)return;
 let gx=D.px-D.ox,gy=D.py-D.oy-D.lift;
 const mx=gx+D.w/2,my=gy+D.h/2,B=g.c*10,m=g.c*.3;
 const over=mx>=g.left-m&&mx<=g.left+B+m&&my>=g.top-m&&my<=g.top+B+m;
 stkPrevClear();D.valid=false;D.cx=D.cy=null;
 if(over){
  const cx=Math.round((gx-g.left)/g.c),cy=Math.round((gy-g.top)/g.c),ok=stkCanPlace(cx,cy,D.len,D.ori,D.o.ship);
  D.cx=cx;D.cy=cy;D.valid=ok;
  for(let i=0;i<D.len;i++){const x=cx+(D.ori==='H'?i:0),y=cy+(D.ori==='V'?i:0);if(x<0||y<0||x>9||y>9)continue;const el=document.querySelector('.stkboard[data-kind="place"] [data-k="'+x+'_'+y+'"]');if(el)el.classList.add(ok?'pvok':'pvbad')}
  if(ok){gx=g.left+cx*g.c;gy=g.top+cy*g.c} /* „przyciąganie” do siatki */
 }
 D.el.style.transform='translate('+gx+'px,'+gy+'px)';
 D.el.classList.toggle('bad',over&&!D.valid);
 const t=document.getElementById('stktray');
 if(t){const r=t.getBoundingClientRect();D.tray=!!D.o.ship&&!over&&D.px>=r.left&&D.px<=r.right&&D.py>=r.top&&D.py<=r.bottom;t.classList.toggle('drop',D.tray)}
}
function stkDragMove(e){
 const D=STK.drag;if(!D||e.pointerId!==D.id)return;
 if(!stkCanEdit()){stkDragFinish(D,false);return}
 D.px=e.clientX;D.py=e.clientY;
 if(!D.started){
  if(Math.hypot(D.px-D.x0,D.py-D.y0)<6)return;
  if(!stkDragBegin(D)){stkDragFinish(D,false);return}
 }
 stkDragPos(D);
}
function stkDragRot(){
 const D=STK.drag;if(!D||!D.started||D.len<2)return;
 D.ori=D.ori==='H'?'V':'H';if(!D.o.ship)STK.orientation=D.ori;
 D.ox=(D.ori==='H'?D.len*D.c:D.c)/2;D.oy=(D.ori==='H'?D.c:D.len*D.c)/2;
 stkGhost(D);stkDragPos(D);
}
function stkDragKey(e){
 const D=STK.drag;if(!D)return;
 if(e.key==='r'||e.key==='R'||e.key===' '){e.preventDefault();stkDragRot()}
 else if(e.key==='Escape'){e.preventDefault();stkDragFinish(D,false)}
}
function stkDragCtx(e){if(STK.drag&&STK.drag.started){e.preventDefault();stkDragRot()}}
function stkDragExtra(e){const D=STK.drag;if(D&&D.started&&e.pointerId!==D.id){e.preventDefault();stkDragRot()}} /* drugi palec = obrót */
function stkDragUp(e){
 const D=STK.drag;if(!D||e.pointerId!==D.id)return;
 stkDragFinish(D,e.type==='pointerup');
}
function stkRotateShip(s){
 if(s.len<2)return;
 const h=s.cells[0],o=stkOri(s)==='H'?'V':'H';
 for(let k=0;k<s.len;k++){
  const x=h.x-(o==='H'?k:0),y=h.y-(o==='V'?k:0);
  if(stkCanPlace(x,y,s.len,o,s)){s.cells=Array.from({length:s.len},(_,i)=>({x:x+(o==='H'?i:0),y:y+(o==='V'?i:0)}));STK.msg='';return}
 }
 STK.msg='Nie można obrócić statku – brak miejsca.';
}
function stkDragFinish(D,commit){
 const o=D.o,ok=stkCanEdit();
 stkDragDetach();
 if(D.el)D.el.remove();
 document.body.classList.remove('stkdragging');
 stkPrevClear();
 STK.drag=null;STK.dirty=false;STK.noClick=Date.now();
 if(commit&&ok){
  if(!D.started){ /* samo kliknięcie: z portu = wybór statku, ze statku na planszy = obrót */
   if(o.ship)stkRotateShip(o.ship);else STK.sel=o.len;
  }else if(D.valid&&D.cx!=null){
   const cells=Array.from({length:D.len},(_,i)=>({x:D.cx+(D.ori==='H'?i:0),y:D.cy+(D.ori==='V'?i:0)}));
   if(o.ship)o.ship.cells=cells;else{STK.ships.push({len:D.len,cells});STK.sel=D.len}
   STK.msg='';
  }else if(D.tray&&o.ship){ /* upuszczony na port = zdjęty z planszy */
   const i=STK.ships.indexOf(o.ship);if(i>=0)STK.ships.splice(i,1);
   STK.sel=o.len;STK.msg='';
  }
 }
 stkRender();
}

/* ===== integracja z platformą: wejście do gry / wyjście z gry ===== */
window.__show=function(){
  stkProfile();if(!STK.ref&&!STK.bot){STK.status='start';STK.msg=''}stkRender();
};
window.__leave=function(){if(STK.bot)stkBotLeave(true)};
window.__joinFromHub=async function(c){STK.joinCode=c;await stkJoin()};
window.__show();
</script>
