<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grzybobranie</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<link rel="stylesheet" href="grzybobranie.css">
</head>
<body>
<h1>🍄 Grzybobranie</h1>
<p class="sub">Idź ścieżką przez las, zbieraj borowiki do koszyka i uważaj na muchomory!</p>

<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="mb" viewBox="-20 -22 40 40"><path d="M-7 2h14l3 12q0 4-4 4h-12q-4 0-4-4z" fill="#f6e7c6" stroke="#c9ad7a" stroke-width="1.5"/><path d="M-18 4q0-22 18-22t18 22q0 3-4 3h-28q-4 0-4-3z" fill="#8a4b22" stroke="#5e300f" stroke-width="1.5"/><path d="M-12-6q4-8 12-9" stroke="#b9743f" stroke-width="3" fill="none" stroke-linecap="round"/></symbol>
<symbol id="mr" viewBox="-20 -22 40 40"><path d="M-6 2h12l2 12q0 4-4 4h-8q-4 0-4-4z" fill="#fff" stroke="#bbb" stroke-width="1.5"/><path d="M-19 4q0-23 19-23t19 23q0 3-4 3h-30q-4 0-4-3z" fill="#e2352b" stroke="#9c1c14" stroke-width="1.5"/><circle cx="-8" cy="-5" r="3.2" fill="#fff"/><circle cx="6" cy="-9" r="3.6" fill="#fff"/><circle cx="10" cy="0" r="2.6" fill="#fff"/><circle cx="-1" cy="1" r="2.4" fill="#fff"/></symbol>
<radialGradient id="stone" cx="40%" cy="35%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e3e7de"/></radialGradient>
<radialGradient id="grass" cx="50%" cy="40%"><stop offset="0" stop-color="#a6dd6a"/><stop offset="1" stop-color="#5fae45"/></radialGradient>
</defs></svg>

<div id="home" class="home">
  <div class="card center">
    <p class="muted" style="margin:0 0 8px">Twój nick</p>
    <input id="name" maxlength="14" placeholder="np. Kasia" autocomplete="off">
    <div class="colrow"><span class="muted">Kolor pionka</span><input id="pcol" type="color" value="#e53935" aria-label="Kolor pionka"></div>
    <div id="net" class="muted" style="font-size:14px;margin-top:10px"></div>
  </div>
  <div class="card" style="display:grid;gap:12px">
    <button id="create" class="alt">🌲 Stwórz nowy pokój</button>
    <div class="center muted">— albo dołącz do znajomych —</div>
    <input id="code" class="code" maxlength="4" placeholder="KOD" autocomplete="off">
    <button id="join">🧺 Dołącz do pokoju</button>
    <div id="err" class="err"></div>
  </div>
  <p class="sub" style="font-size:13px">Znajomi wybierają Grzybobranie w menu gier i wpisują kod pokoju (do 4 osób).</p>
</div>

<div id="lobby" class="home hide">
  <div class="card center">
    <div class="muted">Kod pokoju</div>
    <div class="big" id="lcode"></div>
    <button class="ghost" id="copy">📋 Skopiuj kod</button>
    <div class="plist" id="lplayers"></div>
    <button id="start">▶ Zaczynamy grzybobranie!</button>
    <div id="lwait" class="muted hide">Czekamy aż gospodarz rozpocznie grę…</div>
    <div id="lerr" class="err"></div>
    <button class="ghost" id="leave1">← wyjdź</button>
  </div>
</div>

<div id="game" class="game hide">
  <div class="card boardwrap"><svg id="board" class="board" viewBox="0 0 1000 640"></svg></div>
  <div class="card">
    <div class="center muted" style="font-size:14px">Pokój <b id="gcode"></b></div>
    <div class="plist" id="gplayers"></div>
    <div class="status" id="status"></div>
    <div class="die" id="die"></div>
    <button id="roll" style="width:100%">🎲 Rzuć kostką</button>
    <div class="log" id="log"></div>
    <button class="ghost" id="leave2" style="width:100%;margin-top:6px">← wyjdź z gry</button>
  </div>
</div>
<div id="winbox" class="win hide"></div>

<script>
/* most do Firebase hosta (index.html): pokoje online + nick/kolor z konta + statystyki */
(function(){
var P=window.parent,B=null;
try{B=P&&P!==window&&P.grzBridge&&P.grzBridge()}catch(e){B=null}
window.__grzNick=function(){try{return B&&B.nick()||''}catch(e){return''}};
window.__grzCol=function(){try{return B&&B.col()||''}catch(e){return''}};
window.__grzStats=function(code,gid,players,r){try{if(B)B.stats(code,gid,players,r)}catch(e){}};
window.__grzNet=function(){try{return !!(B&&B.net())}catch(e){return false}};
window.__grzJoin=async function(name){
  if(!B||!B.net())throw new Error('Pokoje online są niedostępne (brak połączenia z Firebase).');
  var uid=await B.auth();
  var path='tttRooms/'+String(name).toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,40);
  var ref=B.db.ref(path),pr=ref.child('peers'),ms=ref.child('msgs');
  var cache={},pc=[],h={},gone=false,first=true;
  var startKey=ms.push().key;
  await pr.child(uid).set({t:B.ts});
  try{pr.child(uid).onDisconnect().remove()}catch(e){}
  function fire(c){pc.forEach(function(f){try{f(c)}catch(e){console.error(e)}})}
  var onVal=pr.on('value',function(s){
    var v=s.val()||{},joined=[],left=[];
    Object.keys(v).forEach(function(k){if(!cache[k]&&!first&&k!==uid)joined.push({peer:k});cache[k]=v[k]&&v[k].p||{}});
    Object.keys(cache).forEach(function(k){if(!v[k]){delete cache[k];if(k!==uid)left.push({peer:k})}});
    first=false;fire({joined:joined,left:left});
  });
  await pr.once('value').then(function(s){var v=s.val()||{};Object.keys(v).forEach(function(k){cache[k]=v[k]&&v[k].p||{}})});
  var q=ms.orderByKey().startAt(startKey);
  var onMsg=q.on('child_added',function(s){var v=s.val();if(!v||!v.t)return;var fs=h[v.t];if(!fs)return;
    var m={peer:v.peer,isMe:v.peer===uid,ts:+v.ts||Date.now(),data:v.data===undefined?null:v.data};
    fs.slice().forEach(function(f){try{f(m)}catch(e){console.error(e)}})});
  return{
    uid:uid,
    peers:function(){return Object.keys(cache).map(function(k){return{peer:k,isMe:k===uid,presence:cache[k]||{}}})},
    presence:function(o){cache[uid]=o;return pr.child(uid).set({t:B.ts,p:o})},
    on:function(t,f){(h[t]=h[t]||[]).push(f);return function(){h[t]=(h[t]||[]).filter(function(x){return x!==f})}},
    onPeers:function(f){pc.push(f);return function(){pc=pc.filter(function(x){return x!==f})}},
    emit:function(t,d){if(gone)return Promise.resolve();var r=ms.push();var p=r.set({t:t,peer:uid,data:d===undefined?null:d,ts:B.ts});setTimeout(function(){r.remove().catch(function(){})},20000);return p},
    leave:function(){if(gone)return Promise.resolve();gone=true;try{pr.off('value',onVal);q.off('child_added',onMsg)}catch(e){}
      try{pr.child(uid).onDisconnect().cancel()}catch(e){}
      return pr.child(uid).remove().then(function(){return pr.once('value')}).then(function(s){if(!s.val())return ref.remove()}).catch(function(){})}
  };
};
})();
</script>
<script>
const $=s=>document.querySelector(s);
const HEX=/^#[0-9a-f]{6}$/i;
const FALL=['#e53935','#1e88e5','#fdd835','#8e24aa','#43a047','#fb8c00','#00acc1','#6d4c41'];
const MAXP=4;
let room=null,me=null,isHost=false,code='',S=null,disp={},lastEv=0,lastRn=0,lastGid='',shownWin='',doneRec='',animGot=[],anim=false,stepT=null,beat=null,unsubs=[],rollLock=0,PATHS={};

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const cleanN=v=>String(v||'').replace(/[\u0000-\u001f\u200b-\u200f\u2028-\u202f<>&]/g,'').trim().slice(0,14);
const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const cd=(a,b)=>{const x=rgb(a),y=rgb(b);return Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2])};
/* kolory graczy: z kont; jeśli dwa są prawie identyczne, późniejszy dostaje kolor zastępczy */
function uniqCols(list){const out=[];list.forEach(c=>{let v=HEX.test(c||'')?c.toLowerCase():'';
  if(!v||out.some(o=>cd(o,v)<60))v=FALL.find(f=>out.every(o=>cd(o,f)>=60))||FALL[out.length%FALL.length];out.push(v)});return out}
const pcol=p=>HEX.test(p&&p.col||'')?p.col:'#888888';
/* grzyby na planszy: tekst długości N, 'b' = borowik, 'r' = muchomor, '.' = pusto (prosta struktura odporna na zamiany Firebase tablic/obiektów) */
const mAt=i=>{const c=S&&typeof S.mush==='string'?S.mush[i]:'';return c==='b'||c==='r'?c:''};
const clrM=i=>{S.mush=S.mush.slice(0,i)+'.'+S.mush.slice(i+1)};

// ---------- board geometry ----------
const COLS=12,ROWS=6,N=COLS*ROWS,GOAL=N-1;
const STONES=[],ADJ=Array.from({length:N},()=>[]),EDGES=[];
for(let i=0;i<N;i++){const r=Math.floor(i/COLS),c=i%COLS;STONES.push({x:78+c*77+Math.cos(i*2.1)*8,y:75+r*98+Math.sin(i*1.3)*9,rot:Math.sin(i*3.7)*14});}
(function(){const cand=[];for(let i=0;i<N;i++){const r=Math.floor(i/COLS),c=i%COLS;if(c<COLS-1)cand.push([i,i+1]);if(r<ROWS-1)cand.push([i,i+COLS]);}
const keep=cand.map(()=>true),deg=Array(N).fill(0);cand.forEach(e=>{deg[e[0]]++;deg[e[1]]++});
const conn=()=>{const a=Array.from({length:N},()=>[]);cand.forEach((e,k)=>{if(keep[k]){a[e[0]].push(e[1]);a[e[1]].push(e[0])}});const seen=new Set([0]),q=[0];while(q.length){const u=q.pop();a[u].forEach(v=>{if(!seen.has(v)){seen.add(v);q.push(v)}})}return seen.size===N};
cand.forEach((e,k)=>{if((e[0]*7+e[1]*13)%7<2&&deg[e[0]]>2&&deg[e[1]]>2){keep[k]=false;if(conn()){deg[e[0]]--;deg[e[1]]--}else keep[k]=true}});
cand.forEach((e,k)=>{if(keep[k]){EDGES.push(e);ADJ[e[0]].push(e[1]);ADJ[e[1]].push(e[0])}});})();
const TREES=[[40,22,.6],[200,20,.55],[380,22,.6],[560,20,.55],[740,22,.6],[900,20,.55],[250,618,.55],[430,620,.6],[610,618,.55],[780,620,.6],[30,160,.7],[30,350,.8],[30,540,.7],[975,160,.7],[975,350,.8],[975,470,.6]];
function tree(x,y,s){return `<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="48" rx="34" ry="8" fill="rgba(0,0,0,.15)"/><rect x="-6" y="30" width="12" height="20" fill="#7a4a24" rx="3"/>
<path d="M0-62L-30-14h60z" fill="#1f7a3a"/><path d="M0-38L-38 12h76z" fill="#26904a"/><path d="M0-14L-44 38h88z" fill="#2fa657"/></g>`}
function flower(x,y,i){const c=['#ff7a9c','#ffd447','#fff','#ff9a4a'][i%4];return `<g transform="translate(${x} ${y})"><circle r="3" fill="${c}"/><circle cx="5" r="3" fill="${c}"/><circle cx="-5" r="3" fill="${c}"/><circle cy="5" r="3" fill="${c}"/><circle cy="-5" r="3" fill="${c}"/><circle r="2.2" fill="#f5a623"/></g>`}
function sign(x,y,t,rot){return `<g transform="translate(${x} ${y}) rotate(${rot})"><rect x="-4" y="0" width="8" height="18" fill="#7a4a24" rx="2"/><rect x="-42" y="-24" width="84" height="30" rx="6" fill="#d9a066" stroke="#7a4a24" stroke-width="3"/><text x="0" y="-3" text-anchor="middle" font-size="19" font-weight="800" fill="#4a2a10" font-family="Baloo 2,sans-serif">${t}</text></g>`}

function drawBoard(){
  let s=`<rect width="1000" height="640" fill="url(#grass)"/>`;
  for(let i=0;i<70;i++){const x=(i*173)%1000,y=(i*97)%640;s+=`<path d="M${x} ${y}l3-9 3 9m1 0l3-7 2 7" stroke="#4d9a3a" stroke-width="2" fill="none" opacity=".55"/>`}
  for(let r=0;r<ROWS-1;r++)for(let c=0;c<COLS-1;c++)if((c*3+r*5)%4===0)s+=flower(78+(c+.5)*77,75+(r+.5)*98,c+r);
  TREES.forEach(t=>s+=tree(...t));
  EDGES.forEach(([a,b])=>{const A=STONES[a],B=STONES[b];s+=`<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="#ecf5d2" stroke-width="11" stroke-linecap="round" opacity=".9"/>`});
  STONES.forEach((p,i)=>{
    const fin=i===0||i===GOAL;
    s+=`<g transform="translate(${p.x} ${p.y}) rotate(${p.rot})"><ellipse cx="0" cy="4" rx="32" ry="24" fill="rgba(0,0,0,.18)"/><ellipse rx="32" ry="24" fill="${fin?'#fff3c4':'url(#stone)'}" stroke="#c9d1c0" stroke-width="2"/></g>`;
    const m=S&&(mAt(i)||(animGot.find(g=>g.i===i)||{}).t);
    if(m)s+=`<use href="#m${m}" x="${p.x-18}" y="${p.y-28}" width="36" height="36"/>`;
  });
  s+=sign(STONES[0].x,28,'START',-3)+sign(STONES[GOAL].x,612,'META',3);
  s+=`<text x="${STONES[GOAL].x}" y="${STONES[GOAL].y+9}" text-anchor="middle" font-size="24">🏁</text>`;
  if(S){
    const at={};
    S.players.forEach((p,k)=>{const d=disp[p.id]??p.pos;(at[d]=at[d]||[]).push([p,k])});
    for(const d in at){at[d].forEach(([p,k],j)=>{const st=STONES[d];const n=at[d].length;
      const x=st.x+(j-(n-1)/2)*17,y=st.y+(n>1?6:9);
      s+=`<g style="pointer-events:none" transform="translate(${x} ${y})" opacity="${p.gone?.4:1}"><ellipse cy="12" rx="10" ry="4" fill="rgba(0,0,0,.3)"/><circle cy="-2" r="12" fill="${pcol(p)}" stroke="#fff" stroke-width="3"/><circle cx="-4" cy="-7" r="4" fill="rgba(255,255,255,.55)"/></g>`;});}
    const cur=S.players[S.turn];
    if(S.phase==='play'&&S.opts&&cur&&cur.id===me)S.opts.forEach(i=>{const p=STONES[i];
      s+=`<g class="opt" data-i="${i}" style="cursor:pointer"><ellipse cx="${p.x}" cy="${p.y}" rx="38" ry="29" fill="rgba(255,235,59,.4)" stroke="#ffc400" stroke-width="4" class="pulse"/></g>`});
  }
  $('#board').innerHTML=s;
}


// ---------- logika gospodarza ----------
function emitState(){
  if(!S)return;
  S.v=Math.max((S.v||0)+1,Date.now()*10);
  if(room)room.emit('state',S).catch(()=>{});
  onState();
}
function startGame(){
  if(!isHost||!room)return;
  const L=plist().slice(0,MAXP);if(!L.length)return;
  const cols=uniqCols(L.map(p=>p.presence.c));
  const free=[];for(let i=1;i<GOAL;i++)free.push(i);
  for(let i=free.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[free[i],free[j]]=[free[j],free[i]]}
  const arr=Array(N).fill('.');free.slice(0,20).forEach(i=>arr[i]='b');free.slice(20,27).forEach(i=>arr[i]='r');
  S={gid:Date.now().toString(36)+Math.random().toString(36).slice(2,6),phase:'play',
    players:L.map((p,i)=>({id:p.peer,name:cleanN(p.presence.n)||'Gracz',col:cols[i],pos:0,b:0,r:0,gone:false})),
    turn:0,mush:arr.join(''),dice:0,rn:0,n:0,log:['Wyruszamy do lasu! 🌲'],v:0};
  PATHS={};emitState();
}
function nextTurn(){
  for(let k=1;k<=S.players.length;k++){const t=(S.turn+k)%S.players.length;if(!S.players[t].gone){S.turn=t;return}}
}
function movesFor(from,d){
  const res={},sc={};
  for(let len=d;len>=1&&!Object.keys(res).length;len--){
    const dfs=path=>{const u=path[path.length-1],steps=path.length-1;
      if(steps>0&&(u===GOAL||steps===len)){let v=0;path.slice(1).forEach(n=>{const m=mAt(n);if(m==='b')v++;if(m==='r')v--});
        if(sc[u]===undefined||v>sc[u]){sc[u]=v;res[u]=path}return}
      ADJ[u].forEach(w=>{if(!path.includes(w))dfs([...path,w])})};
    dfs([from]);
  }
  return res;
}
/* koniec gry: punkty = borowiki − muchomory (min. 0) + 3 za dotarcie do mety; remis liczy się jako remis w statystykach */
function finishGame(finId,forfeitId){
  S.phase='end';
  const sc=S.players.map(q=>Math.max(0,q.b-q.r)+(q.id===finId?3:0));
  let winners;
  if(forfeitId)winners=[forfeitId];
  else{
    const live=S.players.map((q,i)=>({q,s:sc[i]})).filter(x=>!x.q.gone);
    const top=Math.max(...live.map(x=>x.s));
    winners=live.filter(x=>x.s===top).map(x=>x.q.id);
    if(winners.length>1&&winners.includes(finId))winners=[finId];
  }
  S.final=sc;S.winners=winners;S.fin=finId||'';
}
/* jeśli w grze 2+ osób został tylko jeden gracz – wygrywa walkowerem */
function checkForfeit(){
  if(S.phase!=='play'||S.players.length<2)return false;
  const live=S.players.filter(p=>!p.gone);
  if(live.length>1)return false;
  S.opts=null;PATHS={};
  S.log=[live.length?`${live[0].name} został sam w lesie — wygrywa! 🏆`:'Wszyscy wyszli z lasu.',...S.log].slice(0,12);
  finishGame('',live.length?live[0].id:'');
  return true;
}
function doMove(to){
  const p=S.players[S.turn],path=PATHS[to],d=S.dice;if(!p||!path)return;
  let gb=0,gr=0;const got=[];
  path.slice(1).forEach(i=>{const m=mAt(i);if(m){got.push({i,t:m});if(m==='b'){p.b++;gb++}else{p.r++;gr++}clrM(i)}});
  p.pos=to;S.opts=null;PATHS={};S.n++;S.ev={pid:p.id,path,n:S.n,got};
  let msg=`${p.name} idzie ${path.length-1} pól`;if(gb)msg+=` · 🍄 +${gb}`;if(gr)msg+=` · muchomor! −${gr}`;
  S.log=[msg,...S.log].slice(0,12);
  if(to===GOAL){S.log=[`${p.name} dotarł do mety! 🏁`,...S.log];finishGame(p.id,'')}
  else if(d!==6)nextTurn();
  else S.log=['Szóstka — rzut jeszcze raz! ✨',...S.log];
  emitState();
}
function act(peer,a){
  if(!isHost||!S||S.phase!=='play')return;
  const cur=S.players[S.turn];if(!cur||cur.id!==peer||cur.gone)return;
  if(a==='roll'&&!S.opts){
    const d=1+Math.floor(Math.random()*6);
    PATHS=movesFor(cur.pos,d);S.dice=d;S.rn++;S.opts=Object.keys(PATHS).map(Number);
    S.log=[`${cur.name} wyrzucił ${d} 🎲`,...S.log].slice(0,12);
    if(S.opts.length===1)return doMove(S.opts[0]);
    return emitState();
  }
  if(typeof a==='string'&&a.startsWith('move:')&&S.opts){const to=+a.slice(5);if(S.opts.includes(to))doMove(to)}
}
function leftPeer(id){
  if(!isHost||!S||S.phase!=='play')return;
  const p=S.players.find(x=>x.id===id);if(!p||p.gone)return;
  p.gone=true;S.log=[`${p.name} wychodzi z lasu 💤`,...S.log].slice(0,12);
  if(S.players[S.turn]===p){S.opts=null;PATHS={};nextTurn()}
  checkForfeit();
  emitState();
}

// ---------- pokoje (Firebase przez most z index.html) ----------
function plist(){
  const L=room?room.peers().filter(p=>p.presence&&p.presence.n):[];
  return L.sort((a,b)=>(b.presence.h?1:0)-(a.presence.h?1:0)||(+a.presence.ts||0)-(+b.presence.ts||0)||(a.peer<b.peer?-1:1));
}
const netOk=()=>!!(window.__grzNet&&window.__grzNet());
const myName=()=>cleanN($('#name').value)||'Gracz';
const myCol=()=>HEX.test($('#pcol').value)?$('#pcol').value:'#e53935';
const genCode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from({length:4},()=>a[Math.floor(Math.random()*a.length)]).join('')};
function setBusy(b){$('#create').disabled=$('#join').disabled=b||!netOk()}
async function connect(host){
  const err=$('#err');err.textContent='';
  let c=host?genCode():$('#code').value.trim().toUpperCase();
  if(!/^[A-Z0-9]{4}$/.test(c)){err.textContent='Kod ma 4 znaki.';return}
  setBusy(true);
  try{
    let tries=0;
    for(;;){
      room=await window.__grzJoin('grzyb-'+c.toLowerCase());
      /* nowy pokój nie może „wejść” w cudzy – jeśli kod zajęty, losujemy inny */
      if(host&&room.peers().some(p=>!p.isMe&&p.presence&&p.presence.h)&&tries++<8){await room.leave();room=null;c=genCode();continue}
      break;
    }
    me=room.uid;code=c;isHost=host;S=null;doneRec='';lastGid='';shownWin='';
    await room.presence({n:myName(),c:myCol(),h:host,ts:Date.now()});
    unsubs=[room.on('state',onStateMsg),room.on('act',onActMsg),room.onPeers(onPeers)];
    $('#lcode').textContent=c;$('#lerr').textContent='';show('lobby');renderLobby();
    if(host){beat=setInterval(()=>{if(S&&room)room.emit('state',S).catch(()=>{})},6000)}
    else{
      const t0=Date.now();
      while(room&&Date.now()-t0<3500&&!plist().some(p=>p.presence.h))await sleep(250);
      if(!room)return;
      const L=plist();
      if(!L.some(p=>p.presence.h)){leave();err.textContent='Nie znaleziono pokoju o kodzie '+c+'. Sprawdź kod.';return}
      if(L.length>MAXP&&!L.slice(0,MAXP).some(p=>p.isMe)){leave();err.textContent='Pokój jest pełny (max '+MAXP+' graczy).';return}
    }
  }catch(e){
    room=null;err.textContent=(e&&e.message)||('Nie udało się wejść do pokoju ('+(e&&e.code||'błąd')+').');show('home');
  }
  setBusy(false);
}
function leave(){
  unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];
  clearInterval(beat);beat=null;clearInterval(stepT);anim=false;
  if(room){try{room.leave().catch(()=>{})}catch(e){}}
  room=null;S=null;me=null;isHost=false;disp={};animGot=[];lastEv=0;lastRn=0;lastGid='';shownWin='';PATHS={};
  $('#winbox').classList.add('hide');show('home');setBusy(false);
}
function show(w){['home','lobby','game'].forEach(x=>$('#'+x).classList.toggle('hide',x!==w))}
function send(a){if(!room)return;if(isHost)act(me,a);else room.emit('act',{a}).catch(()=>{})}
function onActMsg(m){if(isHost&&!m.isMe)act(m.peer,m.data&&m.data.a)}
function onStateMsg(m){
  if(isHost||m.isMe)return;
  const s=m.data;if(!s||!s.gid||!Array.isArray(s.players))return;
  if(!s.players.some(p=>p.id===me)){if(!S)$('#lerr').textContent='Gra już trwa – poczekaj na kolejną rundę.';return}
  if(S&&s.gid===S.gid&&(s.v||0)<=(S.v||0))return;
  S=s;onState();
}
function onPeers(ch){
  if(!room)return;
  if(isHost){
    if(S&&ch.joined.length)room.emit('state',S).catch(()=>{});
    ch.left.forEach(p=>leftPeer(p.peer));
  }else if(ch.left.length&&!plist().some(p=>p.presence.h)&&!(S&&S.phase==='end')){
    const c=code;setTimeout(()=>{if(room){leave();$('#err').textContent='Gospodarz zamknął pokój '+c+'.'}},S?1500:0);
    if(S)$('#status').textContent='Gospodarz wyszedł z pokoju…';
    return;
  }
  if(!S)renderLobby();
}
function renderLobby(){
  if(S||!room)return;
  const L=plist(),V=L.slice(0,MAXP),cols=uniqCols(V.map(p=>p.presence.c));
  $('#lplayers').innerHTML=V.map((p,i)=>`<div class="pl"><span class="dot" style="background:${cols[i]}"></span><b>${esc(cleanN(p.presence.n))}${p.isMe?' (ty)':''}${p.presence.h?' 👑':''}</b></div>`).join('')||'<div class="muted">Łączenie…</div>';
  if(L.length>MAXP)$('#lplayers').insertAdjacentHTML('beforeend',`<div class="muted center" style="font-size:14px">+${L.length-MAXP} czeka na wolne miejsce (max ${MAXP})</div>`);
  $('#start').classList.toggle('hide',!isHost);$('#lwait').classList.toggle('hide',isHost);
  $('#start').disabled=!V.length;
  $('#start').textContent=V.length<2?'▶ Zagraj solo (bez statystyk)':'▶ Zaczynamy grzybobranie! ('+V.length+')';
}

// ---------- UI ----------
const mushIcon=t=>`<svg><use href="#m${t}"/></svg>`;
function plRow(p,k,turn){return `<div class="pl ${turn?'turn':''}"><span class="dot" style="background:${pcol(p)}"></span><b>${esc(p.name)}${p.id===me?' (ty)':''}${k===0?' 👑':''}${p.gone?' 💤':''}</b><span class="cnt">${mushIcon('b')}${p.b}</span><span class="cnt">${mushIcon('r')}${p.r}</span></div>`}
function onState(){
  if(!S)return;
  if(S.gid!==lastGid){lastGid=S.gid;lastEv=0;lastRn=0;animGot=[];disp={};anim=false;clearInterval(stepT);$('#winbox').classList.add('hide')}
  show('game');$('#gcode').textContent=code;
  const cur=S.players[S.turn],playing=S.phase==='play';
  $('#gplayers').innerHTML=S.players.map((p,k)=>plRow(p,k,playing&&k===S.turn)).join('');
  const mine=playing&&cur&&cur.id===me;
  $('#status').textContent=!playing?'Koniec gry!':mine?(S.opts?'Wybierz żółte pole, na które idziesz 👆':'Twoja kolej! 🎲'):(S.opts?`${cur.name} wybiera drogę…`:`Rzuca: ${cur?cur.name:''}`);
  $('#roll').disabled=!mine||!!S.opts;$('#roll').style.opacity=(mine&&!S.opts)?1:.5;
  $('#log').innerHTML=(S.log||[]).map(l=>`<div>${esc(l)}</div>`).join('');
  if(S.rn!==lastRn){lastRn=S.rn;rollLock=0;drawDie(S.dice,true)}else drawDie(S.dice,false);
  if(S.ev&&S.ev.n!==lastEv){
    lastEv=S.ev.n;const ev=S.ev;animGot=(ev.got||[]).slice();disp={};disp[ev.pid]=ev.path[0];clearInterval(stepT);anim=true;let k=0;
    stepT=setInterval(()=>{k++;
      if(k<ev.path.length){disp[ev.pid]=ev.path[k];animGot=animGot.filter(g=>g.i!==ev.path[k]);drawBoard()}
      else{clearInterval(stepT);anim=false;disp={};animGot=[];drawBoard();if(S.phase==='end')showWin()}},260);
  }
  drawBoard();
  if(playing)$('#winbox').classList.add('hide');
  else{recStats();if(!anim)showWin()}
}
function drawDie(v,roll){
  const P={0:[],1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]}[v||0];
  const d=$('#die');d.innerHTML=Array.from({length:9},(_,i)=>`<i class="${P.includes(i)?'on':''}"></i>`).join('');
  d.classList.remove('roll');if(roll){void d.offsetWidth;d.classList.add('roll')}
}
function showWin(){
  if(!S||S.phase!=='end'||shownWin===S.gid)return;
  shownWin=S.gid;
  const W=S.winners||[],ws=S.players.filter(p=>W.includes(p.id)),solo=S.players.length<2;
  let title='Koniec gry',icon='🍂';
  if(ws.length>1){icon='🤝';title='Remis: '+ws.map(p=>esc(p.name)).join(', ')+'!'}
  else if(ws.length===1){icon='🏆';title=esc(ws[0].name)+(S.fin?' wygrywa!':' wygrywa walkowerem!')}
  const rows=S.players.map((p,i)=>({p,s:(S.final||[])[i]||0})).sort((a,b)=>b.s-a.s);
  $('#winbox').innerHTML=`<div class="card"><div style="font-size:60px">${icon}</div><h2 style="margin:0">${title}</h2>
  <div class="plist">${rows.map(x=>`<div class="pl"><span class="dot" style="background:${pcol(x.p)}"></span><b>${esc(x.p.name)}${x.p.id===me?' (ty)':''}</b><span class="cnt">${x.s} pkt</span></div>`).join('')}</div>
  <p class="muted" style="margin:0 0 10px">Punkty = borowiki − muchomory (+3 za dotarcie do mety)${solo?'<br>Gra solo – wynik nie wchodzi do statystyk.':''}</p>
  ${isHost?'<button id="again">🔁 Zagraj jeszcze raz</button>':'<div class="muted">Gospodarz może zacząć nową grę.</div>'}
  <button class="ghost" id="leave3">← wyjdź</button></div>`;
  $('#winbox').classList.remove('hide');
  const ag=$('#again');if(ag)ag.onclick=startGame;
  $('#leave3').onclick=leave;
  for(let i=0;i<24;i++){const e=document.createElement('div');e.className='fall';e.textContent=['🍄','🌲','🍂','🧺'][i%4];
    e.style.left=Math.random()*100+'vw';e.style.animationDuration=2.5+Math.random()*2.5+'s';e.style.animationDelay=Math.random()+'s';
    document.body.appendChild(e);setTimeout(()=>e.remove(),6500)}
}

// ---------- statystyki (każdy gracz zapisuje swój wynik przez most) ----------
function recStats(){
  if(!S||S.phase!=='end'||doneRec===S.gid)return;
  doneRec=S.gid;
  if(S.players.length<2||!S.players.some(p=>p.id===me))return;
  const W=S.winners||[];
  const r=W.includes(me)?(W.length>1?'d':'w'):'l';
  if(window.__grzStats)window.__grzStats(code,S.gid,S.players.map(p=>({uid:p.id,name:p.name})),r);
}

// ---------- nick i kolor z konta ----------
function initPrefs(){
  const n=window.__grzNick&&window.__grzNick(),c=window.__grzCol&&window.__grzCol();
  let sv=null;try{sv=JSON.parse(localStorage.getItem('grzyb_pref')||'null')}catch(e){}
  const nm=$('#name'),pc=$('#pcol');
  if(n){nm.value=cleanN(n);nm.readOnly=true;nm.title='Nick z Twojego konta'}
  else{nm.readOnly=false;nm.title='';if(sv&&sv.n&&!nm.value)nm.value=cleanN(sv.n)}
  if(c&&HEX.test(c)){pc.value=c.toLowerCase();pc.disabled=true;pc.title='Kolor z Twojego konta'}
  else{pc.disabled=false;pc.title='';if(sv&&HEX.test(sv.c||''))pc.value=sv.c}
  $('#net').textContent=!netOk()?'Pokoje online są niedostępne (brak połączenia z Firebase).':n?'Grasz jako '+cleanN(n)+' – wyniki trafią do Twoich statystyk.':'Zaloguj się na konto, aby nick i kolor pochodziły z konta, a wyniki liczyły się do statystyk.';
  setBusy(!!room);
}
const savePref=()=>{if(window.__grzNick&&window.__grzNick())return;try{localStorage.setItem('grzyb_pref',JSON.stringify({n:$('#name').value,c:$('#pcol').value}))}catch(e){}};
window.__grzRefresh=()=>{if(!room)initPrefs()};
window.__grzLeave=()=>{try{if(room)leave()}catch(e){}};

// ---------- podpięcie przycisków ----------
$('#create').onclick=()=>connect(true);
$('#join').onclick=()=>connect(false);
$('#code').addEventListener('input',e=>e.target.value=e.target.value.toUpperCase());
$('#code').addEventListener('keydown',e=>{if(e.key==='Enter')connect(false)});
$('#name').addEventListener('input',savePref);$('#pcol').addEventListener('input',savePref);
$('#start').onclick=startGame;
$('#roll').onclick=()=>{if(Date.now()<rollLock)return;rollLock=Date.now()+800;send('roll')};
$('#board').addEventListener('click',e=>{const g=e.target.closest('.opt');if(g)send('move:'+g.dataset.i)});
$('#leave1').onclick=leave;
$('#leave2').onclick=()=>{if(S&&S.phase==='play'&&S.players.length>1&&!confirm('Wyjść z gry? Stracisz możliwość zapisania wyniku.'))return;leave()};
$('#copy').onclick=()=>{try{navigator.clipboard.writeText(code)}catch(e){}$('#copy').textContent='✅ Skopiowano'};
initPrefs();drawBoard();drawDie(0);
</script>
