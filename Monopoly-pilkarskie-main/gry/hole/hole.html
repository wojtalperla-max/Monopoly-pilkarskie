<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Hole Arena</title>
<link rel="stylesheet" href="hole.css"></head><body>
<canvas id="c"></canvas><div id="hud"></div><div id="tm"></div><div id="rb"></div><button id="mb" title="Wycisz / włącz dźwięk (M)">🔊</button>
<div id="menu"><h1>HOLE ARENA</h1>
<div id="who"></div>
<input id="nick" placeholder="Twój nick" maxlength="14" autocomplete="off">
<div id="cols" aria-label="Kolor dziury"></div>
<button id="solo">Graj z botami</button>
<div class="row"><span>Boty w pokoju:</span><select id="nb"><option>0</option><option>1</option><option selected>2</option><option>3</option><option>4</option></select></div>
<button id="host">Stwórz pokój (multiplayer)</button>
<div class="row"><input id="code" placeholder="KOD" maxlength="4" autocomplete="off"><button id="join">Dołącz</button></div>
<div id="mm"></div>
<small>Pochłaniaj obiekty mniejsze od dziury. Większe dziury zjadają mniejsze! Runda trwa 3 minuty, wygrywa najwyższy wynik. Klawisz M wycisza dźwięk.</small></div>
<script>
/* ===== most do index.html (Firebase: pokoje online, nick i kolor z konta, statystyki) ===== */
var P=window.parent,B=null;
try{B=P&&P!==window&&P.holeBridge&&P.holeBridge()}catch(e){B=null}
const NET=!!(B&&B.net&&B.net());
/* ===== dane gry ===== */
let WD=2400;const W=6000,C=3000,N=4000,$=i=>document.getElementById(i),cv=$('c'),g=cv.getContext('2d');
const rng=s=>()=>(s=s*16807%2147483647)/2147483647,R=rng(1234),items=[];
for(let i=0;i<N;i++){const q=R();items.push({x:R()*W,y:R()*W,s:5+q*q*q*85|0,h:R()*360|0,dead:0})}
let isHost=false,myId=null,code='',holes={},vw={},inp={x:0,y:0},cam={x:C,y:C},running=false,gone=false,nick='Gracz',myCol='#ef476f',botsN=2;
let roomRef=null,hostUid=null,statG='';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const HEX=/^#[0-9a-f]{6}$/i,cleanN=v=>String(v||'').replace(/[\u0000-\u001f\u200b-\u200f\u2028-\u202f<>&]/g,'').trim().slice(0,14);
const PAL=['#ef476f','#06d6a0','#ffb703','#4cc9f0','#a77bff','#ff8a3d','#ff5fa2','#9be15d'];
const rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)),close=(a,b)=>{const x=rgb(a),y=rgb(b);return Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2])<70};
function pickCol(want,used){const c=HEX.test(want||'')?String(want).toLowerCase():'';if(c&&!used.some(u=>close(u,c)))return c;for(const p of PAL)if(!used.some(u=>close(u,p)))return p;return PAL[used.length%PAL.length]}
function mk(id,name,bot,col){const h={id,name,bot,a:576,r:24,sc:0,ix:0,iy:0,tt:0,c:col,since:Date.now(),w:0};spawn(h);return h}
function spawn(h){h.x=C-WD/2+200+Math.random()*(WD-400);h.y=C-WD/2+200+Math.random()*(WD-400);h.a=576;h.r=24;h.sc=0}
/* ===== SYMULACJA (host) ===== */
function step(dt){
 const t=Date.now(),H=Object.values(holes);
 if(!RD.end){RD.end=t+ROUND;RD.start=t;RD.gid=t.toString(36)}
 if(RD.st===1){if(t>RD.until){WD=2400;H.forEach(spawn);items.forEach(i=>i.dead=0);RD.st=0;RD.end=t+ROUND;RD.start=t;RD.gid=t.toString(36);RD.rp=[]}return}
 if(t>=RD.end){let b=null;for(const h of H)if(!b||h.sc>b.sc)b=h;
  if(b){b.w=(b.w||0)+1;RD.wn=b.name;RD.wid=b.id}
  RD.rp=H.filter(h=>!h.bot&&h.uid&&t-Math.max(h.since,RD.start)>=30000).map(h=>h.id);
  RD.st=1;RD.until=t+7000;return}
 WD=Math.min(W,Math.max(WD,2400+(Math.max(...H.map(h=>h.r))-24)*10));
 for(const h of H){
  if(h.bot&&t>h.tt){h.tt=t+400;let b=null,bd=1e9,fx=0,fy=0,fl=0;
   for(const o of H)if(o!==h&&o.r>h.r*1.2){const dx=h.x-o.x,dy=h.y-o.y,d=Math.hypot(dx,dy);if(d<h.r*8){fx+=dx/d;fy+=dy/d;fl=1}}
   for(const it of items){if(it.dead||!act(it)||it.s>=h.r*.7)continue;const d=(it.x-h.x)**2+(it.y-h.y)**2;if(d<bd){bd=d;b=it}}
   let dx=b?b.x-h.x:C-h.x,dy=b?b.y-h.y:C-h.y,m=Math.hypot(dx,dy)||1;h.ix=dx/m;h.iy=dy/m;
   if(fl){const m2=Math.hypot(fx,fy)||1;h.ix=fx/m2;h.iy=fy/m2}}
  const sp=300*(h.bot?.5:1)*Math.pow(24/h.r,.3)*dt;h.x=clamp(h.x+h.ix*sp,C-WD/2,C+WD/2);h.y=clamp(h.y+h.iy*sp,C-WD/2,C+WD/2);
  for(let i=0;i<items.length;i++){const it=items[i];if(it.dead||!act(it)||it.s>=h.r*.7)continue;
   const dx=it.x-h.x,dy=it.y-h.y;if(dx*dx+dy*dy<h.r*h.r*.8){it.dead=t;h.a+=it.s*it.s*.5;h.sc+=it.s}}
  h.r=Math.sqrt(h.a)}
 for(const a of H)for(const b of H)if(a!==b&&a.r>b.r*1.2&&(a.x-b.x)**2+(a.y-b.y)**2<(a.r*.7)**2){a.a+=b.a*.5;a.sc+=100+(b.sc>>1);spawn(b)}
 items.forEach(it=>{if(it.dead&&t-it.dead>25000){it.dead=0}});
}
/* ===== SIEĆ (Firebase Realtime Database) =====
   Pokój: tttRooms/holearena-<kod>/peers/<uid>/p
     host:  {h:1,n,c,s:<JSON stanu gry>}        klient: {n,c,i:"x,y"}  */
function snap(){const H=Object.values(holes);
 return{h:H.map(h=>[h.id,h.x|0,h.y|0,+h.r.toFixed(1),h.sc,h.name,h.c,h.w||0]),d:pk(),rt:Math.max(0,RD.end-Date.now()),st:RD.st,wn:RD.wn,wid:RD.wid,wd:Math.round(WD),g:RD.gid,rp:RD.st===1?(RD.rp||[]):0}}
function applyState(d){const now=performance.now(),n={};
 d.h.forEach(a=>{const o=holes[a[0]],q={id:a[0],x:a[1],y:a[2],r:a[3],sc:a[4],name:String(a[5]),c:HEX.test(a[6])?a[6]:'#888888',w:a[7],vx:0,vy:0,t:now};
  if(o&&o.t&&now-o.t<700&&Math.hypot(q.x-o.x,q.y-o.y)<q.r*4){const dt=Math.max(.05,(now-o.t)/1000);q.vx=(q.x-o.x)/dt;q.vy=(q.y-o.y)/dt}
  n[a[0]]=q});
 holes=n;upk(d.d);WD=d.wd||WD;rd={rt:d.rt,st:d.st,wn:d.wn,wid:d.wid,at:now};RD.gid=d.g;RD.rp=d.rp||[]}
function fail(msg){$('mm').textContent=msg;isHost=false;holes={};roomRef=null;code='';['solo','host','join'].forEach(i=>$(i).disabled=false);if(!NET)$('host').disabled=$('join').disabled=true}
function onPeerHost(s){const k=s.key,p=(s.val()||{}).p||{};if(k===myId)return;
 let h=holes[k];
 if(!h){if(Object.values(holes).filter(x=>!x.bot).length>=10)return;
  const hum=Object.values(holes).filter(x=>!x.bot).map(x=>x.c),col=pickCol(p.c,hum);
  Object.values(holes).forEach(b=>{if(b.bot&&close(b.c,col))b.c=pickCol('',Object.values(holes).map(x=>x.c).concat([col]))});
  h=mk(k,cleanN(p.n)||'Gracz',false,col);h.uid=k;holes[k]=h}
 if(typeof p.i==='string'){const a=p.i.split(','),x=+a[0],y=+a[1];if(isFinite(x)&&isFinite(y)){const m=Math.hypot(x,y),f=m>1?1/m:1;h.ix=x*f;h.iy=y*f}}}
function onPeerClient(s){if(s.key!==hostUid)return;const p=(s.val()||{}).p;if(p&&p.s){try{applyState(JSON.parse(p.s))}catch(e){}}}
function hostGone(){if(gone)return;gone=true;const e=$('rb');e.style.display='flex';e.textContent='Host zakończył grę';setTimeout(()=>location.reload(),2500)}
async function startHost(net){
 isHost=true;
 ['solo','host','join'].forEach(i=>$(i).disabled=true);$('mm').textContent='';
 if(net){try{myId=await B.auth()}catch(e){return fail('Brak połączenia z serwerem')}}else myId='host';
 holes[myId]=mk(myId,nick,false,pickCol(myCol,[]));if(net)holes[myId].uid=myId;
 const nb=net?botsN:4;
 for(let i=1;i<=nb;i++)holes['bot'+i]=mk('bot'+i,'Bot '+i,true,pickCol('',Object.values(holes).map(x=>x.c)));
 if(!net){begin();return}
 try{
  for(let t=0;t<8&&!roomRef;t++){const c=rnd(),r=B.db.ref('tttRooms/holearena-'+c.toLowerCase()),s=await r.child('peers').once('value');if(!s.exists()){code=c;roomRef=r}}
  if(!roomRef)return fail('Nie udało się utworzyć pokoju, spróbuj ponownie');
  const me=roomRef.child('peers/'+myId);
  await me.set({t:B.ts,p:{h:1,n:nick,c:holes[myId].c}});
  try{me.onDisconnect().remove()}catch(e){}
  const pr=roomRef.child('peers');
  pr.on('child_added',onPeerHost);pr.on('child_changed',onPeerHost);
  pr.on('child_removed',s=>{if(s.key!==myId&&holes[s.key]&&!holes[s.key].bot){delete holes[s.key];delete vw[s.key]}});
 }catch(e){return fail('Błąd sieci: '+((e&&e.message)||e))}
 begin()}
async function startClient(c){
 code=String(c).toUpperCase().replace(/[^A-Z]/g,'');
 ['solo','host','join'].forEach(i=>$(i).disabled=true);$('mm').textContent='';
 try{
  myId=await B.auth();
  roomRef=B.db.ref('tttRooms/holearena-'+code.toLowerCase());
  const v=(await roomRef.child('peers').once('value')).val()||{};
  hostUid=Object.keys(v).find(k=>v[k]&&v[k].p&&v[k].p.h);
  if(!hostUid)return fail('Nie znaleziono pokoju '+code);
  const me=roomRef.child('peers/'+myId);
  await me.set({t:B.ts,p:{n:nick,c:myCol}});
  try{me.onDisconnect().remove()}catch(e){}
  const pr=roomRef.child('peers');
  pr.on('child_added',onPeerClient);pr.on('child_changed',onPeerClient);
  pr.on('child_removed',s=>{if(s.key===hostUid)hostGone()});
 }catch(e){return fail('Błąd sieci: '+((e&&e.message)||e))}
 begin()}
const rnd=()=>Array.from({length:4},()=>'ABCDEFGHJKLMNPRSTUWXYZ'[Math.random()*22|0]).join('');
let tk=0,last=0,sentI='',sentT=0,leaving=false;
function loop(){
 if(leaving)return;
 const now=performance.now(),dt=Math.min(.1,Math.max(.01,(now-last)/1000));last=now;
 if(isHost){const me=holes[myId];if(me){me.ix=inp.x;me.iy=inp.y}
  step(dt);rd={rt:Math.max(0,RD.end-Date.now()),st:RD.st,wn:RD.wn,wid:RD.wid,at:performance.now()};
  if(roomRef&&++tk%6===0)roomRef.child('peers/'+myId+'/p/s').set(JSON.stringify(snap())).catch(()=>{})}
 else if(roomRef){++tk;const s=inp.x.toFixed(2)+','+inp.y.toFixed(2),n=Date.now();
  if(tk%3===0&&(s!==sentI||n-sentT>2000)){sentI=s;sentT=n;roomRef.child('peers/'+myId+'/p/i').set(s).catch(()=>{})}}}
function begin(){if(running)return;running=true;$('menu').style.display='none';last=performance.now();
 setInterval(loop,33);setInterval(()=>{hud();rbar();recStats()},250);requestAnimationFrame(draw)}
/* statystyki: wynik rundy zapisuje się na koncie (min. 2 graczy w pokoju, każdy obecny co najmniej 30 s rundy) */
function recStats(){
 if(!NET||!code||rd.st!==1||!RD.gid||statG===RD.gid)return;statG=RD.gid;
 const rp=RD.rp||[];if(rp.length<2||rp.indexOf(myId)<0)return;
 const pl=rp.map(id=>holes[id]).filter(Boolean).map(h=>({uid:h.id,name:h.name}));
 if(pl.length<2)return;
 try{B.stats(code,RD.gid,pl,rd.wid===myId?'w':'l')}catch(e){}}
/* ===== STEROWANIE ===== */
addEventListener('pointermove',e=>{const dx=e.clientX-innerWidth/2,dy=e.clientY-innerHeight/2,m=Math.hypot(dx,dy)||1,k=Math.min(1,m/100);inp={x:dx/m*k,y:dy/m*k}});
addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('button'))return;dispatchEvent(new PointerEvent('pointermove',e))});
const keys={};addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;keys[e.key.toLowerCase()]=1;kb()});addEventListener('keyup',e=>{delete keys[e.key.toLowerCase()];kb()});
let kd=false;function kb(){const x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),y=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),m=Math.hypot(x,y);if(m)inp={x:x/m,y:y/m};else if(kd)inp={x:0,y:0};kd=!!m}
/* ===== INTERFEJS ===== */
function rbar(){if(gone)return;const l=Math.max(0,rd.rt-(performance.now()-rd.at))/1000|0,e=$('rb'),me=holes[myId];
 $('tm').textContent='⏱ '+(l/60|0)+':'+String(l%60).padStart(2,'0')+'  ·  Twoje wygrane: '+((me&&me.w)||0);
 if(rd.st===1){e.style.display='flex';e.textContent='🏆 '+rd.wn+' wygrywa rundę! Nowa runda za chwilę…'}else e.style.display='none'}
function hud(){const H=Object.values(holes).sort((a,b)=>b.sc-a.sc),me=holes[myId];if(!me)return;
 const nh=H.filter(h=>!String(h.id).startsWith('bot')).length;
 $('hud').innerHTML=`<div>Wynik: ${me.sc}<br>Rozmiar: ${me.r|0}<br>${code?'Pokój: <b>'+esc(code)+'</b><button id="cp">Kopiuj</button><br>Graczy: '+nh:'Tryb solo'}</div><div id="lb">${H.slice(0,5).map((h,i)=>`${i+1}. <i style="background:${h.c}"></i>${esc(h.name)} — ${h.sc}${h.w?' 🏆'+h.w:''}`).join('<br>')}</div>`}
$('hud').addEventListener('click',e=>{if(e.target.id==='cp'){try{navigator.clipboard.writeText(code);e.target.textContent='Skopiowano'}catch(x){}}});
/* ===== DŹWIĘK ===== */
const music=new Audio();try{if(B&&B.music)music.src=B.music()}catch(e){}
music.loop=true;music.volume=.12;let muted=false,AC=null,lastS=0;
function snd(s){if(muted)return;try{AC=AC||new AudioContext();const t=AC.currentTime,o=AC.createOscillator(),gn=AC.createGain(),f=520-Math.min(s,80)*3+Math.random()*50;o.type='triangle';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.8,t+.08);gn.gain.setValueAtTime(.18,t);gn.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(gn).connect(AC.destination);o.start(t);o.stop(t+.15)}catch(e){}}
function mus(){if(!muted&&music.src)music.play().catch(()=>{})}
addEventListener('pointerdown',mus);function tm(){muted=!muted;if(muted)music.pause();else mus();$('mb').textContent=muted?'🔇':'🔊'}
$('mb').onpointerdown=e=>e.stopPropagation();$('mb').onclick=tm;
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;if(e.key.toLowerCase()==='m')tm()});
/* ===== PAKOWANIE STANU PRZEDMIOTÓW ===== */
const B64='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
function act(it){return Math.abs(it.x-C)<WD/2&&Math.abs(it.y-C)<WD/2}
function pk(){let s='';for(let i=0;i<items.length;i+=6){let v=0;for(let j=0;j<6;j++)v=v*2+(items[i+j]&&items[i+j].dead?1:0);s+=B64[v]}return s}
function upk(s){for(let i=0;i<items.length;i++){const v=B64.indexOf(s[i/6|0]);items[i].dead=(v>>(5-i%6))&1}}
let WV=2400;const ROUND=180000,RD={st:0,end:0,until:0,start:0,gid:'',rp:[],wn:'',wid:''};let rd={rt:0,st:0,wn:'',wid:'',at:0};
const fx=[];let pd=null,pdT=0;
/* ===== RENDER ===== */
function draw(){
 const dpr=devicePixelRatio||1,w=Math.round(innerWidth*dpr),h=Math.round(innerHeight*dpr);
 if(cv.width!==w)cv.width=w;if(cv.height!==h)cv.height=h;
 const nowT=performance.now();
 for(const k in vw)if(!holes[k])delete vw[k];
 for(const o of Object.values(holes)){const v=vw[o.id]||(vw[o.id]={x:o.x,y:o.y,r:o.r});
  const e=o.t?Math.min(.25,(nowT-o.t)/1000):0,tx=o.x+(o.vx||0)*e,ty=o.y+(o.vy||0)*e;
  v.x+=(tx-v.x)*(o.t?.25:.35);v.y+=(ty-v.y)*(o.t?.25:.35);v.r+=(o.r-v.r)*.2}
 if(!pd){pd=items.map(i=>i.dead?1:0);pdT=nowT}
 else items.forEach((it,i)=>{const d=it.dead?1:0;if(d&&!pd[i]&&nowT-pdT>1500&&fx.length<80){let b=null,bd=1e12;for(const o of Object.values(vw)){const q=(o.x-it.x)**2+(o.y-it.y)**2;if(q<bd){bd=q;b=o}}if(b){fx.push({x:it.x,y:it.y,s:it.s,h:it.h,t:nowT,o:b});if(b===vw[myId]&&nowT-lastS>45){lastS=nowT;snd(it.s)}}}pd[i]=d});
 const me=vw[myId]||{x:C,y:C,r:24},z=Math.min(w,h)/Math.max(900*(WV+=(WD-WV)*.05)/2400,me.r*5);

 g.setTransform(1,0,0,1,0,0);g.fillStyle='#9fb0c4';g.fillRect(0,0,w,h);
 g.translate(w/2,h/2);g.scale(z,z);g.translate(-cam.x,-cam.y);
 const hw=w/2/z+100,hh=h/2/z+100,x0=cam.x-hw,x1=cam.x+hw,y0=cam.y-hh,y1=cam.y+hh;
 const L=C-WD/2;g.fillStyle='#e8eef5';g.fillRect(L,L,WD,WD);
 g.strokeStyle='#c3cdd9';g.lineWidth=26;g.beginPath();
 for(let p=L;p<=L+WD;p+=300){g.moveTo(p,L);g.lineTo(p,L+WD);g.moveTo(L,p);g.lineTo(L+WD,p)}g.stroke();
 g.strokeStyle='#e53935';g.lineWidth=10;g.strokeRect(L,L,WD,WD);
 for(const it of items){if(it.dead||!act(it)||it.x<x0||it.x>x1||it.y<y0||it.y>y1)continue;
  const s=it.s;g.fillStyle='#0003';g.fillRect(it.x-s+s*.25,it.y-s+s*.25,s*2,s*2);
  g.fillStyle=`hsl(${it.h},55%,58%)`;g.fillRect(it.x-s,it.y-s,s*2,s*2);
  g.fillStyle=`hsl(${it.h},45%,72%)`;g.fillRect(it.x-s*.7,it.y-s*.7,s*1.4,s*1.4)}
 for(const o of Object.values(holes).sort((a,b)=>a.r-b.r)){const v=vw[o.id];
  g.fillStyle=o.c;g.beginPath();g.arc(v.x,v.y,v.r+v.r*.14,0,7);g.fill();
  const gr=g.createRadialGradient(v.x,v.y,0,v.x,v.y,v.r);gr.addColorStop(0,'#000');gr.addColorStop(1,'#1c1c1c');
  g.fillStyle=gr;g.beginPath();g.arc(v.x,v.y,v.r,0,7);g.fill();
  g.fillStyle='#fff';g.strokeStyle='#0008';g.lineWidth=Math.max(2,v.r*.06);g.font=`bold ${Math.max(14,v.r*.4)}px system-ui`;g.textAlign='center';
  g.strokeText(o.name,v.x,v.y-v.r*1.35);g.fillText(o.name,v.x,v.y-v.r*1.35)}
 for(let k=fx.length-1;k>=0;k--){const f=fx[k],p=(nowT-f.t)/380;if(p>=1){fx.splice(k,1);continue}
  const e=p*p,x=f.x+(f.o.x-f.x)*e,y=f.y+(f.o.y-f.y)*e,s=f.s*(1-p*.9);
  g.save();g.translate(x,y);g.rotate(p*2.2);g.globalAlpha=1-p*.4;
  g.fillStyle=`hsl(${f.h},55%,${58-p*40}%)`;g.fillRect(-s,-s,s*2,s*2);
  g.fillStyle=`hsl(${f.h},45%,${72-p*50}%)`;g.fillRect(-s*.7,-s*.7,s*1.4,s*1.4);g.restore()}
 g.setTransform(1,0,0,1,0,0);
 for(const o of Object.values(holes)){if(o.id===myId)continue;const v=vw[o.id];if(!v)continue;
  const sx=(v.x-cam.x)*z+w/2,sy=(v.y-cam.y)*z+h/2,m=50*dpr;
  if(sx>-v.r*z&&sx<w+v.r*z&&sy>-v.r*z&&sy<h+v.r*z)continue;
  const dx=sx-w/2,dy=sy-h/2,k=Math.min((w/2-m)/Math.abs(dx||1e-9),(h/2-m)/Math.abs(dy||1e-9)),sz=16*dpr;
  g.save();g.translate(w/2+dx*k,h/2+dy*k);g.rotate(Math.atan2(dy,dx));
  g.fillStyle=o.c;g.strokeStyle=v.r>me.r*1.2?'#e53935':(v.r*1.2<me.r?'#43a047':'#fff');g.lineWidth=3*dpr;
  g.beginPath();g.moveTo(sz,0);g.lineTo(-sz*.7,-sz*.8);g.lineTo(-sz*.4,0);g.lineTo(-sz*.7,sz*.8);g.closePath();g.fill();g.stroke();g.restore()}
 requestAnimationFrame(draw)}
