<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Krzyżówka</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lora:wght@400;600&display=swap">
<style>

:root{--bg:#efe4cc;--paper:#fffdf5;--ink:#2a2118;--block:#2f5a4e;--accent:#b4472b;--line:#cdbf9f;--muted:#7a6c55;--card:#f9f1de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1812;--paper:#2b261d;--ink:#f2e8d2;--block:#17302a;--accent:#e57a56;--line:#4b4333;--muted:#aa9c82;--card:#241f17}}
:root[data-theme="dark"]{--bg:#1b1812;--paper:#2b261d;--ink:#f2e8d2;--block:#17302a;--accent:#e57a56;--line:#4b4333;--muted:#aa9c82;--card:#241f17}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Lora,Georgia,serif;min-height:100vh;
background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
h1,h2,.num,.big{font-family:"Playfair Display",Georgia,serif}
.hide{display:none!important}
#lobby{max-width:520px;margin:0 auto;padding:48px 20px;text-align:center}
.tiles{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.tiles span{width:42px;height:48px;display:grid;place-items:center;background:var(--paper);border:2px solid var(--ink);font:900 26px "Playfair Display",serif;box-shadow:3px 3px 0 var(--block);border-radius:3px}
.tiles span:nth-child(odd){transform:rotate(-3deg)}.tiles span:nth-child(even){transform:rotate(2.5deg);color:var(--accent)}
.sub{color:var(--muted);margin:6px 0 26px;font-size:17px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:20px;box-shadow:5px 5px 0 var(--block);text-align:left;margin-bottom:18px}
label{display:block;font-weight:600;margin-bottom:6px;font-size:14px;color:var(--muted)}
input.t{width:100%;padding:12px 14px;font:600 18px Lora,serif;border:2px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);margin-bottom:14px}
input.t:focus{outline:none;border-color:var(--accent)}
#code{letter-spacing:.35em;text-transform:uppercase;text-align:center;font-weight:700}
button{font:700 16px Lora,serif;cursor:pointer;border:2px solid var(--ink);background:var(--accent);color:#fff;border-radius:8px;padding:12px 18px;box-shadow:3px 3px 0 var(--ink);transition:transform .08s}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
button.alt{background:var(--paper);color:var(--ink)}button.wide{width:100%}
.or{text-align:center;color:var(--muted);margin:2px 0 14px}
#err{color:var(--accent);font-weight:600;min-height:22px;text-align:center}
#game{padding:14px;max-width:1500px;margin:0 auto}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.top h2{margin:0;font-size:26px;flex:1}
.pill{background:var(--paper);border:2px solid var(--ink);border-radius:30px;padding:6px 14px;font-weight:700;letter-spacing:.2em;cursor:pointer}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
@media(max-width:980px){.layout{grid-template-columns:1fr}}
.boardwrap{background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:14px;box-shadow:5px 5px 0 var(--block)}
#cur{background:var(--paper);border:2px solid var(--line);border-left:6px solid var(--accent);border-radius:6px;padding:10px 14px;margin-bottom:12px;min-height:56px;font-size:18px}
#cur b{color:var(--accent)}
#scroll{overflow:auto;max-height:78vh;padding:4px}
#board{display:grid;width:max-content;margin:0 auto;border:2px solid var(--ink);background:var(--ink);gap:1px;--cs:clamp(32px,3.3vw,46px)}
.c,.b{width:var(--cs);height:var(--cs)}
.b{background:var(--block);background-image:repeating-linear-gradient(45deg,transparent 0 5px,rgba(255,255,255,.07) 5px 6px)}
.c{background:var(--paper);position:relative;display:grid;place-items:center;font:700 calc(var(--cs)*.58) "Playfair Display",serif;cursor:pointer;user-select:none;text-transform:uppercase}
.c .n{position:absolute;top:1px;left:3px;font:700 calc(var(--cs)*.26) Lora,serif;color:var(--muted)}
.c.act{background:#ffe9a8;color:#2a2118}.c.sel{background:#ffc94d;color:#2a2118;outline:3px solid var(--accent);outline-offset:-3px;z-index:1}
.c.done .n{color:inherit;opacity:.7}.c.bad{animation:sh .45s;background:#f6b3a2!important}
@keyframes sh{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.side{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:14px;box-shadow:4px 4px 0 var(--block)}
.panel h3{margin:0 0 8px;font:700 18px "Playfair Display",serif;border-bottom:2px solid var(--line);padding-bottom:5px}
.pl{display:flex;align-items:center;gap:10px;padding:6px 0;font-weight:600}
.pl i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);flex:none}.pl span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl em{font-style:normal;font-family:"Playfair Display",serif;font-size:20px}
.clues{max-height:34vh;overflow:auto}
.clues div{padding:5px 6px;border-radius:5px;cursor:pointer;font-size:15px;line-height:1.3}
.clues div:hover{background:var(--paper)}.clues div.on{background:#ffe9a8;color:#2a2118}.clues div.ok{opacity:.5;text-decoration:line-through}
.clues b{display:inline-block;min-width:24px;color:var(--accent)}
#win{background:var(--accent);color:#fff;border-radius:10px;padding:14px;text-align:center;font:700 22px "Playfair Display",serif;margin-bottom:12px}
#kb{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0}

.pick{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px}.pick .t{flex:1;min-width:0}
.pick input[type=color]{width:56px;height:50px;padding:0;border:2px solid var(--line);border-radius:8px;background:var(--paper);cursor:pointer;flex:none}
.pick input[type=color]:disabled{opacity:.7;cursor:default}
.lobinfo{font-size:13px;color:var(--muted);margin:12px 0 0;line-height:1.35}
button.sm{padding:6px 12px;font-size:14px}
button:disabled{opacity:.5;cursor:default}
.pl.gone{opacity:.55}.pl.me span{font-weight:800}
.pl em small{font:600 11px Lora,serif;color:var(--muted);margin-left:2px}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:24px;font-weight:600;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#feed{font-size:14px;color:var(--muted);min-height:18px;margin-top:8px}
@media(max-width:600px){#lobby{padding:24px 14px}.tiles span{width:34px;height:40px;font-size:21px}}

</style></head><body>
<input id="kb" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false">
<section id="lobby">
 <div class="tiles"><span>K</span><span>R</span><span>Z</span><span>Y</span><span>Ż</span><span>Ó</span><span>W</span><span>K</span><span>A</span></div>
 <p class="sub">Krzyżówka jak u babci – rozwiązujcie razem, kto zgadnie więcej haseł</p>
 <div class="card">
  <label for="nick">Twój nick i kolor</label>
  <div class="pick"><input class="t" id="nick" maxlength="14" placeholder="Twój nick…" autocomplete="off"><input type="color" id="col" aria-label="Twój kolor"></div>
  <button class="wide alt" id="bSolo">Graj solo</button>
  <div class="or">— albo w pokoju —</div>
  <button class="wide" id="bMk">✎ Załóż nowy pokój</button>
  <div class="or">— albo —</div>
  <label for="code">Kod pokoju</label>
  <input class="t" id="code" maxlength="5" placeholder="•••••">
  <button class="wide alt" id="bJn">Dołącz do pokoju</button>
  <p class="lobinfo" id="lobinfo"></p>
 </div>
 <div id="err"></div>
</section>
<section id="game" class="hide">
 <div class="top"><h2>Krzyżówka</h2><span id="roomLbl" style="color:var(--muted)">Kod pokoju:</span><span class="pill" id="room" title="Kliknij, aby skopiować"></span><button class="alt sm" id="bNew">Nowa krzyżówka</button><button class="alt sm" id="bLeave">Wyjdź</button></div>
 <div id="win" class="hide"></div>
 <div class="layout">
  <div class="boardwrap"><div id="cur"></div><div id="scroll"><div id="board"></div></div></div>
  <div class="side">
   <div class="panel"><h3>Gracze</h3><div id="pls"></div></div>
   <div class="panel"><h3>Poziomo →</h3><div class="clues" id="ch"></div></div>
   <div class="panel"><h3>Pionowo ↓</h3><div class="clues" id="cv"></div></div>
  </div>
 </div>
</section>
<script>
/* most do hosta (index.html): pokoje online przez Firebase + nick + kolor + statystyki */
(function(){
var P=window.parent;
function G(){try{return P&&P!==window&&P.krzyzowkaBridge?P.krzyzowkaBridge():null}catch(e){return null}}
window.__krNick=function(){try{var b=G();return b&&b.nick()||''}catch(e){return''}};
window.__krCol=function(){try{var b=G();return b&&b.col()||''}catch(e){return''}};
window.__krStats=function(code,gid,players,r){try{var b=G();if(b)b.stats(code,gid,players,r)}catch(e){}};
window.__krNet=function(){try{var b=G();return !!(b&&b.net())}catch(e){return false}};
window.__krJoin=async function(name){
  var B=G();
  if(!B||!B.net())throw new Error('Brak połączenia z Firebase');
  var uid=await B.auth();
  var path='tttRooms/'+String(name).toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,40);
  var ref=B.db.ref(path),pr=ref.child('peers'),ms=ref.child('msgs');
  var cache={},pc=[],rc=[],h={},gone=false,first=true,firstC=true;
  var startKey=ms.push().key;
  await pr.child(uid).set({t:B.ts});
  try{pr.child(uid).onDisconnect().remove()}catch(e){}
  function fire(c){pc.forEach(function(f){try{f(c)}catch(e){console.error(e)}})}
  var onVal=pr.on('value',function(s){
    var v=s.val()||{},joined=[],left=[],changed=[];
    Object.keys(v).forEach(function(k){var p=v[k]&&v[k].p||{};
      if(!cache[k]&&!first&&k!==uid)joined.push({peer:k});
      else if(cache[k]&&k!==uid&&JSON.stringify(cache[k])!==JSON.stringify(p))changed.push({peer:k});
      cache[k]=p});
    Object.keys(cache).forEach(function(k){if(!v[k]){delete cache[k];if(k!==uid)left.push({peer:k})}});
    first=false;fire({joined:joined,left:left,changed:changed});
  });
  var cref=B.db.ref('.info/connected');
  var onConn=cref.on('value',function(s){
    if(s.val()!==true)return;
    if(firstC){firstC=false;return}
    if(gone)return;
    try{pr.child(uid).set({t:B.ts,p:cache[uid]||{}});pr.child(uid).onDisconnect().remove()}catch(e){}
    rc.forEach(function(f){try{f()}catch(e){console.error(e)}});
  });
  await pr.once('value').then(function(s){var v=s.val()||{};Object.keys(v).forEach(function(k){cache[k]=v[k]&&v[k].p||{}})});
  var q=ms.orderByKey().startAt(startKey);
  var onMsg=q.on('child_added',function(s){var v=s.val();if(!v||!v.t)return;var fs=h[v.t];if(!fs)return;
    var m={peer:v.peer,isMe:v.peer===uid,ts:+v.ts||Date.now(),data:v.data===undefined?null:v.data};
    fs.slice().forEach(function(f){try{f(m)}catch(e){console.error(e)}})});
  return{
    uid:uid,
    peers:function(){return Object.keys(cache).map(function(k){return{peer:k,isMe:k===uid,presence:cache[k]||{}}})},
    presence:function(o){cache[uid]=o;return pr.child(uid).set({t:B.ts,p:o})},
    on:function(t,f){(h[t]=h[t]||[]).push(f);return function(){h[t]=(h[t]||[]).filter(function(x){return x!==f})}},
    onPeers:function(f){pc.push(f);return function(){pc=pc.filter(function(x){return x!==f})}},
    onReconnect:function(f){rc.push(f)},
    emit:function(t,d){if(gone)return Promise.resolve();var r=ms.push();var p=r.set({t:t,peer:uid,data:d===undefined?null:d,ts:B.ts});setTimeout(function(){r.remove().catch(function(){})},20000);return p},
    leave:function(){if(gone)return Promise.resolve();gone=true;try{pr.off('value',onVal);q.off('child_added',onMsg);cref.off('value',onConn)}catch(e){}
      try{pr.child(uid).onDisconnect().cancel()}catch(e){}
      return pr.child(uid).remove().then(function(){return pr.once('value')}).then(function(s){if(!s.val())return ref.remove()}).catch(function(){})}
  };
};
})();
</script>
<script>
const WL=`KRAKOW|Dawna stolica Polski;WISLA|Najdłuższa polska rzeka;TATRY|Najwyższe polskie góry;BALTYK|Morze na północy Polski;KOT|Mruczy na kolanach babci;PIES|Najlepszy przyjaciel człowieka;SERNIK|Ciasto z twarogu;PIEROGI|Ruskie lub z mięsem;BARSZCZ|Czerwona zupa wigilijna;CHOINKA|Stoi w salonie w grudniu;KONWALIA|Biały kwiat o dzwonkach;SLONCE|Świeci w dzień;KSIEZYC|Towarzyszy Ziemi;JABLKO|Owoc z Newtona;GRUSZKA|Owoc jak żarówka;MALINA|Sok na przeziębienie;ROWER|Dwa kółka i pedały;POCIAG|Jedzie po torach;SAMOLOT|Lata z lotniska;OKRET|Pływa po morzu;KSIAZKA|Czyta się ją wieczorem;LAMPA|Daje światło;FOTEL|Wygodne siedzisko babci;KOCYK|Otula nogi zimą;SZALIK|Na szyję w mrozie;CZAPKA|Chroni głowę przed zimnem;ZEGAR|Wskazuje godzinę;OKNO|Widać przez nie podwórko;DRZWI|Wchodzi się przez nie;MASLO|Smaruje się nim chleb;CHLEB|Powszedni na stole;MLEKO|Białe, od krowy;HERBATA|Napar z cytryną;KAWA|Poranna czarna;ROSOL|Niedzielna zupa z kury;KOTLET|Schabowy na obiad;PACZEK|Tłusty czwartek;MAKOWIEC|Rolada z makiem;WIOSNA|Pora po zimie;LATO|Pora wakacji;JESIEN|Liście spadają;ZIMA|Śnieg i mróz;DESZCZ|Pada z chmur;TECZA|Kolorowy łuk na niebie;BOCIAN|Ptak z gniazdem na dachu;SOWA|Nocny ptak;ORZEL|Godło Polski;LAS|Pełen grzybów;GRZYB|Prawdziwek lub kurka;JEZIORO|Woda otoczona lądem;MOST|Łączy brzegi rzeki;WARSZAWA|Stolica Polski;GDANSK|Miasto Solidarności;POZNAN|Koziołki na ratuszu;WROCLAW|Miasto krasnali;KARPACZ|Miasto pod Śnieżką;SNIEZKA|Szczyt Karkonoszy;KARKONOSZE|Góry ze Śnieżką;ZAMEK|Mieszkał w nim król;KROL|Nosi koronę;SZACHY|Gra z hetmanem;KARTY|Talia do gry;TANGO|Taniec argentyński;RADIO|Gra w kuchni;TELEFON|Dzwoni;OGROD|Rosną w nim warzywa;POMIDOR|Czerwone warzywo;OGOREK|Kiszony do obiadu;WIDELEC|Sztuciec do makaronu;LYZKA|Do zupy;NOZ|Kroi chleb;TALERZ|Na nim leży obiad;KUBEK|Pije się z niego herbatę;GARNEK|Gotuje się w nim zupę;PATELNIA|Smaży się na niej jajecznicę;LODOWKA|Chłodzi jedzenie;PIEKARNIK|Wypiekasz w nim szarlotkę;SZARLOTKA|Ciasto z jabłkami;PLACEK|Ziemniacz "|"));
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const HEX=/^#[0-9a-f]{6}$/i;
const cleanN=v=>String(v||'').replace(/[\u0000-\u001f\u200b-\u200f\u2028-\u202f<>&]/g,'').trim().slice(0,14);
const PAL=["#d94f3d","#2f7fd1","#2c9a5b","#e0a21b","#8e4fc4","#e0568f","#17a2a2","#d9722b","#6b7d1f","#4a5bd6"];
const rndCol=PAL[Math.random()*PAL.length|0];
const colOf=c=>HEX.test(c||'')?c.toLowerCase():'#888888';
const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const netOk=()=>{try{return !!(window.__krNet&&window.__krNet())}catch(e){return false}};
const accNick=()=>{try{return cleanN(window.__krNick&&window.__krNick())}catch(e){return''}};
const accCol=()=>{try{const c=window.__krCol&&window.__krCol();return HEX.test(c||'')?c.toLowerCase():''}catch(e){return''}};
let toastT=0;
function toast(m){let t=$('toast');if(!t){t=document.createElement('div');t.id='toast';document.body.append(t)}t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}
/* ---------- generator ---------- */
function gen(){
 const N=25;let best=null;
 for(let t=0;t<40;t++){
  const G=new Map(),at=(r,c)=>(r<0||c<0||r>=N||c>=N)?null:G.get(r*N+c);
  const fit=(w,r,c,d)=>{const dr=d,dc=1-d,L=w.length;
   if(r<0||c<0||r+dr*(L-1)>=N||c+dc*(L-1)>=N||at(r-dr,c-dc)||at(r+dr*L,c+dc*L))return -1;
   let x=0;for(let i=0;i<L;i++){const rr=r+dr*i,cc=c+dc*i,e=at(rr,cc);
    if(e){if(e.ch!==w[i]||e.d[d])return -1;x++}else if(at(rr+dc,cc+dr)||at(rr-dc,cc-dr))return -1}
   return x};
  const put=(w,r,c,d)=>{for(let i=0;i<w.length;i++){const k=(r+d*i)*N+c+(1-d)*i;let e=G.get(k);if(!e){e={ch:w[i],d:{},r:r+d*i,c:c+(1-d)*i};G.set(k,e)}e.d[d]=1}};
  const pool=sh(WL.slice()).slice(0,52).sort((a,b)=>b[0].length-a[0].length+(Math.random()-.5)*3);
  const words=[];const f=pool[0];put(f[0],12,(N-f[0].length)>>1,0);words.push({a:f[0],q:f[1],r:12,c:(N-f[0].length)>>1,d:0});
  for(const [w,q] of pool.slice(1)){const cand=[];
   for(const e of G.values())for(let i=0;i<w.length;i++)if(w[i]===e.ch)for(const d of [0,1]){
    const r=e.r-d*i,c=e.c-(1-d)*i;if(fit(w,r,c,d)>0)cand.push([r,c,d])}
   if(cand.length){const [r,c,d]=cand[Math.random()*cand.length|0];put(w,r,c,d);words.push({a:w,q,r,c,d})}}
  if(!best||words.length>best.length)best=words;if(words.length>=34)break}
 const r0=Math.min(...best.map(w=>w.r)),c0=Math.min(...best.map(w=>w.c));
 best.forEach(w=>{w.r-=r0;w.c-=c0});
 return{id:Date.now().toString(36)+(Math.random()*1679616|0).toString(36),words:best,h:Math.max(...best.map(w=>w.r+(w.d?w.a.length:1))),w:Math.max(...best.map(w=>w.c+(w.d?1:w.a.length)))};
}
/* ---------- stan ---------- */
const S={room:null,code:'',id:'',words:[],H:0,W:0,solved:{},ent:{},sel:null,dir:0,bad:-1,cells:{},nums:{},known:{},nick:'',col:'',myId:'me',recorded:false,wait:0,wait2:0};
const k=(r,c)=>r+","+c,norm=s=>s.toUpperCase().replace(/Ł/g,"L").normalize("NFD").replace(/[^A-Z]/g,"");
const who=p=>S.known[p]||{nick:'Gracz',col:'#888888'};
/* Firebase może zwrócić tablicę jako obiekt o kluczach liczbowych – normalizujemy i walidujemy, zanim ruszymy stan */
function loadPuzzle(p,solvedMap){
 const arr=Array.isArray(p.words)?p.words:Object.keys(p.words||{}).sort((x,y)=>x-y).map(i=>p.words[i]);
 const ws=arr.filter(w=>w&&/^[A-Z]{2,25}$/.test(String(w.a))).map(w=>({a:String(w.a),q:String(w.q||'').slice(0,120),r:+w.r,c:+w.c,d:+w.d?1:0}));
 if(!ws.length||ws.length!==arr.length||!(+p.h>0)||!(+p.w>0))throw new Error('Niepoprawna krzyżówka');
 S.id=String(p.id).replace(/[^a-z0-9]/gi,'').slice(0,20)||'x';S.words=ws;S.H=+p.h;S.W=+p.w;
 S.solved={};S.ent={};S.bad=-1;S.recorded=false;
 setup();
 if(solvedMap)for(const i in solvedMap){const v=solvedMap[i];if(v&&S.words[i])applySolved(+i,v.p,v.ts)}
 paint()}
function setup(){
 S.cells={};S.nums={};
 S.words.forEach((w,i)=>{for(let j=0;j<w.a.length;j++){const kk=w.d?k(w.r+j,w.c):k(w.r,w.c+j);(S.cells[kk]=S.cells[kk]||{ch:w.a[j],ws:[-1,-1]}).ws[w.d]=i}});
 const st=[...new Set(S.words.map(w=>k(w.r,w.c)))].map(s=>s.split(",").map(Number)).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
 st.forEach((s,i)=>S.nums[k(...s)]=i+1);S.words.forEach(w=>w.n=S.nums[k(w.r,w.c)]);
 $("board").style.gridTemplateColumns=`repeat(${S.W},var(--cs))`;
 S.sel=[S.words[0].r,S.words[0].c];S.dir=S.words[0].d}
const aw=()=>{if(!S.sel)return -1;const c=S.cells[k(...S.sel)];return c?(c.ws[S.dir]>=0?c.ws[S.dir]:c.ws[1-S.dir]):-1};
const letter=kk=>{const c=S.cells[kk];if(!c)return"";for(const i of c.ws)if(i>=0&&S.solved[i])return c.ch;return S.ent[kk]||""};
/* pierwsza zgoda wygrywa: wpis z wcześniejszym znacznikiem czasu serwera; własny, jeszcze niepotwierdzony wpis ustępuje */
function applySolved(i,peer,ts){
 const cur=S.solved[i];
 if(!cur||cur.ts==null||ts<cur.ts||(ts===cur.ts&&peer<cur.p)){
  S.solved[i]={p:peer,ts:ts};const w=S.words[i];
  if(w)for(let j=0;j<w.a.length;j++)delete S.ent[w.d?k(w.r+j,w.c):k(w.r,w.c+j)]}}
function scores(){const sc={};for(const i in S.solved){const p=S.solved[i].p;sc[p]=(sc[p]||0)+S.words[i].a.length}return sc}
function playerList(){
 const out=[],seen=new Set();
 if(S.room){S.room.peers().forEach(p=>{if(p.presence&&p.presence.nick){S.known[p.peer]={nick:cleanN(p.presence.nick),col:colOf(p.presence.col)};out.push({id:p.peer,me:p.isMe,here:true});seen.add(p.peer)}})}
 else{S.known.me={nick:S.nick,col:S.col};out.push({id:'me',me:true,here:true});seen.add('me')}
 const sc=scores();for(const p in sc)if(!seen.has(p)&&S.known[p]){out.push({id:p,me:false,here:false});seen.add(p)}
 return out}
function paint(){
 if(!S.words.length)return;
 const a=aw(),aWord=S.words[a];let h="";
 for(let r=0;r<S.H;r++)for(let c=0;c<S.W;c++){const kk=k(r,c),cl=S.cells[kk];
  if(!cl){h+='<div class="b"></div>';continue}
  const sv=cl.ws.find(i=>i>=0&&S.solved[i]);let cls="c",st="";
  if(sv!==undefined){cls+=" done";st=`style="background:color-mix(in srgb,${colOf(who(S.solved[sv].p).col)} 38%,var(--paper));color:var(--ink)"`}
  if(a>=0&&cl.ws.includes(a)&&sv===undefined)cls+=" act";
  if(S.bad>=0&&cl.ws.includes(S.bad))cls+=" bad";
  if(S.sel[0]===r&&S.sel[1]===c)cls+=" sel";
  h+=`<div class="${cls}" ${st} data-k="${kk}">${S.nums[kk]?`<span class="n">${S.nums[kk]}</span>`:""}${esc(letter(kk))}</div>`}
 $("board").innerHTML=h;
 $("cur").innerHTML=aWord?`<b>${aWord.n} ${aWord.d?"Pionowo ↓":"Poziomo →"}</b> &nbsp;${esc(aWord.q)} <span style="color:var(--muted)">(${aWord.a.length} liter)</span>`:"";
 ["ch","cv"].forEach((id,d)=>$(id).innerHTML=S.words.map((w,i)=>({w,i})).filter(x=>x.w.d===d).sort((x,y)=>x.w.n-y.w.n)
  .map(({w,i})=>`<div data-i="${i}" class="${i===a?"on":""} ${S.solved[i]?"ok":""}"><b>${w.n}.</b>${esc(w.q)} <small>(${w.a.length})</small></div>`).join(""));
 paintPlayers();
 const n=Object.keys(S.solved).length,w=$("win");
 if(n===S.words.length){
  const sc=scores(),pl=playerList().sort((x,y)=>(sc[y.id]||0)-(sc[x.id]||0)),top=pl[0];
  const tie=pl.length>1&&(sc[pl[1].id]||0)===(sc[top.id]||0);
  w.classList.remove("hide");
  w.textContent=pl.length>1?(tie?`🎉 Krzyżówka rozwiązana! Remis na czele (${sc[top.id]||0} pkt)`:`🎉 Krzyżówka rozwiązana! Wygrywa ${who(top.id).nick} (${sc[top.id]||0} pkt)`):`🎉 Krzyżówka rozwiązana!`;
  scheduleStats()}
 else w.classList.add("hide")}
function paintPlayers(){
 const sc=scores();
 $("pls").innerHTML=playerList().sort((x,y)=>(sc[y.id]||0)-(sc[x.id]||0)).map(p=>{const w=who(p.id);
  return `<div class="pl${p.me?' me':''}${p.here?'':' gone'}"><i style="background:${esc(colOf(w.col))}"></i><span>${esc(w.nick)}${p.me?" (ty)":""}${p.here?"":" (wyszedł)"}</span><em>${sc[p.id]||0}<small>pkt</small></em></div>`}).join("")}
/* ---------- statystyki: tylko pokoje (min. 2 graczy), jeden wpis na krzyżówkę; wygrywa najwięcej punktów (remis = remis) ---------- */
let stT=0;
function scheduleStats(){if(S.recorded||!S.room)return;S.recorded=true;const id=S.id;clearTimeout(stT);stT=setTimeout(()=>{if(S.id!==id)return;recStats()},1500)}
function recStats(){
 if(!S.room||!S.id||!window.__krStats)return;
 if(Object.keys(S.solved).length!==S.words.length)return;
 const pl=S.room.peers().filter(p=>p.presence&&p.presence.nick);
 if(pl.length<2||!pl.some(p=>p.isMe))return;
 const sc=scores(),mine=sc[S.myId]||0,max=Math.max(...pl.map(p=>sc[p.peer]||0));
 const topN=pl.filter(p=>(sc[p.peer]||0)===max).length;
 const r=mine===max?(topN>1?'d':'w'):'l';
 window.__krStats(S.code,S.id,pl.map(p=>({uid:p.peer,name:cleanN(p.presence.nick)})),r)}
/* ---------- wpisywanie ---------- */
function move(step){const a=aw();if(a<0)return;const w=S.words[a],i=(w.d?S.sel[0]-w.r:S.sel[1]-w.c)+step;
 if(i>=0&&i<w.a.length)S.sel=w.d?[w.r+i,w.c]:[w.r,w.c+i]}
function check(a){const w=S.words[a];if(S.solved[a])return;let s="";
 for(let j=0;j<w.a.length;j++){const l=letter(w.d?k(w.r+j,w.c):k(w.r,w.c+j));if(!l)return;s+=l}
 if(s===w.a){
  S.solved[a]={p:S.myId,ts:S.room?null:Date.now()};
  for(let j=0;j<w.a.length;j++)delete S.ent[w.d?k(w.r+j,w.c):k(w.r,w.c+j)];
  if(S.room)S.room.emit('solved',{id:S.id,i:a,nick:S.nick,col:S.col}).catch(()=>{})}
 else{S.bad=a;setTimeout(()=>{S.bad=-1;paint()},500)}}
function typeCh(ch){const a=aw();if(a<0||S.solved[a])return;const kk=k(...S.sel);
 if(!letter(kk))S.ent[kk]=ch;else if(S.ent[kk])S.ent[kk]=ch;move(1);check(a);paint()}
function back(){const a=aw();if(a<0)return;const kk=k(...S.sel);
 if(S.ent[kk])delete S.ent[kk];else{move(-1);delete S.ent[k(...S.sel)]}paint()}
$("kb").addEventListener("input",e=>{for(const ch of norm(e.target.value))typeCh(ch);e.target.value=""});
$("kb").addEventListener("keydown",e=>{
 if(e.key==="Backspace"){e.preventDefault();back()}
 else if(e.key==="Enter"){const a=aw();if(a>=0)check(a);paint()}
 else if(e.key==="Tab"){e.preventDefault();const a=aw();goWord((a+(e.shiftKey?-1:1)+S.words.length)%S.words.length)}
 else if(e.key.startsWith("Arrow")){e.preventDefault();const m={ArrowLeft:[0,-1,0],ArrowRight:[0,1,0],ArrowUp:[-1,0,1],ArrowDown:[1,0,1]}[e.key];
  const [dr,dc,d]=m;const r=S.sel[0]+dr,c=S.sel[1]+dc;if(S.cells[k(r,c)]){S.sel=[r,c];if(S.cells[k(r,c)].ws[d]>=0)S.dir=d;paint()}}});
function goWord(i){const w=S.words[i];S.dir=w.d;let p=[w.r,w.c];for(let j=0;j<w.a.length;j++){const q=w.d?[w.r+j,w.c]:[w.r,w.c+j];if(!letter(k(...q))){p=q;break}}S.sel=p;paint();$("kb").focus({preventScroll:true})}
$("board").addEventListener("click",e=>{const el=e.target.closest(".c");if(!el)return;
 const [r,c]=el.dataset.k.split(",").map(Number),cl=S.cells[el.dataset.k];
 if(S.sel[0]===r&&S.sel[1]===c){if(cl.ws[1-S.dir]>=0)S.dir=1-S.dir}else if(cl.ws[S.dir]<0)S.dir=1-S.dir;
 S.sel=[r,c];paint();$("kb").focus({preventScroll:true})});
document.querySelector(".side").addEventListener("click",e=>{const d=e.target.closest("[data-i]");if(d)goWord(+d.dataset.i)});
$("room").onclick=()=>{try{navigator.clipboard.writeText(S.code);$("room").textContent="Skopiowano ✓";setTimeout(()=>$("room").textContent=S.code,1200)}catch(_){toast('Kod pokoju: '+S.code)}};
/* ---------- nick i kolor (z konta albo wpisane / wybrane) ---------- */
function initPrefs(){
 const an=accNick(),ac=accCol(),n=$('nick'),c=$('col');
 if(an){n.value=an;n.readOnly=true;n.title='Nick z Twojego konta'}
 else{n.readOnly=false;n.title='';if(!n.value){try{const v=cleanN(localStorage.getItem('krzyz_nick'));if(v)n.value=v}catch(e){}}}
 if(ac){c.value=ac;c.disabled=true;c.title='Kolor z Twojego konta'}
 else{c.disabled=false;c.title='Wybierz swój kolor';if(!c.dataset.set){let v='';try{v=localStorage.getItem('krzyz_col')||''}catch(e){}c.value=HEX.test(v)?v:rndCol;c.dataset.set='1'}}
 $('lobinfo').textContent=!netOk()?'Pokoje online są niedostępne (brak połączenia z Firebase). Możesz zagrać solo.'
  :an?'Grasz jako '+an+' – wyniki z pokoi (min. 2 graczy) trafią do Twoich statystyk.'
  :'Zaloguj się na konto, aby nick i kolor pochodziły z konta, a wyniki z pokoi liczyły się do statystyk.'}
function readPrefs(){
 const an=accNick(),ac=accCol(),typed=cleanN($('nick').value);
 S.nick=an||typed||'Gracz'+(Math.random()*90+10|0);
 S.col=ac||(HEX.test($('col').value)?$('col').value.toLowerCase():rndCol);
 if(!an){try{if(typed)localStorage.setItem('krzyz_nick',typed);if(!ac)localStorage.setItem('krzyz_col',S.col)}catch(e){}}}
/* ---------- ekrany ---------- */
const err=m=>$("err").textContent=m||"";
function showGame(code){err();$("lobby").classList.add("hide");$("game").classList.remove("hide");
 const on=!!code;$("room").classList.toggle("hide",!on);$("roomLbl").classList.toggle("hide",!on);$("room").textContent=code||'';$("win").classList.add("hide")}
function resetState(){clearTimeout(S.wait);clearTimeout(S.wait2);clearTimeout(stT);S.words=[];S.solved={};S.ent={};S.id='';S.recorded=false;S.known={}}
function toLobby(){
 if(S.room){const r=S.room;S.room=null;r.leave().catch(()=>{})}
 S.code='';S.myId='me';resetState();
 $("game").classList.add("hide");$("lobby").classList.remove("hide");$("board").innerHTML='';initPrefs()}
/* ---------- pokoje (Firebase przez hub) ---------- */
function newPuzzle(){const g=gen();loadPuzzle(g);if(S.room)S.room.emit('start',{p:g}).catch(()=>{})}
$("bSolo").onclick=()=>{readPrefs();resetState();S.room=null;S.code='';S.myId='me';showGame(null);S.known.me={nick:S.nick,col:S.col};loadPuzzle(gen())};
const CODE_A="ABCDEFGHJKLMNPRSTUWZ";
async function enter(code,create){
 if(!netOk()){err('Pokoje online są niedostępne.');return'err'}
 readPrefs();
 let r;
 try{r=await window.__krJoin('krzyz-'+code.toLowerCase())}catch(e){err('Nie udało się wejść do pokoju.');return'err'}
 const others=r.peers().filter(p=>!p.isMe).length;
 if(create&&others>0){await r.leave().catch(()=>{});return'busy'}
 if(!create&&others===0){await r.leave().catch(()=>{});err('Nie ma pokoju o takim kodzie.');return'none'}
 resetState();S.room=r;S.code=code;S.myId=r.uid;
 r.on('start',m=>{if(S.room!==r||m.isMe||!m.data||!m.data.p)return;try{if(m.data.p.id!==S.id)loadPuzzle(m.data.p)}catch(e){}});
 r.on('req',m=>{if(S.room!==r||m.isMe||!S.words.length)return;setTimeout(()=>{if(S.room===r&&S.words.length)r.emit('sync',{p:{id:S.id,words:S.words.map(w=>({a:w.a,q:w.q,r:w.r,c:w.c,d:w.d})),h:S.H,w:S.W},s:S.solved,k:S.known}).catch(()=>{})},Math.random()*500)});
 r.on('sync',m=>{if(S.room!==r||m.isMe||!m.data||!m.data.p)return;const d=m.data;
  if(d.k&&typeof d.k==='object')for(const p in d.k){const v=d.k[p];if(v&&!S.known[p])S.known[p]={nick:cleanN(v.nick),col:colOf(v.col)}}
  try{
   if(!S.words.length)loadPuzzle(d.p,d.s||null);
   else if(d.p.id===S.id&&d.s){for(const i in d.s){const v=d.s[i];if(v&&S.words[i])applySolved(+i,v.p,v.ts)}paint()}
  }catch(e){}});
 r.on('solved',m=>{if(S.room!==r||!m.data||m.data.id!==S.id)return;const d=m.data,i=+d.i;if(!S.words[i])return;
  if(!m.isMe&&!S.known[m.peer])S.known[m.peer]={nick:cleanN(d.nick)||'Gracz',col:colOf(d.col)};
  applySolved(i,m.peer,m.ts);paint()});
 r.onPeers(()=>{if(S.room===r)paint()});
 r.onReconnect(()=>{if(S.room!==r)return;pres();r.emit('req',{}).catch(()=>{})});
 try{await r.presence({nick:S.nick,col:S.col})}catch(e){}
 S.known[r.uid]={nick:S.nick,col:S.col};
 showGame(code);
 if(create){newPuzzle()}
 else{
  r.emit('req',{}).catch(()=>{});
  S.wait=setTimeout(()=>{if(S.room===r&&!S.words.length)r.emit('req',{}).catch(()=>{})},1300);
  S.wait2=setTimeout(()=>{if(S.room===r&&!S.words.length)newPuzzle()},3200)}
 return'ok'}
function pres(){if(!S.room)return;S.room.presence({nick:S.nick,col:S.col}).catch(()=>{})}
$("bMk").onclick=async()=>{
 for(let t=0;t<6;t++){let c="";for(let i=0;i<5;i++)c+=CODE_A[Math.random()*CODE_A.length|0];
  const res=await enter(c,true);if(res!=='busy')return}
 err('Nie udało się utworzyć pokoju – spróbuj ponownie.')};
$("bJn").onclick=()=>{const c=$("code").value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(c.length<5){err("Kod ma 5 znaków.");return}enter(c,false)};
$("bNew").onclick=()=>{
 const left=S.words.length-Object.keys(S.solved).length;
 if(left>0&&!confirm(S.room?'Wylosować nową krzyżówkę dla całego pokoju? Obecna jest nierozwiązana.':'Wylosować nową krzyżówkę? Obecna jest nierozwiązana.'))return;
 newPuzzle()};
$("bLeave").onclick=toLobby;
/* ---------- hooki huba ---------- */
window.__krzyzLeave=()=>{try{if(S.room||!$('game').classList.contains('hide'))toLobby()}catch(e){}};
window.__krzyzRefresh=()=>{try{if(!S.room&&$('game').classList.contains('hide'))initPrefs()}catch(e){}};
initPrefs();

</script></body></html>
