<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kropki i Kwadraty</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f0ff;--b1:#ffd6e8;--b2:#c9ecff;--card:#ffffffb8;--tx:#241a47;--mut:#6b6490;--dot:#2b2354;--ln:#2b235422;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120c2e;--b1:#4a1d6b;--b2:#0e3b66;--card:#ffffff14;--tx:#f5f2ff;--mut:#a79fd0;--dot:#f5f2ff;--ln:#ffffff26;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#120c2e;--b1:#4a1d6b;--b2:#0e3b66;--card:#ffffff14;--tx:#f5f2ff;--mut:#a79fd0;--dot:#f5f2ff;--ln:#ffffff26;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:Fredoka,ui-rounded,system-ui,sans-serif;color:var(--tx);background:radial-gradient(circle at 15% 15%,var(--b1),transparent 50%),radial-gradient(circle at 85% 85%,var(--b2),transparent 50%),var(--bg);background-size:150% 150%;animation:bg 14s ease-in-out infinite alternate}
@keyframes bg{to{background-position:100% 100%}}
#app{max-width:880px;margin:0 auto;padding:14px;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-size:1.5rem;font-weight:700;background:linear-gradient(90deg,#ff5d73,#ffc928,#2fd68f,#2fb8ff,#a77bff);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200%;animation:bg 6s linear infinite alternate}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:14px;padding:.7rem 1.1rem;background:var(--card);transition:transform .15s,box-shadow .15s}
button:hover:not(:disabled){transform:translateY(-2px)}button:active:not(:disabled){transform:scale(.96)}button:disabled{opacity:.45;cursor:default}
.big{background:linear-gradient(135deg,#ff5d73,#a77bff);color:#fff;font-weight:700;font-size:1.15rem;box-shadow:0 8px 24px #a77bff55}
.go{background:linear-gradient(135deg,#2fd68f,#2fb8ff);color:#fff;font-weight:700;font-size:1.15rem;box-shadow:0 8px 24px #2fb8ff55}

.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

.me{display:flex;align-items:center;gap:10px;font-size:1.1rem;margin-top:20px}.me i{width:22px;height:22px;border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c)}

.bt{display:flex;flex-direction:column;align-items:center;gap:6px;border:3px solid transparent;color:var(--mut)}
.bt.sel{border-color:#a77bff;color:var(--tx);box-shadow:0 0 20px #a77bff66;transform:scale(1.04)}
.bt svg{width:56px;height:56px}
.pl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
.pc{display:flex;align-items:center;gap:.5rem;padding:.5rem .9rem;border-radius:16px;background:var(--card);border:2px solid transparent;transition:all .3s;min-width:110px}
.pc i{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);flex:none}
.pc em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px}
.pc b{margin-left:auto;font-size:1.3rem;padding-left:8px}
.pc.on{border-color:var(--c);box-shadow:0 0 22px color-mix(in srgb,var(--c) 60%,transparent);transform:translateY(-4px)}
.pc.gone{opacity:.4}.pc.bump b{animation:bm .6s}@keyframes bm{50%{transform:scale(1.6)}}
#tb{padding:.5rem 1.4rem;border-radius:999px;background:var(--c);color:#fff;font-weight:700;text-shadow:0 1px 4px #0006;animation:pp .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pp{from{transform:scale(.7);opacity:0}}
.top{display:flex;justify-content:space-between;align-items:center;width:100%;gap:8px}
#bd{width:100%;margin:0 auto}#bd svg{width:100%;height:auto;display:block;overflow:visible}
.dt{fill:var(--dot)}
.hit{stroke:transparent;stroke-width:28;cursor:pointer}.hit.dn{pointer-events:none}.ro .hit{pointer-events:none}
.pv{stroke-width:7;stroke-linecap:round;opacity:.45;pointer-events:none}
.ln{stroke-width:7;stroke-linecap:round;filter:drop-shadow(0 0 5px currentColor)}
.ln.an{stroke-dasharray:80;stroke-dashoffset:80;animation:dr .35s ease-out forwards}@keyframes dr{to{stroke-dashoffset:0}}
.bx rect{fill:var(--c);fill-opacity:.3}.bx text{fill:var(--c);font:700 28px Fredoka,sans-serif}
.bx{transform-box:fill-box;transform-origin:center}.bx.an{animation:bp .55s .2s cubic-bezier(.3,1.7,.5,1) both}@keyframes bp{from{transform:scale(0) rotate(-25deg);opacity:0}}
.rip{fill:none;stroke-width:4;animation:rp .8s ease-out forwards}@keyframes rp{to{r:60;opacity:0;stroke-width:0}}
#end{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0008;backdrop-filter:blur(6px);z-index:20;padding:20px}
#end.on{display:flex}
.modal{background:var(--bg);border-radius:26px;padding:24px;width:min(420px,100%);display:flex;flex-direction:column;gap:10px;text-align:center;animation:pp .6s cubic-bezier(.3,1.6,.5,1)}
.modal .pc{width:100%}
#conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
#conf i{position:absolute;top:-16px;width:9px;height:15px;border-radius:2px;animation:fl linear forwards}@keyframes fl{to{transform:translate(var(--dx),110vh) rotate(900deg)}}
#nick{text-transform:none;letter-spacing:0;font-weight:500;flex:none;width:11em;text-align:left;font-size:1.05rem}#nick[readonly]{border-color:transparent}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--tx);color:var(--bg);padding:.6rem 1.2rem;border-radius:999px;opacity:0;transition:all .3s;z-index:40;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style></head><body>
<div id="app">
<header><b class="logo">Kropki i Kwadraty</b><button id="mu">🔊</button></header>
<section id="menu" class="scr on">
<div class="me" id="me"><i></i><input id="nick" maxlength="14" placeholder="Twój nick" autocomplete="off" aria-label="Twój nick"></div>
<div class="card">
<button id="bC" class="big">Utwórz pokój</button>
<div class="row"><input id="cd" maxlength="5" placeholder="KOD" autocomplete="off"><button id="bJ" class="go">Dołącz</button></div>

</div></section>
<section id="lobby" class="scr">

<div class="pl" id="pls"></div>

</section>
<section id="game" class="scr">

<div id="bd"></div>
<div class="pl" id="pb"></div>
</section>
</div>
<div id="end"></div><div id="conf"></div><div id="toast"></div>
<script>
/* most do Firebase hosta (index.html): pokoje online + nick + kolor + statystyki */
(function(){
var P=window.parent,B=null;
try{B=P&&P!==window&&P.kroBridge&&P.kroBridge()}catch(e){B=null}
window.__kroNick=function(){try{return B&&B.nick()||''}catch(e){return''}};
window.__kroCol=function(){try{return B&&B.col()||''}catch(e){return''}};
window.__kroStats=function(code,gid,players,r){try{if(B)B.stats(code,gid,players,r)}catch(e){}};
window.__kroNet=!!(B&&B.net());
if(!B||!B.net())return;
window.__kroJoin=async function(name){
  var uid=await B.auth();
  var path='tttRooms/'+String(name).toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,40);
  var ref=B.db.ref(path),pr=ref.child('peers'),ms=ref.child('msgs');
  var cache={},pc=[],h={},gone=false,first=true;
  var startKey=ms.push().key;
  await pr.child(uid).set({t:B.ts});
  try{pr.child(uid).onDisconnect().remove()}catch(e){}
  function fire(c){pc.forEach(function(f){try{f(c)}catch(e){console.error(e)}})}
  var onVal=pr.on('value',function(s){
    var v=s.val()||{},joined=[],left=[],changed=[];
    Object.keys(v).forEach(function(k){var p=v[k]&&v[k].p||{};
      if(!cache[k]&&!first&&k!==uid)joined.push({peer:k});
      else if(cache[k]&&k!==uid&&JSON.stringify(cache[k])!==JSON.stringify(p))changed.push({peer:k});
      cache[k]=p});
    Object.keys(cache).forEach(function(k){if(!v[k]){delete cache[k];if(k!==uid)left.push({peer:k})}});
    first=false;fire({joined:joined,left:left,changed:changed});
  });
  await pr.once('value').then(function(s){var v=s.val()||{};Object.keys(v).forEach(function(k){cache[k]=v[k]&&v[k].p||{}})});
  var q=ms.orderByKey().startAt(startKey);
  var onMsg=q.on('child_added',function(s){var v=s.val();if(!v||!v.t)return;var fs=h[v.t];if(!fs)return;
    var m={peer:v.peer,isMe:v.peer===uid,ts:+v.ts||Date.now(),data:v.data===undefined?null:v.data};
    fs.slice().forEach(function(f){try{f(m)}catch(e){console.error(e)}})});
  return{
    uid:uid,
    peers:function(){return Object.keys(cache).map(function(k){return{peer:k,isMe:k===uid,presence:cache[k]||{}}})},
    presence:function(o){cache[uid]=o;return pr.child(uid).set({t:B.ts,p:o})},
    on:function(t,f){(h[t]=h[t]||[]).push(f);return function(){h[t]=(h[t]||[]).filter(function(x){return x!==f})}},
    onPeers:function(f){pc.push(f);return function(){pc=pc.filter(function(x){return x!==f})}},
    emit:function(t,d){if(gone)return Promise.resolve();var r=ms.push();var p=r.set({t:t,peer:uid,data:d===undefined?null:d,ts:B.ts});setTimeout(function(){r.remove().catch(function(){})},20000);return p},
    leave:function(){if(gone)return Promise.resolve();gone=true;try{pr.off('value',onVal);q.off('child_added',onMsg)}catch(e){}
      try{pr.child(uid).onDisconnect().cancel()}catch(e){}
      return pr.child(uid).remove().then(function(){return pr.once('value')}).then(function(s){if(!s.val())return ref.remove()}).catch(function(){})}
  };
};
})();
</script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const PAL=['#ff5d73','#2fb8ff','#ffc928','#2fd68f','#a77bff','#ff8a3d'],NS='http://www.w3.org/2000/svg',Z=72,P=34;
const BD=[{id:'m',n:'Mini',R:3,C:3},{id:'k',n:'Klasyk',R:5,C:5},{id:'d',n:'Duża',R:7,C:7},{id:'p',n:'Prostokąt',R:4,C:8},
{id:'r',n:'Diament',R:7,C:7,f:(r,c)=>Math.abs(r-3)+Math.abs(c-3)<=3},{id:'x',n:'Krzyż',R:7,C:7,f:(r,c)=>(r>=2&&r<=4)||(c>=2&&c<=4)},
{id:'o',n:'Pierścień',R:6,C:6,f:(r,c)=>!(r>=2&&r<=3&&c>=2&&c<=3)},{id:'s',n:'Schody',R:6,C:6,f:(r,c)=>c<=r}];
const HEX=/^#[0-9a-f]{6}$/i,cleanN=v=>String(v||'').replace(/[\u0000-\u001f\u200b-\u200f\u2028-\u202f<>&]/g,'').trim().slice(0,14);
const rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)),close=(a,b)=>{const x=rgb(a),y=rgb(b);return Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2])<70};
function pickCol(want,used){const c=HEX.test(want||'')?want.toLowerCase():'';if(c&&!used.some(u=>close(u,c)))return c;for(const p of PAL)if(!used.some(u=>close(u,p)))return p;return PAL[used.length%6]}
const bd=id=>BD.find(b=>b.id===id)||BD[1],esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
const act=(B,r,c)=>r>=0&&c>=0&&r<B.R&&c<B.C&&(!B.f||B.f(r,c));
const vEdge=(B,t,r,c)=>t==='h'?act(B,r-1,c)||act(B,r,c):act(B,r,c-1)||act(B,r,c);
/* sound */
let AC,mute=false;
const au=()=>{if(!AC)try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}if(AC&&AC.state==='suspended')AC.resume();return AC};
function tn(f,d,ty,v,at){if(mute)return;const a=au();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+(at||0);o.type=ty||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v||.15,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}
const SF={ln:i=>{tn(260+i*55,.13,'triangle',.22);tn(540+i*100,.07,'sine',.07,.02)},bx:()=>[523,659,784,1047].forEach((f,i)=>tn(f,.3,'sine',.15,i*.06)),
win:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tn(f,.4,'triangle',.18,i*.11)),ui:()=>tn(440,.08,'square',.05)};
/* game logic */
function newG(b,n){const B=bd(b);let t=0;for(let r=0;r<B.R;r++)for(let c=0;c<B.C;c++)if(act(B,r,c))t++;return{b,n,mv:[],e:{},o:{},sc:Array(n).fill(0),turn:0,tot:t,over:false}}
function apply(g,k){
 if(g.over)return null;
 if(k==='s'){g.mv.push(k);g.turn=(g.turn+1)%g.n;return[]}
 if(!/^[hv]\d+,\d+$/.test(k)||g.e[k]!==undefined)return null;
 const B=bd(g.b),t=k[0],[r,c]=k.slice(1).split(',').map(Number);
 if(!vEdge(B,t,r,c))return null;
 g.e[k]=g.turn;g.mv.push(k);
 const done=[];
 for(const[y,x]of t==='h'?[[r-1,c],[r,c]]:[[r,c-1],[r,c]]){
  if(!act(B,y,x)||g.o[y+','+x]!==undefined)continue;
  if(g.e['h'+y+','+x]!==undefined&&g.e['h'+(y+1)+','+x]!==undefined&&g.e['v'+y+','+x]!==undefined&&g.e['v'+y+','+(x+1)]!==undefined){g.o[y+','+x]=g.turn;g.sc[g.turn]++;done.push(1)}}
 if(Object.keys(g.o).length===g.tot)g.over=true;else if(!done.length)g.turn=(g.turn+1)%g.n;
 return done}
/* state */
let S=null,ctx={mode:'menu'},me={name:'Gracz',col:PAL[0],id:null},R=null,roomNS=null,isHost=false,ord=[],V={sid:-1},SV=null,tS=0;
const G=()=>{const g=newG(S.b,S.pl.length);S.mv.forEach(k=>apply(g,k));return g};
const myPeer=()=>R&&R.uid;
const myIdx=()=>S.pl.findIndex(p=>p.p===myPeer());
const canPlay=g=>!g.over&&(ctx.mode==='local'||myIdx()===g.turn);
const show=id=>$$('.scr').forEach(s=>s.classList.toggle('on',s.id===id));
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2400)};
const normS=s=>{if(!s)return s;s.pl=s.pl||[];s.mv=s.mv||[];s.all=s.all||[];return s};
const bc=()=>{if(R&&isHost)R.emit('state',S).catch(()=>{})};
function render(){if(!S)return;if(S.ph==='lobby'){$('#end').classList.remove('on');show('lobby');renderLobby()}else{show('game');renderGame()}}
function localPl(n){const u=[me.col],a=[{n:me.name,c:me.col}];for(let i=1;i<n;i++){const c=pickCol('',u);u.push(c);a.push({n:'Gracz '+(i+1),c})}return a}
function thumb(B){let s='';for(let r=0;r<B.R;r++)for(let c=0;c<B.C;c++)if(act(B,r,c))s+=`<rect x="${c*10+.5}" y="${r*10+.5}" width="9" height="9" rx="2.5"/>`;return`<svg viewBox="0 0 ${B.C*10} ${B.R*10}" fill="currentColor">${s}</svg>`}
function renderLobby(){
 const net=ctx.mode==='net';
 $('#lc').style.display=net?'':'none';
 if(!S){$('#pls').innerHTML='<p class="hint">Łączenie z pokojem…</p>';$('#bs').innerHTML='';$('#st').style.display=$('#stp').style.display='none';return}
 const can=!net||isHost;
 $('#lc').textContent=ctx.code||'';
 $('#bs').innerHTML=BD.map(b=>`<button class="bt${b.id===S.b?' sel':''}" data-b="${b.id}"${can?'':' disabled'}>${thumb(b)}<span>${b.n}</span></button>`).join('');
 $('#pls').innerHTML=S.pl.map(p=>`<div class="pc on" style="--c:${p.c}"><i></i><em>${esc(p.n)}${p.host?' 👑':''}</em></div>`).join('');
 $('#stp').style.display=net?'none':'flex';$('#nn').textContent=S.pl.length+' graczy';
 $('#st').style.display=can?'':'none';$('#st').disabled=S.pl.length<2;
 $('#hn').textContent=net?(can?(S.pl.length<2?'Podaj znajomym kod pokoju – czekamy na graczy (2–6)':'Wybierz planszę i zacznij!'):'Host wybiera planszę i startuje grę'):'Wybierz planszę i liczbę graczy';
}
/* board */
function build(B){
 const W=P*2+B.C*Z,H=P*2+B.R*Z,svg=el('svg',{viewBox:`0 0 ${W} ${H}`}),L={};
 ['b','e','d','h'].forEach(n=>L[n]=el('g',{},svg));
 SV={svg,L,hits:{},pv:el('line',{class:'pv',visibility:'hidden'},L.h)};
 const hit=(t,r,c)=>{const x1=P+c*Z,y1=P+r*Z,x2=t==='h'?x1+Z:x1,y2=t==='v'?y1+Z:y1,k=t+r+','+c,h=el('line',{x1,y1,x2,y2,class:'hit'},L.h);
  h.onclick=()=>tryMove(k);
  h.onmouseenter=()=>{const g=G();if(!canPlay(g))return;const q=SV.pv;q.setAttribute('x1',x1);q.setAttribute('y1',y1);q.setAttribute('x2',x2);q.setAttribute('y2',y2);q.style.stroke=S.pl[g.turn].c;q.setAttribute('visibility','visible')};
  h.onmouseleave=()=>SV.pv.setAttribute('visibility','hidden');SV.hits[k]=h};
 for(let r=0;r<=B.R;r++)for(let c=0;c<=B.C;c++){
  if(act(B,r-1,c-1)||act(B,r-1,c)||act(B,r,c-1)||act(B,r,c))el('circle',{cx:P+c*Z,cy:P+r*Z,r:5.5,class:'dt'},L.d);
  if(c<B.C&&vEdge(B,'h',r,c))hit('h',r,c);if(r<B.R&&vEdge(B,'v',r,c))hit('v',r,c)}
 const d=$('#bd');d.innerHTML='';d.style.maxWidth=`min(100%,calc(62vh*${(W/H).toFixed(3)}))`;d.appendChild(svg)}
function drawEdge(k,o,an){
 const t=k[0],[r,c]=k.slice(1).split(',').map(Number),x1=P+c*Z,y1=P+r*Z,x2=t==='h'?x1+Z:x1,y2=t==='v'?y1+Z:y1,col=S.pl[o].c;
 el('line',{x1,y1,x2,y2,class:'ln'+(an?' an':''),style:`stroke:${col};color:${col}`},SV.L.e);SV.hits[k].classList.add('dn');SV.pv.setAttribute('visibility','hidden');if(an)SF.ln(o)}
function drawBox(k,o,sil){
 const[r,c]=k.split(',').map(Number),x=P+c*Z,y=P+r*Z,col=S.pl[o].c,g=el('g',{class:'bx'+(sil?'':' an'),style:`--c:${col}`},SV.L.b);
 el('rect',{x:x+4,y:y+4,width:Z-8,height:Z-8,rx:13},g);
 el('text',{x:x+Z/2,y:y+Z/2+10,'text-anchor':'middle'},g).textContent=[...S.pl[o].n][0].toUpperCase();
 if(!sil){const rp=el('circle',{cx:x+Z/2,cy:y+Z/2,r:8,class:'rip',style:`stroke:${col}`},SV.L.e);setTimeout(()=>rp.remove(),900)}}
function renderGame(){
 const g=G(),sil=V.sid!==S.sid;
 if(sil){build(bd(S.b));V={sid:S.sid,d:new Set(),x:new Set(),end:false,sc:g.sc.map(()=>0)};$('#end').classList.remove('on')}
 g.mv.forEach(k=>{if(k==='s'||V.d.has(k))return;V.d.add(k);drawEdge(k,g.e[k],!sil)});
 let nb=0;for(const k in g.o){if(V.x.has(k))continue;V.x.add(k);drawBox(k,g.o[k],sil);nb++}
 if(nb&&!sil)SF.bx();
 const cp=canPlay(g),cur=S.pl[g.turn],mi=ctx.mode==='net'?myIdx():-1;
 SV.svg.classList.toggle('ro',!cp);
 $('#pb').innerHTML=S.pl.map((p,i)=>`<div class="pc${i===g.turn&&!g.over?' on':''}${p.gone?' gone':''}${g.sc[i]>V.sc[i]&&!sil?' bump':''}" style="--c:${p.c}"><i></i><em>${esc(p.n)}${i===mi?' (Ty)':''}</em><b>${g.sc[i]}</b></div>`).join('');
 V.sc=g.sc.slice();
 const txt=g.over?'Koniec gry!':cp&&ctx.mode==='net'?'Twój ruch!':ctx.mode==='net'&&mi<0?'Obserwujesz · ruch: '+cur.n:'Ruch: '+cur.n;
 const key=g.turn+'|'+g.over+txt;if(V.tk!==key){V.tk=key;$('#tbw').innerHTML=`<div id="tb" style="--c:${cur.c}">${esc(txt)}</div>`}
 $('#gc').textContent=ctx.code||'';
 if(g.over&&!V.end){V.end=true;recStats(g);setTimeout(()=>endScr(g),sil?100:1000)}}
function recStats(g){
  if(ctx.mode!=='net'||!window.__kroStats||!S.gid||!S.all||S.all.length<2)return;
  const i=myIdx();if(i<0||S.pl.filter(p=>!p.gone).length<2)return;
  const best=Math.max(...g.sc),w=g.sc.filter(x=>x===best).length;
  window.__kroStats(ctx.code,S.gid,S.all,g.sc[i]===best?(w>1?'d':'w'):'l')}
function endScr(g){
 const rk=S.pl.map((p,i)=>({p,s:g.sc[i]})).sort((a,b)=>b.s-a.s),top=rk.filter(x=>x.s===rk[0].s);
 const again=ctx.mode==='local'||isHost?'<button id="ag" class="go">Zagraj ponownie</button>':'<p class="hint">Czekamy na hosta…</p>';
 $('#end').innerHTML=`<div class="modal"><h2>${top.length>1?'Remis! 🤝':esc(top[0].p.n)+' wygrywa! 🏆'}</h2>${rk.map((x,i)=>`<div class="pc on" style="--c:${x.p.c}"><i></i><em>${i+1}. ${esc(x.p.n)}</em><b>${x.s}</b></div>`).join('')}<div class="row">${again}<button id="mn2" class="ghost">Menu</button></div></div>`;
 $('#end').classList.add('on');SF.win();confetti();
 const a=$('#ag');if(a)a.onclick=()=>{S={...S,ph:'lobby',mv:[]};if(ctx.mode==='net')sync();else render()};
 $('#mn2').onclick=leave}
function confetti(){const w=$('#conf');w.innerHTML='';for(let i=0;i<80;i++){const s=document.createElement('i');s.style.cssText=`left:${Math.random()*100}%;background:${PAL[i%6]};animation-delay:${Math.random()}s;animation-duration:${2+Math.random()*2}s;--dx:${(Math.random()-.5)*240}px`;w.appendChild(s)}setTimeout(()=>w.innerHTML='',5500)}
/* moves */
function tryMove(k){
 const g=G();if(!canPlay(g))return;
 if(ctx.mode==='net'&&!isHost){R.emit('move',{k}).catch(()=>{});return}
 commit(k)}
function commit(k){const g=G();if(apply(g,k)===null)return;S={...S,mv:g.mv};fix();bc();render()}
function fix(){
 if(ctx.mode!=='net'||!isHost||S.ph!=='play')return;
 const g=G();let n=0;while(!g.over&&S.pl[g.turn].gone&&S.pl.some(p=>!p.gone)&&n++<6)apply(g,'s');S={...S,mv:g.mv}}
/* net */
function sync(){
  if(!R||!isHost)return;
  const pr=p=>p.presence||{},peers=R.peers().slice().sort((a,b)=>(pr(b).host?1:0)-(pr(a).host?1:0)||(+pr(a).ts||0)-(+pr(b).ts||0)||(a.peer<b.peer?-1:1)),alive=new Set(peers.map(p=>p.peer));
  if(S.ph==='lobby'){
   peers.forEach(p=>{if(!ord.includes(p.peer))ord.push(p.peer)});
   ord=ord.filter(x=>alive.has(x));
   const used=[],pl=[];
   ord.slice(0,6).forEach(pe=>{const p=peers.find(q=>q.peer===pe),q=pr(p),c=pickCol(q.col,used);used.push(c);pl.push({p:pe,n:cleanN(q.name)||'Gracz',c,host:!!q.host})});
   pl.sort((a,b)=>b.host-a.host);S={...S,pl}
  }else{S={...S,pl:S.pl.map(p=>({...p,gone:!alive.has(p.p)}))};fix()}
  bc();render()}
async function joinNet(code,host){
  if(!window.__kroJoin){toast('Gra online jest niedostępna w tym widoku');return}
  $('#bC').disabled=$('#bJ').disabled=true;
  try{R=await window.__kroJoin('kropki-'+code.toLowerCase())}catch(e){R=null;toast('Nie udało się połączyć');$('#bC').disabled=$('#bJ').disabled=!window.__kroNet;return}
  $('#bC').disabled=$('#bJ').disabled=!window.__kroNet;
  ctx={mode:'net',code};isHost=host;ord=[];S=null;tS=0;V={sid:-1};
  R.on('state',m=>{if(isHost)return;const h=R.peers().find(p=>p.peer===m.peer);if(!h||!h.presence||!h.presence.host)return;if(!S)tS=Date.now();S=normS(m.data);render()});
  R.on('move',m=>{if(!isHost||!S||S.ph!=='play')return;const g=G(),i=S.pl.findIndex(p=>p.p===m.peer);if(i===g.turn&&m.data&&typeof m.data.k==='string')commit(m.data.k)});
  R.on('ask',()=>{if(isHost)sync()});
  R.onPeers(ch=>{
   if(isHost)sync();
   else{if(S&&Date.now()-tS>4000&&!R.peers().some(p=>p.presence&&p.presence.host)){toast('Host opuścił pokój');leave();return}if(S)render()}});
  try{await R.presence({name:me.name,col:me.col,host,ts:Date.now()})}catch(e){}
  if(!R)return;
  if(host){S={ph:'lobby',b:'k',pl:[],mv:[],sid:0};show('lobby');sync()}
  else{show('lobby');renderLobby();R.emit('ask',{}).catch(()=>{});
   setTimeout(()=>{if(R&&!S)R.emit('ask',{}).catch(()=>{})},1500);
   setTimeout(()=>{if(R&&!S){toast('Nie znaleziono pokoju '+code);leave()}},6000)}}
function leave(){if(R){try{R.leave()}catch(e){}R=null}S=null;ctx={mode:'menu'};isHost=false;V={sid:-1};$('#end').classList.remove('on');$('#conf').innerHTML='';show('menu')}
/* ui */
const mkCode=()=>{const a='ABCDEFGHJKMNPQRSTUVWXYZ';let s='';for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s};
$('#bC').onclick=()=>{au();SF.ui();joinNet(mkCode(),true)};
$('#bJ').onclick=()=>{au();SF.ui();const c=$('#cd').value.trim().toUpperCase();if(c.length<4){toast('Wpisz kod pokoju');return}joinNet(c,false)};
$('#cd').onkeydown=e=>{if(e.key==='Enter')$('#bJ').click()};
$('#bL').onclick=()=>{au();SF.ui();ctx={mode:'local'};S={ph:'lobby',b:'k',pl:localPl(2),mv:[],sid:0};render()};
$('#lv').onclick=()=>{SF.ui();leave()};$('#bk').onclick=()=>{SF.ui();leave()};
$('#lc').onclick=()=>{try{navigator.clipboard.writeText(ctx.code);toast('Skopiowano kod')}catch(e){toast('Kod: '+ctx.code)}};
$('#bs').onclick=e=>{const b=e.target.closest('.bt');if(!b||b.disabled)return;SF.ui();S={...S,b:b.dataset.b};bc();renderLobby()};
$('#mi').onclick=()=>{if(S.pl.length>2){S={...S,pl:localPl(S.pl.length-1)};SF.ui();renderLobby()}};
$('#pu').onclick=()=>{if(S.pl.length<6){S={...S,pl:localPl(S.pl.length+1)};SF.ui();renderLobby()}};
$('#st').onclick=()=>{au();if(!S||S.pl.length<2)return;S={...S,ph:'play',mv:[],sid:S.sid+1,gid:Date.now().toString(36),all:ctx.mode==='net'?S.pl.map(p=>({uid:p.p,name:p.n})):[]};bc();render()};
$('#mu').onclick=()=>{mute=!mute;$('#mu').textContent=mute?'🔇':'🔊';if(!mute)SF.ui()};
function paintMe(){const n=$('#nick');if(n&&document.activeElement!==n)n.value=me.name;$('#me i').style.setProperty('--c',me.col)}
function initPrefs(){
  const n=window.__kroNick&&window.__kroNick(),c=window.__kroCol&&window.__kroCol();
  me.col=HEX.test(c||'')?c.toLowerCase():PAL[0];
  if(n){me.name=cleanN(n)||'Gracz';$('#nick').readOnly=true;$('#nick').title='Nick z Twojego konta'}
  else{$('#nick').readOnly=false;try{const v=cleanN(localStorage.getItem('kro_nick'));if(v)me.name=v}catch(e){}}
  paintMe();
  if(!window.__kroNet){$('#bC').disabled=$('#bJ').disabled=true;$('#nt2').textContent='Pokoje online są niedostępne (brak połączenia z Firebase) – zagraj lokalnie.'}
  else if(n)$('#nt2').textContent='Grasz jako '+me.name+' – wyniki trafią do Twoich statystyk.';
  else $('#nt2').textContent='Zaloguj się na konto, aby wyniki liczyły się do statystyk.'}
$('#nick').addEventListener('input',e=>{if(e.target.readOnly)return;me.name=cleanN(e.target.value)||'Gracz';try{localStorage.setItem('kro_nick',me.name)}catch(x){}paintMe()});
window.__kroLeave=function(){try{if(R)leave()}catch(e){}};
window.__kroRefresh=function(){if(!R)initPrefs()};
initPrefs();
